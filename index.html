// Würde `body` an der Pose `pose` etwas überlappen, mit dem er nach dem
// Loslassen zusammenstößt? `skip` enthält Körper, an die er sich heften würde.
function overlapAtPose(body, pose, skip) {
  if (!world || !body) return null;
  const xf = planck.Transform(V(pose.x, pose.y), pose.a);
  let lx = Infinity, ly = Infinity, ux = -Infinity, uy = -Infinity;
  const mine = [];
  for (let f = body.getFixtureList(); f; f = f.getNext()) {
    if (f.isSensor()) continue;
    const shape = f.getShape();
    for (let c = 0; c < childCount(shape); c++) {
      const aabb = new planck.AABB();
      shape.computeAABB(aabb, xf, c);
      lx = Math.min(lx, aabb.lowerBound.x); ly = Math.min(ly, aabb.lowerBound.y);
      ux = Math.max(ux, aabb.upperBound.x); uy = Math.max(uy, aabb.upperBound.y);
      mine.push({ f, proxy: proxyFor(shape, c) });
    }
  }
  if (!mine.length) return null;
  const found = [];
  world.queryAABB(planck.AABB(V(lx, ly), V(ux, uy)), (fixture) => {
    found.push(fixture);
    return true;
  });
  for (const fb of found) {
    const other = fb.getBody();
    if (other === body || fb.isSensor()) continue;
    if (skip && skip.has(other)) continue;
    const meta = bodyMeta.get(other);
    if (meta && (meta.kind === "star" || meta.kind === "rope")) continue;
    if (!body.shouldCollide(other) || nailLinked(body, other)) continue;
    const shape = fb.getShape();
    const xfb = other.getTransform();
    for (let c = 0; c < childCount(shape); c++) {
      const pb = proxyFor(shape, c);
      for (const m of mine) {
        if (!m.f.shouldCollide(fb)) continue;
        const input = new planck.DistanceInput();
        input.proxyA = m.proxy;
        input.proxyB = pb;
        input.transformA = xf;
        input.transformB = xfb;
        input.useRadii = true;
        const out = new planck.DistanceOutput();
        planck.Distance(out, new planck.SimplexCache(), input);
        if (out.distance <= 1e-6) return other;
      }
    }
  }
  return null;
}

// Nägel, an die sich der Körper beim Loslassen heften würde (wie attachExistingPins).
function dragPinTargets(body) {
  const meta = bodyMeta.get(body);
  if (!meta || body === ball) return [];
  const out = [];
  for (const pin of pins) {
    if (pin.body === body || pinHoldsBody(pin, body)) continue;
    if (playDrag && playDrag.body === body && inDragGroup(pin.body)) continue;
    const wp = pin.body.getWorldPoint(V(pin.local.x, pin.local.y));
    if (containsMeta(meta, wp.x, wp.y)) out.push(pin);
  }
  return out;
}

function lerpPose(p, q, t) {
  let da = q.a - p.a;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  return { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t, a: p.a + da * t };
}

// Überlappt eine der Posen (Map Körper → Pose) etwas außerhalb der Gruppe?
// `hosts` sind Nagelwirte, an die sich der gezogene Körper heften würde.
function groupOverlapAt(poses, hosts) {
  const skip = new Set(poses.keys());
  for (const [b, pose] of poses) {
    const s2 = new Set(skip);
    if (hosts && b === playDrag.body) for (const h of hosts) s2.add(h);
    if (overlapAtPose(b, pose, s2)) return true;
  }
  return false;
}

function lerpPoses(from, now, t) {
  const out = new Map();
  for (const [b, p] of now) out.set(b, lerpPose(from.get(b) || p, p, t));
  return out;
}

// Freie Nagelgruppe: Geist, Schatten und Rücksprung gelten für alle Körper.
function updateDragGhostGroup() {
  const body = playDrag.body;
  const now = new Map();
  for (const b of dragGroupBodies()) now.set(b, poseOfBody(b));
  const targets = dragPinTargets(body);
  const hosts = new Set(targets.map((p) => p.body));
  const hit = groupOverlapAt(now, hosts);
  playDrag.targets = hit ? [] : targets;
  playDrag.ghost = hit;
  if (!groupOverlapAt(now, null)) {
    playDrag.groupFree = now;
    playDrag.free = now.get(body);
    playDrag.wasFree = true;
    return;
  }
  if (playDrag.wasFree && playDrag.groupFree) {
    let lo = 0;
    let hi = 1;
    const from = playDrag.groupFree;
    for (let i = 0; i < GHOST_BISECT; i++) {
      const t = (lo + hi) / 2;
      if (groupOverlapAt(lerpPoses(from, now, t), null)) hi = t;
      else lo = t;
    }
    playDrag.groupFree = lerpPoses(from, now, lo);
    playDrag.free = playDrag.groupFree.get(body);
  }
  playDrag.wasFree = false;
}

// Nach jedem Physikschritt: Geist-Zustand und letzte freie Pose nachführen.
function updateDragGhost() {
  if (!playDrag || !playDrag.body || !playDrag.noCollide) return;
  if (playDrag.group) {
    updateDragGhostGroup();
    return;
  }
  const body = playDrag.body;
  const now = poseOfBody(body);
  const targets = dragPinTargets(body);
  const hosts = new Set(targets.map((p) => p.body));
  const hit = overlapAtPose(body, now, hosts);
  playDrag.targets = hit ? [] : targets;
  playDrag.ghost = !!hit;
  if (!overlapAtPose(body, now, null)) {
    playDrag.free = now;
    playDrag.wasFree = true;
    return;
  }
  // Gerade erst hineingeraten: letzte freie Pose bis an die Berührung heranschieben.
  if (playDrag.wasFree && playDrag.free) {
    let lo = 0;
    let hi = 1;
    const from = playDrag.free;
    for (let i = 0; i < GHOST_BISECT; i++) {
      const t = (lo + hi) / 2;
      if (overlapAtPose(body, lerpPose(from, now, t), null)) hi = t;
      else lo = t;
    }
    playDrag.free = lerpPose(from, now, lo);
  }
  playDrag.wasFree = false;
}

// Geist losgelassen: zurück an die letzte freie Pose, ohne Tempo.
function restoreDragFree(drag) {
  if (!drag || !drag.body || !drag.free || !world) return false;
  if (drag.group && drag.groupFree) {
    for (const [b, pose] of drag.groupFree) {
      if (b !== drag.body && !bodyMeta.has(b)) continue;
      b.setTransform(V(pose.x, pose.y), pose.a);
      b.setLinearVelocity(V(0, 0));
      b.setAngularVelocity(0);
      b.setAwake(true);
    }
    return true;
  }
  const body = drag.body;
  body.setTransform(V(drag.free.x, drag.free.y), drag.free.a);
  body.setLinearVelocity(V(0, 0));
  body.setAngularVelocity(0);
  body.setAwake(true);
  return true;
}
// Verbinden: ein kurzer, fast gerader Zug von unten nach oben.
// Vom Boden in einen aufliegenden festen Körper macht ihn statisch. Liegt ein
// Körper auf einem anderen, verbindet derselbe Zug die beiden starr
// (WeldJoint); die Gruppe bleibt beweglich. Seitliche Berührung verbindet
// nicht, der Strich bleibt eine Zeichnung. Ein Zug von oben nach unten
// verbindet nicht: der obere Körper wird verschoben, denn auf ihm ruht nichts.
// Ein Körper, auf dem noch etwas ruht, lässt sich nicht ziehen. Loslassen auf
// dem Boden verankert weiter. Trifft ein Zug vom Boden einen Körper ohne
// Kontakt, entsteht kein Strich; der Körper wird gegriffen.
// Der Verbindungsstrich sitzt fest an den beiden Gegenständen und wandert mit.
// Rechtsklick auf den Verbindungsstrich löst. Rechtsklick auf einen
// verbundenen Körper löscht ihn nicht.
const ANCHOR_MAX_LEN = 1.5;     // m, Weglänge des Zugs
const ANCHOR_MIN_LEN = 0.15;    // m, Sehne; kürzer ist ein Klick
const ANCHOR_STRAIGHT = 0.8;    // Sehne / Weglänge
const ANCHOR_MAX_BOW = 0.2;     // m, größte Abweichung von der Sehne
const ANCHOR_TOUCH = 0.05;      // m, Abstand, der noch als Berührung gilt
const ANCHOR_REST_UP = 0.65;    // Auflage: Normale von unten nach oben, steiler als eine Seitenlage
const ANCHOR_BASE_TOL = 0.15;   // m, Start so nah am Boden zählt als „auf dem Boden“
const ANCHOR_TARGET_TOL = 0.06; // m, Ende so nah am Umriss zählt als „im Körper“
const ANCHOR_LINK_HIT = 0.22;   // m, Rechtsklick-Abstand zum Verbindungsstrich

function anchorOf(body) {
  return anchors.find((a) => a.body === body) || null;
}

function isAnchored(body) {
  return !!anchorOf(body);
}

// Ziel oder Basis einer Verbindung. Solche Körper löscht ein Rechtsklick nicht.
function inAnchorLink(body) {
  if (!body) return false;
  return anchors.some((a) => a.body === body || (a.weld && a.base === body));
}

function weldNeighbors(body) {
  const out = [];
  if (!body) return out;
  for (const link of anchors) {
    if (!link.weld) continue;
    if (link.body === body && link.base && link.base !== ground) out.push(link.base);
    else if (link.base === body && link.body) out.push(link.body);
  }
  return out;
}

function weldComponent(body) {
  const group = [];
  const seen = new Set();
  const queue = [body];
  while (queue.length) {
    const cur = queue.pop();
    if (!cur || cur === ground || seen.has(cur)) continue;
    seen.add(cur);
    group.push(cur);
    for (const other of weldNeighbors(cur)) queue.push(other);
  }
  return group;
}

// Frei gezogen wird nur eine lose Gruppe. Starr und irgendwo fest: Physik hält.
function rigidDragHeld(body) {
  if (!body || weldComponent(body).length < 2) return false;
  return !freeNailGroup(body);
}

function syncWeldGroup(body) {
  const group = weldComponent(body);
  if (group.length < 2 || !body.isDynamic()) return;
  const w = body.getAngularVelocity();
  const v = body.getLinearVelocity();
  const com = body.getPosition();
  for (const b of group) {
    if (b === body || !b.isDynamic()) continue;
    const p = b.getPosition();
    b.setAngularVelocity(w);
    b.setLinearVelocity(V(v.x - w * (p.y - com.y), v.y + w * (p.x - com.x)));
    b.setAwake(true);
  }
}

function dropAnchorJoint(link) {
  if (!link || !link.joint) return;
  if (world && jointAlive(world, link.joint)) world.destroyJoint(link.joint);
  link.joint = null;
}

function makeAnchorWeld(base, body) {
  const wp = body.getPosition();
  return world.createJoint(new planck.WeldJoint({
    bodyA: base,
    bodyB: body,
    localAnchorA: base.getLocalPoint(wp),
    localAnchorB: body.getLocalPoint(wp),
    referenceAngle: body.getAngle() - base.getAngle(),
    frequencyHz: 0,
    dampingRatio: 0,
    collideConnected: false,
  }));
}

function anchorStrokeOk(trail) {
  if (!trail || trail.length < 2) return false;
  const a = trail[0];
  const b = trail[trail.length - 1];
  const chord = dist(a, b);
  let len = 0;
  let bow = 0;
  for (let i = 1; i < trail.length; i++) len += dist(trail[i - 1], trail[i]);
  for (const p of trail) bow = Math.max(bow, distPointSeg(p.x, p.y, a.x, a.y, b.x, b.y));
  return len <= ANCHOR_MAX_LEN && chord >= ANCHOR_MIN_LEN && chord >= ANCHOR_STRAIGHT * len && bow <= ANCHOR_MAX_BOW;
}

function insideDraw(d, x, y, tol) {
  if (!d || !d.body || !d.meta || !d.meta.outline || !d.meta.outline.closed) return false;
  const lp = d.body.getLocalPoint(V(x, y));
  return distToPoly(lp.x, lp.y, d.meta.outline.local) <= tol;
}

// Nur feste Körper: keine Drähte, keine Kugeln, keine Seile.
function anchorableAt(x, y) {
  for (let i = drawings.length - 1; i >= 0; i--) {
    const d = drawings[i];
    if (d.kind !== "solid" || !d.body || (d.meta && d.meta.round)) continue;
    if (insideDraw(d, x, y, ANCHOR_TARGET_TOL)) return d;
  }
  return null;
}

// Fester Körper unter dem Punkt, sonst der Boden. Freie Körper zählen mit,
// damit ein kurzer Strich zwei Gegenstände verbindet.
function anchorBaseAt(x, y, except) {
  // Strikt innen schlägt den Toleranzrand, damit der Nachbar an der Fuge
  // den Startkörper nicht stiehlt. Der Boden schlägt den bloßen Rand.
  let loose = null;
  for (let i = drawings.length - 1; i >= 0; i--) {
    const d = drawings[i];
    if (!d.body || d.body === except) continue;
    if (d.kind !== "solid" || (d.meta && d.meta.round)) continue;
    if (!d.body.isDynamic() && !isAnchored(d.body)) continue;
    if (insideDraw(d, x, y, 0)) return d.body;
    if (!loose && insideDraw(d, x, y, ANCHOR_BASE_TOL)) loose = d.body;
  }
  for (const g of geometry) {
    if (g.closed ? distToPoly(x, y, g.pts) <= ANCHOR_BASE_TOL : distToWire(x, y, g.pts) <= ANCHOR_BASE_TOL + 0.1) return ground;
  }
  return loose;
}

function solidAnchorDraw(body) {
  if (!body || body === ground) return null;
  const d = drawings.find((draw) => draw.body === body);
  if (!d || d.kind !== "solid" || (d.meta && d.meta.round)) return null;
  return d;
}

// Nächster Abstand und Richtung von a nach b (ny > 0: b liegt über a).
function bodyApproach(a, b) {
  let best = Infinity;
  let nx = 0;
  let ny = 0;
  if (!a || !b || a === b) return { distance: best, nx, ny };
  const xa = a.getTransform();
  const xb = b.getTransform();
  for (let fa = a.getFixtureList(); fa; fa = fa.getNext()) {
    for (let fb = b.getFixtureList(); fb; fb = fb.getNext()) {
      const ba = fa.getAABB(0);
      const bb = fb.getAABB(0);
      if (ba.lowerBound.x - bb.upperBound.x > best || bb.lowerBound.x - ba.upperBound.x > best) continue;
      if (ba.lowerBound.y - bb.upperBound.y > best || bb.lowerBound.y - ba.upperBound.y > best) continue;
      const input = new planck.DistanceInput();
      input.proxyA.set(fa.getShape(), 0);
      input.proxyB.set(fb.getShape(), 0);
      input.transformA = xa;
      input.transformB = xb;
      input.useRadii = true;
      const output = new planck.DistanceOutput();
      planck.Distance(output, new planck.SimplexCache(), input);
      if (output.distance >= best) continue;
      best = output.distance;
      const pa = output.pointA;
      const pb = output.pointB;
      let dx = pb.x - pa.x;
      let dy = pb.y - pa.y;
      let len = Math.hypot(dx, dy);
      if (len < 1e-5) {
        const ca = a.getPosition();
        const cb = b.getPosition();
        dx = cb.x - ca.x;
        dy = cb.y - ca.y;
        len = Math.hypot(dx, dy);
      }
      if (len > 1e-6) { nx = dx / len; ny = dy / len; }
    }
  }
  return { distance: best, nx, ny };
}

function bodyGap(a, b) {
  return bodyApproach(a, b).distance;
}

// upper liegt auf lower: sie berühren sich, und die Berührung kommt von oben.
// Teile derselben starren Verbindung zählen nicht als Auflage.
function restsOn(upper, lower) {
  if (!upper || !lower || upper === lower || lower === ground) return false;
  if (weldComponent(upper).indexOf(lower) >= 0) return false;
  const app = bodyApproach(lower, upper);
  return app.distance <= ANCHOR_TOUCH && app.ny >= ANCHOR_REST_UP;
}

function loadRestingOn(body) {
  if (!body || body === ground) return false;
  const group = weldComponent(body);
  for (let i = 0; i < group.length; i++) {
    const base = group[i];
    for (const d of drawings) {
      if (!d.body || group.indexOf(d.body) >= 0) continue;
      if (d.kind === "rope" || d.kind === "wire") continue;
      if (!d.body.isDynamic()) continue;
      if (restsOn(d.body, base)) return true;
    }
    if (typeof ball !== "undefined" && ball && group.indexOf(ball) < 0 && ball.isDynamic() && restsOn(ball, base)) return true;
  }
  return false;
}

function anchorAllowed(draw, base, groupTouch) {
  if (!world || world.isLocked() || !draw || !draw.body || !base) return false;
  const body = draw.body;
  if (draw.kind !== "solid" || (draw.meta && draw.meta.round)) return false;
  if (!body.isDynamic() || isAnchored(body) || base === body) return false;
  const freeze = base === ground || !base.isDynamic();
  if (freeze) {
    if (base !== ground && !isAnchored(base)) return false;
  } else if (!solidAnchorDraw(base)) {
    return false;
  }
  if (!freeze && weldComponent(body).indexOf(base) >= 0) return false;
  // Zwei freie oder ein fester Körper: nur verbinden, wenn der Zielkörper darauf ruht.
  if (base !== ground && !restsOn(body, base)) return false;
  if (groupTouch) {
    const group = weldComponent(body);
    if (!group.some((b) => bodyGap(b, base) <= ANCHOR_TOUCH)) return false;
  } else if (bodyGap(body, base) > ANCHOR_TOUCH) {
    return false;
  }
  return true;
}

function paintDraw(draw, color) {
  if (!draw) return;
  draw.color = color;
  if (draw.meta && draw.meta.outline) draw.meta.outline.color = color;
}

function groundColorAt(x, y) {
  let best = null;
  let bestD = Infinity;
  for (const item of scenery) {
    if (item.kind !== "poly" || !item.pts) continue;
    const d = distToPoly(x, y, item.pts);
    if (d < bestD) {
      bestD = d;
      best = item.color;
    }
  }
  return best || "#3f8f55";
}

function anchorTintColor(base, at) {
  if (base === ground) return groundColorAt(at.x, at.y);
  const host = drawings.find((d) => d.body === base);
  if (host && host.color) return host.color;
  const link = anchorOf(base);
  if (link) return anchorTintColor(link.base, link.a);
  return groundColorAt(at.x, at.y);
}

function freezeWeldGroup(body) {
  const group = weldComponent(body);
  for (const link of anchors) {
    if (!link.weld) continue;
    if (group.indexOf(link.body) < 0 && group.indexOf(link.base) < 0) continue;
    dropAnchorJoint(link);
  }
  for (const b of group) {
    if (playDrag && playDrag.body === b) endDrag();
    if (b.isDynamic()) b.setStatic();
    dragFresh.delete(b);
  }
  return group;
}

function thawWeldGroup(body) {
  const group = weldComponent(body);
  for (const b of group) {
    if (!bodyMeta.has(b)) continue;
    const own = anchorOf(b);
    if (own && own.freeze) continue;
    if (!b.isDynamic()) {
      b.setDynamic();
      b.setAwake(true);
    }
  }
  for (const link of anchors) {
    if (!link.weld || link.joint) continue;
    if (group.indexOf(link.body) < 0 || group.indexOf(link.base) < 0) continue;
    if (!link.body.isDynamic() || !link.base.isDynamic()) continue;
    link.joint = makeAnchorWeld(link.base, link.body);
  }
  for (let pass = 0; pass < 6; pass++) {
    for (const link of anchors) {
      if (!link.weld || group.indexOf(link.body) < 0) continue;
      paintDraw(link.draw, anchorTintColor(link.base, link.a));
    }
  }
}

// Enden am Gegenstand, nicht im Raum. Der Boden hat keine Lage und bleibt in Weltkoordinaten.
function anchorLinkLocals(base, body, from, to) {
  let localA = null;
  let localB = null;
  if (base && base !== ground && base.getLocalPoint) {
    const p = base.getLocalPoint(V(from.x, from.y));
    localA = { x: p.x, y: p.y };
  }
  if (body && body !== ground && body.getLocalPoint) {
    const p = body.getLocalPoint(V(to.x, to.y));
    localB = { x: p.x, y: p.y };
  }
  return { localA, localB };
}

function anchorLinkEnds(link) {
  let a = link.a;
  let b = link.b;
  if (link.localA && link.base && link.base !== ground && link.base.getWorldPoint) {
    const p = link.base.getWorldPoint(V(link.localA.x, link.localA.y));
    a = { x: p.x, y: p.y };
  }
  if (link.localB && link.body && link.body !== ground && link.body.getWorldPoint) {
    const p = link.body.getWorldPoint(V(link.localB.x, link.localB.y));
    b = { x: p.x, y: p.y };
  }
  return { a, b };
}

function anchorBody(draw, base, from, to, groupTouch) {
  if (!anchorAllowed(draw, base, groupTouch)) return false;
  const body = draw.body;
  if (playDrag && playDrag.body === body) endDrag();
  const freeze = base === ground || !base.isDynamic();
  const savedColor = draw.color;
  let joint = null;
  if (freeze) freezeWeldGroup(body);
  else joint = makeAnchorWeld(base, body);
  if (!freeze) dragFresh.delete(body);
  const locals = anchorLinkLocals(base, body, from, to);
  anchors.push({
    body, base, draw,
    a: { x: from.x, y: from.y },
    b: { x: to.x, y: to.y },
    localA: locals.localA,
    localB: locals.localB,
    color: savedColor,
    savedColor,
    weld: !freeze,
    freeze,
    joint,
  });
  const tint = anchorTintColor(base, from);
  paintDraw(draw, tint);
  if (freeze) {
    for (const b of weldComponent(body)) {
      const d = drawings.find((dr) => dr.body === b);
      if (d) paintDraw(d, tint);
    }
  }
  return true;
}

// Die Gruppe berührt die feste Basis. Der Gelenk-Eintrag landet am Wurzelkörper,
// der selbst noch keinen Anker hat.
function freezeJoinedOn(member, base, from, to) {
  if (!world || world.isLocked() || !member) return false;
  if (base !== ground && (base.isDynamic() || !isAnchored(base))) return false;
  const group = weldComponent(member);
  if (!group.some((b) => bodyGap(b, base) <= ANCHOR_TOUCH)) return false;
  const root = group.find((b) => !anchorOf(b));
  const draw = root && solidAnchorDraw(root);
  if (!draw) return false;
  return anchorBody(draw, base, from, to, true);
}

function releaseAnchor(body) {
  const link = anchorOf(body);
  if (!link || !world || world.isLocked()) return false;
  const wasFreeze = !!link.freeze;
  dropAnchorJoint(link);
  anchors = anchors.filter((a) => a !== link);
  if (link.savedColor) paintDraw(link.draw, link.savedColor);
  if (wasFreeze) {
    for (const dep of anchors.filter((a) => a.base === body && a.freeze)) releaseAnchor(dep.body);
    if (bodyMeta.has(body)) thawWeldGroup(body);
  } else if (bodyMeta.has(body) && !body.isDynamic()) {
    body.setDynamic();
    body.setAwake(true);
  }
  return true;
}

function releaseBodyAnchors(body) {
  if (!body) return;
  const pending = anchors.filter((a) => a.body === body || a.base === body);
  for (const link of pending) {
    if (anchors.indexOf(link) >= 0) releaseAnchor(link.body);
  }
}

function anchorLinkAt(x, y) {
  let best = null;
  let bestD = ANCHOR_LINK_HIT;
  for (const link of anchors) {
    const ends = anchorLinkEnds(link);
    const d = distPointSeg(x, y, ends.a.x, ends.a.y, ends.b.x, ends.b.y);
    if (d <= bestD) { bestD = d; best = link; }
  }
  return best;
}

function releaseAnchorAt(x, y) {
  const link = anchorLinkAt(x, y);
  return link ? releaseAnchor(link.body) : false;
}

// Gezeichneter Zug. "anchor" = verankert oder gelöst, "miss" = erkannt aber
// abgelehnt (kein Strich), false = kein Ankerversuch, weiterzeichnen.
function tryAnchorGesture(trail) {
  if (!world || !anchorStrokeOk(trail)) return false;
  const from = trail[0];
  if (nearestPin(from.x, from.y, NAIL_HIT)) return false;
  const to = trail[trail.length - 1];
  // Vom verankerten Körper zurück auf seine Basis: lösen.
  const startIn = anchorableAt(from.x, from.y);
  if (startIn && isAnchored(startIn.body)) {
    const back = anchorBaseAt(to.x, to.y, startIn.body);
    if (back && back === anchorOf(startIn.body).base) {
      releaseAnchor(startIn.body);
      return "anchor";
    }
  }
  const base = anchorBaseAt(from.x, from.y);
  if (!base) return false;
  const target = anchorableAt(to.x, to.y);
  if (!target || target.body === base) return false;
  if (isAnchored(target.body)) {
    const link = anchorOf(target.body);
    if (link && link.base === base) {
      releaseAnchor(target.body);
      return "anchor";
    }
    if (link && link.weld && (base === ground || !base.isDynamic())) {
      return freezeJoinedOn(target.body, base, from, to) ? "anchor" : "miss";
    }
    releaseAnchor(target.body);
    return "anchor";
  }
  // Seitliche Berührung ist kein Verbindungsstrich (der Strich bleibt eine Zeichnung).
  // Kein Kontakt bleibt ein Fehlversuch, damit der Zielkörper gegriffen wird.
  if (base !== ground && !restsOn(target.body, base)) {
    if (bodyGap(target.body, base) > ANCHOR_TOUCH) return "miss";
    return false;
  }
  if (anchorBody(target, base, from, to)) return "anchor";
  return "miss";
}

// Abgelehnte Ankergeste während des Ziehens: kein Strich, stattdessen greifen.
function tryAdoptAnchorGrab(trail) {
  if (!pointer || pointer.dragging || playDrag || !world) return false;
  if (!anchorStrokeOk(trail)) return false;
  if (pointer.nailClick) return false;
  const from = trail[0];
  if (nearestPin(from.x, from.y, NAIL_HIT)) return false;
  const to = trail[trail.length - 1];
  const base = anchorBaseAt(from.x, from.y);
  if (!base) return false;
  const target = anchorableAt(to.x, to.y);
  if (!target || target.body === base || isAnchored(target.body)) return false;
  if (anchorAllowed(target, base)) return false;
  const onBody = target.meta && containsMeta(target.meta, to.x, to.y);
  const grabAt = onBody ? to : target.body.getPosition();
  pointer.grab = { x: grabAt.x, y: grabAt.y };
  engageGrab(grabAt);
  if (!playDrag) {
    pointer.grab = null;
    return false;
  }
  pointer.moved = true;
  return true;
}

// Gegriffener Körper, Maus auf Boden oder verankertem Körper losgelassen.
function tryAnchorDragEnd(body, grabPt, trail) {
  if (!world || !anchorStrokeOk(trail)) return false;
  const to = trail[trail.length - 1];
  const draw = drawings.find((d) => d.body === body);
  if (!draw || insideDraw(draw, to.x, to.y, 0)) return false;
  const base = anchorBaseAt(to.x, to.y, body);
  if (!base || (base !== ground && base.isDynamic())) return false;
  return anchorBody(draw, base, to, grabPt);
}

function drawAnchorLinks() {
  for (const link of anchors) {
    const ends = anchorLinkEnds(link);
    crayonPath([ends.a, ends.b], link.color, 0.1);
    for (const p of [ends.a, ends.b]) {
      const s = worldToScreen(p.x, p.y);
      ctx.save();
      ctx.fillStyle = link.color;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(s.x, s.y, Math.max(2.5, 0.08 * camScale()), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function nudgeDirFromClick(ballX, clickX) {
  return clickX >= ballX ? 1 : -1;
}

function doNudge(dir) {
  if (!ball || won) return;
  if (simTime < (ball._cool || 0)) return;
  ball._cool = simTime + 0.4;
  stats.nudges += 1;
  ball.applyLinearImpulse(V(dir * 8.2, 0.55), ball.getWorldCenter(), true);
}

let solidSeq = 1;

function solidSpan(pts) {
  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  const w = maxX - minX;
  const h = maxY - minY;
  // Breite Bodenplatte, auf der ein Seil liegen bleiben darf. Pfosten nicht.
  return { floor: minY <= 0.05 && h <= 1.6 && w >= 8 };
}

// Planck hängt jede neue Fixture vorn an (m_fixtureList = fixture). `older`
// ist der bisherige Kopf, die Schleife trifft also nur die gerade erzeugten.
function stampSolidFixtures(body, older, solid) {
  for (let f = body.getFixtureList(); f && f !== older; f = f.getNext()) {
    f._solidId = solid.id;
    f._solidFloor = solid.floor;
  }
}

function solidAt(x, y) {
  for (let i = geometry.length - 1; i >= 0; i--) {
    const g = geometry[i];
    if (!g.closed || !g.solidId) continue;
    if (distToPoly(x, y, g.pts) <= 0.02) return g;
  }
  return null;
}

function addStaticSolid(pts, color) {
  const clean = ensureCCW(dedupe(pts));
  if (clean.length < 3) return;
  const span = solidSpan(clean);
  const solid = { id: solidSeq++, floor: span.floor };
  const older = ground.getFixtureList();
  const opt = fixtureOpt({ density: 0, friction: 0.5, restitution: 0 });
  if (!addConvexFixture(ground, clean, opt)) {
    const localTris = triangulate(clean.map((p) => ({ x: p.x, y: p.y })));
    const tris = localTris.length ? localTris : (() => {
      const hull = convexHull(clean);
      const t = [];
      for (let i = 1; i < hull.length - 1; i++) t.push([hull[0], hull[i], hull[i + 1]]);
      return t;
    })();
    for (const tri of tris) addTriFixture(ground, tri, opt);
  }
  stampSolidFixtures(ground, older, solid);
  geometry.push({ closed: true, pts: clean, solidId: solid.id, solidFloor: solid.floor });
  scenery.push({ kind: "poly", pts: clean, color, width: 0.16 });
}

function addStaticWire(pts, color) {
  const clean = dedupe(pts);
  if (clean.length < 2) return;
  const opt = fixtureOpt({ density: 0, friction: 0.55, restitution: 0 });
  for (const p of clean) ground.createFixture(new planck.Circle(V(p.x, p.y), 0.1), opt);
  for (let i = 0; i < clean.length - 1; i++) {
    const a = clean[i];
    const b = clean[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len < 0.05) continue;
    const shape = new planck.Box(len / 2, 0.1, V((a.x + b.x) / 2, (a.y + b.y) / 2), Math.atan2(b.y - a.y, b.x - a.x));
    ground.createFixture(shape, opt);
  }
  geometry.push({ closed: false, pts: clean });
  scenery.push({ kind: "line", pts: clean, color, width: 0.18 });
}

function makeBox(def) {
  const body = world.createDynamicBody({
    position: V(def.x, def.y),
    linearDamping: 0.15,
    angularDamping: 0.4,
  });
  body.createFixture(new planck.Box(def.hw, def.hh), fixtureOpt({
    density: def.density || 1,
    friction: 0.7,
  }));
  const local = [
    { x: -def.hw, y: -def.hh },
    { x: def.hw, y: -def.hh },
    { x: def.hw, y: def.hh },
    { x: -def.hw, y: def.hh },
  ];
  const meta = track(body, {
    kind: "draw",
    tag: def.tag || "",
    outline: { local, closed: true, color: MAT.wood, width: 0.12, fixed: false },
  });
  drawings.push({ kind: "solid", body, meta, color: MAT.wood, preset: true });
  if (def.pin) rememberPin(def.x, def.y + def.hh - 0.05, body, false);
  return body;
}

function makeRocket(def) {
  const body = world.createBody({
    type: "static",
    position: V(def.x, def.y),
    angle: def.a || 0,
    fixedRotation: true,
    linearDamping: 0.02,
  });
  body.createFixture(new planck.Box(0.85, 0.36), fixtureOpt({ density: 1.4, friction: 0.4, restitution: 0 }));
  const local = [
    { x: -0.9, y: -0.38 },
    { x: 0.55, y: -0.38 },
    { x: 1.15, y: 0 },
    { x: 0.55, y: 0.38 },
    { x: -0.9, y: 0.38 },
  ];
  const meta = track(body, {
    kind: "rocket",
    outline: { local, closed: true, color: "#d94b3a", width: 0.1, fixed: false },
  });
  const rocket = {
    x: def.x, y: def.y, a: def.a || 0,
    body, meta,
    mode: "idle",
    timer: 0,
    wait: 0,
    armed: false,
  };
  rockets.push(rocket);
  return rocket;
}

function ignite(rocket) {
  if (!rocket || rocket.mode !== "idle" || !rocket.armed) return;
  rocket.mode = "fly";
  rocket.timer = 2.3;
  rocket.body.setDynamic();
  rocket.body.setBullet(true);
  rocket.body.setAwake(true);
}

function resetBall() {
  if (!ball || !levelDef) return;
  ball.setTransform(V(levelDef.ball[0], levelDef.ball[1]), 0);
  ball.setLinearVelocity(V(0, 0));
  ball.setAngularVelocity(0);
  ball.setAwake(true);
}

function isWireMeta(meta) {
  return !!(meta && meta.outline && meta.outline.closed === false);
}

function attachPlayContacts(targetWorld) {
  targetWorld.on("begin-contact", (contact) => {
    if (layerContactOff(contact)) return;
    contactQ.push([contact.getFixtureA().getBody(), contact.getFixtureB().getBody()]);
  });
  targetWorld.on("pre-solve", (contact) => {
    if (layerContactOff(contact) || ropeOwnEndContact(contact) || ropeBirthBehindContact(contact)) {
      contact.setEnabled(false);
      return;
    }
    const ma = bodyMeta.get(contact.getFixtureA().getBody());
    const mb = bodyMeta.get(contact.getFixtureB().getBody());
    const roundA = ma && (ma.kind === "ball" || ma.round);
    const roundB = mb && (mb.kind === "ball" || mb.round);
    const ropeHit = (ma && ma.kind === "rope") || (mb && mb.kind === "rope");
    // Hanf gibt nicht nach: eine Kugel auf dem Seil soll liegen bleiben.
    if (ropeHit) contact.setRestitution(0);
    else if (roundA && roundB) contact.setRestitution(0.98);
    else if ((roundA || roundB) && !isWireMeta(ma) && !isWireMeta(mb)) {
      contact.setRestitution(BALL_RESTITUTION);
    }
    noteRopeCutContact(contact);
  });
}

function addSideWalls() {
  addStaticSolid([[-0.5, -2], [0.4, -2], [0.4, 18], [-0.5, 18]], "#c9b48a");
  addStaticSolid([[31.6, -2], [32.5, -2], [32.5, 18], [31.6, 18]], "#c9b48a");
}

function beginPlayWorld(def, opt) {
  clearWorld();
  levelDef = def;
  if (!opt || opt.resetCam !== false) resetCam();
  world = new planck.World(V(0, -24));
  attachPlayContacts(world);
  ground = world.createBody();
  track(ground, { kind: "level" });
  addSideWalls();
  for (const solid of (def && def.solids) || []) addStaticSolid(solid.pts, solid.color);
  for (const wire of (def && def.wires) || []) addStaticWire(wire.pts, wire.color);
  for (const d of (def && def.decor) || []) scenery.push({ kind: "line", pts: d.pts, color: d.color, width: d.width || 0.12 });
}

function addStarAt(x, y, got) {
  const body = world.createBody({ position: V(x, y) });
  body.createFixture(new planck.Circle(0.58), { isSensor: true, density: 0 });
  const meta = track(body, { kind: "star", got: !!got });
  stars.push(meta);
  return meta;
}

function spawnQuestBall(x, y) {
  ball = world.createDynamicBody({
    position: V(x, y),
    bullet: true,
    linearDamping: 0.01,
    angularDamping: 0.02,
  });
  ball.createFixture(new planck.Circle(BALL_R), {
    density: 3.2,
    friction: 0.12,
    restitution: 0,
  });
  track(ball, { kind: "ball" });
  return ball;
}

function buildLevel(def) {
  beginPlayWorld(def);
  for (const box of def.boxes || []) makeBox(box);
  for (const xy of def.pins || []) {
    const host = hostAt(xy[0], xy[1]);
    if (host) rememberPin(xy[0], xy[1], host, false);
  }
  for (const r of def.rockets || []) makeRocket(r);
  for (const xy of def.stars || []) addStarAt(xy[0], xy[1], false);
  spawnQuestBall(def.ball[0], def.ball[1]);
  mode = "play";
}

function handleContacts() {
  const batch = contactQ.splice(0);
  for (const [a, b] of batch) {
    const ma = bodyMeta.get(a);
    const mb = bodyMeta.get(b);
    if (!ma || !mb) continue;
    const star = ma.kind === "star" ? ma : mb.kind === "star" ? mb : null;
    const isBall = ma.kind === "ball" || mb.kind === "ball";
    if (star && isBall) star.got = true;
    if (isBall && (dragBodyHot(a) || dragBodyHot(b))) stats.dragTrick = true;
    const rocketMeta = ma.kind === "rocket" ? ma : mb.kind === "rocket" ? mb : null;
    const other = rocketMeta === ma ? mb : rocketMeta === mb ? ma : null;
    if (rocketMeta && other && other.kind !== "star" && other.body && other.body.isDynamic()) {
      const rocket = rockets.find((r) => r.meta === rocketMeta);
      ignite(rocket);
    }
  }
}

function step(dt) {
  if (!world) return;
  chaseDrag(dt);
  reelRopes(dt);
  simTime += dt;
  if (simTime > 0.35) {
    for (const rocket of rockets) rocket.armed = true;
  }
  const ropeLive = drawings.some((d) => d.kind === "rope" && d.bodies && d.bodies.length);
  world.step(dt, ropeLive ? 20 : 10, ropeLive ? 16 : 8);
  if (ropeLive) {
    tightenRopes();
    settlePulleyRiders();
  }
  snapDrag(dt);
  updateDragGhost();
  handleContacts();
  applyRopeCuts();
  stepDragFresh(dt);
  for (const rocket of rockets) {
    if (rocket.mode === "fly") {
      const angle = rocket.body.getAngle();
      rocket.body.applyForceToCenter(V(Math.cos(angle) * 78, Math.sin(angle) * 78), true);
      rocket.timer -= dt;
      if (rocket.timer <= 0) {
        rocket.mode = "gone";
        rocket.wait = 0.7;
        bodyMeta.delete(rocket.body);
        world.destroyBody(rocket.body);
        rocket.body = null;
      }
    } else if (rocket.mode === "gone") {
      rocket.wait -= dt;
      if (rocket.wait <= 0) {
        const fresh = makeRocket({ x: rocket.x, y: rocket.y, a: rocket.a });
        fresh.armed = true;
        rockets.splice(rockets.indexOf(rocket), 1);
      }
    }
  }
  if (ball) {
    const p = ball.getPosition();
    if (p.y < -1.5 || p.x < -2 || p.x > 34 || p.y > 28) resetBall();
  }
  if (!won && stars.length && stars.every((s) => s.got)) {
    won = true;
    if (!stats.dragTrick) {
      medals.elegant = stats.shapes === 1 && stats.nudges === 0;
      medals.oldschool = stats.nudges === 0 && stats.userPins === 0 && stats.ropes === 0 && !stats.drewUnder;
    }
    if (levelDef && !levelDef.sandbox && !levelDef.custom) {
      const store = progress();
      const prev = store.cleared[levelDef.id] || {};
      store.cleared[levelDef.id] = {
        elegant: !!(prev.elegant || medals.elegant),
        oldschool: !!(prev.oldschool || medals.oldschool),
      };
      saveJSON("crayon-progress", store);
    }
    if (!stats.dragTrick) burstConfetti();
  }
  stepConfetti(dt);
}

function burstConfetti() {
  const origins = [];
  for (const star of stars) {
    if (!star.body) continue;
    const p = star.body.getPosition();
    origins.push({ x: p.x, y: p.y });
  }
  if (!origins.length) return;
  const total = 20;
  const pieces = [];
  for (let i = 0; i < total; i++) {
    const origin = origins[i % origins.length];
    const pair = CONFETTI_PAIRS[i % CONFETTI_PAIRS.length];
    const swap = ((i * 17) % 3) === 0;
    const ang = Math.PI * (0.05 + ((i * 47) % 1000) / 1000 * 0.9);
    const speed = 5 + ((i * 91) % 1000) / 1000 * 9;
    const jitter = ((i * 13) % 100) / 100;
    pieces.push({
      ox: origin.x,
      oy: origin.y,
      x: origin.x,
      y: origin.y,
      vx: Math.cos(ang) * speed * (0.65 + jitter * 0.7),
      vy: Math.abs(Math.sin(ang)) * speed + 3.5,
      spin: (i % 628) / 100,
      spinV: (1.4 + ((i * 37) % 50) / 12) * (i % 2 ? 1 : -1),
      flip: ((i * 19) % 628) / 100,
      flipV: (1.6 + ((i * 53) % 50) / 10) * (i % 3 ? 1 : -1),
      w: 0.28 + ((i * 29) % 100) / 100 * 0.34,
      h: 0.12 + ((i * 31) % 100) / 100 * 0.2,
      front: swap ? pair[1] : pair[0],
      back: swap ? pair[0] : pair[1],
      delay: (i % 10) / 40,
      age: 0,
    });
  }
  confetti = pieces;
}

function stepConfetti(dt) {
  if (!confetti.length) return;
  const keep = [];
  for (const c of confetti) {
    c.age += dt;
    if (c.delay > 0) {
      c.delay -= dt;
      keep.push(c);
      continue;
    }
    c.vy -= 11 * dt;
    c.vx *= Math.exp(-0.35 * dt);
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.spin += c.spinV * dt;
    c.flip += c.flipV * dt;
    if (c.age < 8 && c.y > -4) keep.push(c);
  }
  confetti = keep;
}

function drawConfetti() {
  if (!confetti.length) return;
  const scale = camScale();
  for (const c of confetti) {
    const p = worldToScreen(c.x, c.y);
    const facing = Math.cos(c.flip);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(c.spin);
    ctx.scale(Math.max(0.05, Math.abs(facing)), 1);
    ctx.fillStyle = facing >= 0 ? c.front : c.back;
    const w = c.w * scale;
    const h = c.h * scale;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeStyle = "rgba(36,24,12,0.45)";
    ctx.lineWidth = 1;
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }
}

// Zeichnen mit abweichender Pose (Geisterschatten) und Deckkraft-Faktor (Geist).
let drawPose = null;
let inkAlpha = 1;

function bodyDrawPose(body) {
  if (drawPose && drawPose.body === body) return drawPose;
  const p = body.getPosition();
  return { x: p.x, y: p.y, a: body.getAngle() };
}

function outlineWorld(meta) {
  if (!meta || !meta.outline) return null;
  const pose = bodyDrawPose(meta.body);
  const c = Math.cos(pose.a);
  const s = Math.sin(pose.a);
  return meta.outline.local.map((p) => ({ x: pose.x + p.x * c - p.y * s, y: pose.y + p.x * s + p.y * c }));
}

function crayonPath(pts, color, width) {
  if (!pts || pts.length < 2) return;
  if (width === "live") {
    for (let i = 0; i < pts.length - 1; i++) {
      const w = pts[i].thick || pts[i + 1].thick || THICK;
      crayonPath([pts[i], pts[i + 1]], color, w);
    }
    return;
  }
  const scr = pts.map((p) => worldToScreen(p.x, p.y));
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = color;
  const passes = 3;
  for (let pass = 0; pass < passes; pass++) {
    ctx.globalAlpha = (pass === 0 ? 0.8 : 0.32) * inkAlpha;
    ctx.lineWidth = Math.max(1.4, width * camScale() * (pass === 0 ? 1 : 0.62));
    ctx.beginPath();
    for (let i = 0; i < scr.length; i++) {
      const jx = (hash(i, pass + 2) - 0.5) * 1.4;
      const jy = (hash(i, pass + 5) - 0.5) * 1.4;
      const x = scr[i].x + jx;
      const y = scr[i].y + jy;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function crayonFill(pts, color) {
  if (!pts || pts.length < 3) return;
  const scr = pts.map((p) => worldToScreen(p.x, p.y));
  ctx.save();
  ctx.beginPath();
  scr.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.globalAlpha = (0.28) * inkAlpha;
  ctx.fill();
  ctx.clip();
  ctx.globalAlpha = (0.18) * inkAlpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  const bounds = scr.reduce((b, p) => ({
    minX: Math.min(b.minX, p.x), maxX: Math.max(b.maxX, p.x),
    minY: Math.min(b.minY, p.y), maxY: Math.max(b.maxY, p.y),
  }), { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });
  for (let y = bounds.minY; y < bounds.maxY; y += 7) {
    ctx.beginPath();
    ctx.moveTo(bounds.minX - 4, y + (hash(y, 3) - 0.5) * 2);
    ctx.lineTo(bounds.maxX + 4, y + 3);
    ctx.stroke();
  }
  ctx.restore();
}

function steelLightPoint(wx, wy, reach) {
  const lx = -0.55;
  const ly = 0.62;
  const len = Math.hypot(lx, ly);
  return { x: wx + (lx / len) * reach, y: wy + (ly / len) * reach };
}

function fillSteelHighlight(sx, sy, rad) {
  const grd = ctx.createRadialGradient(sx, sy, Math.max(0.5, rad * 0.02), sx, sy, rad * 0.55);
  grd.addColorStop(0, "rgba(255,255,255,0.9)");
  grd.addColorStop(0.28, "rgba(236,242,248,0.42)");
  grd.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grd;
  ctx.globalAlpha = (1) * inkAlpha;
  ctx.beginPath();
  ctx.arc(sx, sy, rad * 0.55, 0, Math.PI * 2);
  ctx.fill();
}

function drawSteelMark(sx, sy, rad, angle, quest) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-angle);
  if (quest) {
    ctx.strokeStyle = "#8a3a32";
    ctx.lineWidth = Math.max(1.6, rad * 0.14);
    ctx.beginPath();
    ctx.arc(0, 0, rad * 0.62, -0.55, 0.55);
    ctx.stroke();
  } else {
    ctx.strokeStyle = "rgba(40,45,52,0.5)";
    ctx.lineWidth = Math.max(1.3, rad * 0.09);
    ctx.beginPath();
    ctx.moveTo(-rad * 0.58, 0);
    ctx.lineTo(rad * 0.58, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(rad * 0.28, 0, Math.max(1.2, rad * 0.11), 0, Math.PI * 2);
    ctx.fillStyle = "rgba(40,45,52,0.45)";
    ctx.fill();
  }
  ctx.restore();
}

function drawSteelCircle(wx, wy, r, angle, quest) {
  const s = worldToScreen(wx, wy);
  const rad = r * camScale();
  ctx.save();
  ctx.beginPath();
  ctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
  ctx.fillStyle = MAT.steel;
  ctx.globalAlpha = (0.96) * inkAlpha;
  ctx.fill();
  ctx.strokeStyle = MAT.steelDark;
  ctx.globalAlpha = (0.9) * inkAlpha;
  ctx.lineWidth = Math.max(1.5, rad * 0.08);
  ctx.stroke();
  drawSteelMark(s.x, s.y, rad, angle || 0, quest);
  ctx.beginPath();
  ctx.arc(s.x, s.y, Math.max(0, rad - 0.5), 0, Math.PI * 2);
  ctx.clip();
  const hiW = steelLightPoint(wx, wy, r * 0.45);
  const hi = worldToScreen(hiW.x, hiW.y);
  fillSteelHighlight(hi.x, hi.y, rad);
  ctx.restore();
}

function drawSteelEllipse(draw) {
  if (!draw || !draw.body) return;
  const pos = bodyDrawPose(draw.body);
  const phi = pos.a + (draw.angle || 0);
  const pts = ellipseWorldPts(draw, 48);
  const scr = pts.map((p) => worldToScreen(p.x, p.y));
  const scale = camScale();
  ctx.save();
  ctx.beginPath();
  scr.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.closePath();
  ctx.fillStyle = MAT.steel;
  ctx.globalAlpha = (0.96) * inkAlpha;
  ctx.fill();
  ctx.strokeStyle = MAT.steelDark;
  ctx.globalAlpha = (0.9) * inkAlpha;
  ctx.lineWidth = Math.max(1.5, Math.min(draw.a, draw.b) * scale * 0.08);
  ctx.stroke();
  const ca = Math.cos(phi);
  const sa = Math.sin(phi);
  const a0 = worldToScreen(pos.x - draw.a * 0.55 * ca, pos.y - draw.a * 0.55 * sa);
  const a1 = worldToScreen(pos.x + draw.a * 0.55 * ca, pos.y + draw.a * 0.55 * sa);
  ctx.beginPath();
  ctx.strokeStyle = "rgba(40,45,52,0.5)";
  ctx.lineWidth = Math.max(1.3, Math.min(draw.a, draw.b) * scale * 0.09);
  ctx.moveTo(a0.x, a0.y);
  ctx.lineTo(a1.x, a1.y);
  ctx.stroke();
  ctx.beginPath();
  scr.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.closePath();
  ctx.clip();
  const lx = -0.55;
  const ly = 0.62;
  const len = Math.hypot(lx, ly);
  const dx = lx / len;
  const dy = ly / len;
  const u = dx * ca + dy * sa;
  const v = -dx * sa + dy * ca;
  const reach = 1 / Math.sqrt((u * u) / (draw.a * draw.a) + (v * v) / (draw.b * draw.b));
  const hi = worldToScreen(pos.x + dx * reach * 0.5, pos.y + dy * reach * 0.5);
  fillSteelHighlight(hi.x, hi.y, Math.min(draw.a, draw.b) * scale);
  ctx.restore();
}

function drawBall() {
  if (!ball) return;
  const p = ball.getPosition();
  drawSteelCircle(p.x, p.y, BALL_R, ball.getAngle(), true);
}

function drawStar(meta) {
  const p = meta.body.getPosition();
  const s = worldToScreen(p.x, p.y);
  const wobble = meta.got ? 0.9 : 1 + Math.sin(simTime * 3 + p.x) * 0.06;
  const r = 0.46 * camScale() * wobble;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(meta.got ? 0 : simTime * 0.4);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.46;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = meta.got ? "#c9a24a" : "#f2c14b";
  ctx.globalAlpha = meta.got ? 0.55 : 0.95;
  ctx.fill();
  ctx.strokeStyle = "#a67820";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

// Schlichter Nagel: 0. Laufender Motor: Pfeil dreht mit der Physik.
// Stehender Motornagel: Speichen drehen nur mit dem Seil (rollAngle).
function pinGlyphAngle(pin) {
  const motor = pin.motor || 0;
  if (motor) return -motor * simTime * NAIL_MOTOR_SPEED;
  if (pin.isMotor) return -(pin.rollAngle || 0);
  return 0;
}

function drawPin(pin) {
  const p = pinWorld(pin);
  const s = worldToScreen(p.x, p.y);
  const r = 0.16 * camScale();
  const motor = pin.motor || 0;
  ctx.save();
  ctx.translate(s.x, s.y);
  if (motor && pinReelsRope(pin)) {
    // Seilwinde: Spule im wirksamen Radius, Hanf aufgewickelt.
    const sr = winchParams().spool * camScale();
    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = "rgba(201,165,106,0.35)";
    ctx.strokeStyle = MAT.hemp;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, sr, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, sr * 0.72, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (!motor && !pin.isMotor) {
    // Schlichter Nagel: kleiner, schwarz gefüllt. Kein Rad, kein Pfeil.
    ctx.fillStyle = "#141414";
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.46, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }
  ctx.strokeStyle = motor ? (motor > 0 ? "#1f7a4c" : "#8a3a22") : "#24324a";
  ctx.fillStyle = "#f4e6c6";
  ctx.lineWidth = motor ? 2.4 : 2;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  if (motor) {
    // Bildschirm-y zeigt nach unten: Motor +1 (links, gegen den Uhrzeigersinn
    // in der Welt) dreht auf dem Bildschirm mit negativem Canvas-Winkel.
    ctx.rotate(pinGlyphAngle(pin));
    const ar = r * 0.82;
    ctx.beginPath();
    ctx.arc(0, 0, ar, -0.95, 0.95);
    ctx.stroke();
    // Pfeilspitze am vorderen Bogenende, tangential in Drehrichtung.
    const sgn = motor > 0 ? -1 : 1;           // Canvas-Drehsinn
    const end = 0.95 * sgn;
    const tipA = end + sgn * 0.55;
    const w = r * 0.24;
    ctx.beginPath();
    ctx.moveTo(Math.cos(tipA) * ar, Math.sin(tipA) * ar);
    ctx.lineTo(Math.cos(end) * (ar + w), Math.sin(end) * (ar + w));
    ctx.lineTo(Math.cos(end) * (ar - w), Math.sin(end) * (ar - w));
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
  } else if (pin.isMotor) {
    // Motornagel im Stillstand = Umlenkrolle: Rad mit Speichen, das sich mit
    // dem darüber laufenden Seil mitdreht (pin.rollAngle, 42-umlenkrolle.js).
    ctx.strokeStyle = "#2f5d8a";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.rotate(pinGlyphAngle(pin));
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const a = k * Math.PI / 3;
      ctx.moveTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85);
      ctx.lineTo(-Math.cos(a) * r * 0.85, -Math.sin(a) * r * 0.85);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawRope(draw) {
  const pts = [];
  for (const body of draw.bodies) {
    if (!bodyMeta.has(body)) continue;
    const p = body.getPosition();
    pts.push({ x: p.x, y: p.y });
  }
  crayonPath(pts, draw.color || MAT.hemp, 0.09);
}

function drawRocket(rocket) {
  if (!rocket.body) return;
  const pts = outlineWorld(rocket.meta);
  if (!pts) return;
  crayonFill(pts, "#d4533c");
  crayonPath(pts.concat([pts[0]]), "#8d2b22", 0.1);
  if (rocket.mode === "fly") {
    const angle = rocket.body.getAngle();
    const tail = rocket.body.getWorldPoint(V(-0.95, 0));
    for (let i = 0; i < 4; i++) {
      const len = 0.4 + hash(i, Math.floor(simTime * 20)) * 0.7;
      const spread = (i - 1.5) * 0.12;
      const tip = {
        x: tail.x - Math.cos(angle + spread) * len,
        y: tail.y - Math.sin(angle + spread) * len,
      };
      crayonPath([{ x: tail.x, y: tail.y }, tip], i % 2 ? "#f2c14b" : "#ef8b2c", 0.1);
    }
  }
}

function drawGeoGrid() {
  const inset = viewInset();
  const tl = screenToWorld(0, inset.top);
  const br = screenToWorld(viewW, viewH - inset.bottom);
  const minX = Math.min(tl.x, br.x);
  const maxX = Math.max(tl.x, br.x);
  const minY = Math.min(tl.y, br.y);
  const maxY = Math.max(tl.y, br.y);
  const x0 = Math.ceil(minX / GEO_GRID - 1e-6) * GEO_GRID;
  const y0 = Math.ceil(minY / GEO_GRID - 1e-6) * GEO_GRID;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, inset.top, viewW, Math.max(0, viewH - inset.top - inset.bottom));
  ctx.clip();
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x <= maxX + 1e-6; x += GEO_GRID) {
    const a = worldToScreen(x, minY);
    const b = worldToScreen(x, maxY);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  for (let y = y0; y <= maxY + 1e-6; y += GEO_GRID) {
    const a = worldToScreen(minX, y);
    const b = worldToScreen(maxX, y);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  ctx.strokeStyle = "rgba(43,43,43,0.12)";
  ctx.stroke();
  ctx.beginPath();
  for (let x = x0; x <= maxX + 1e-6; x += GEO_GRID) {
    if (Math.abs(x / GEO_GRID) % 2 > 0.1) continue;
    const a = worldToScreen(x, minY);
    const b = worldToScreen(x, maxY);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  for (let y = y0; y <= maxY + 1e-6; y += GEO_GRID) {
    if (Math.abs(y / GEO_GRID) % 2 > 0.1) continue;
    const a = worldToScreen(minX, y);
    const b = worldToScreen(maxX, y);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  ctx.strokeStyle = "rgba(43,43,43,0.2)";
  ctx.stroke();
  ctx.restore();
}

function renderPlay() {
  if (geoSnap) drawGeoGrid();
  for (const item of scenery) {
    if (item.kind === "poly") {
      crayonFill(item.pts, item.color);
      crayonPath(item.pts.concat([item.pts[0]]), item.color, item.width || 0.16);
    } else crayonPath(item.pts, item.color, item.width || 0.14);
  }
  for (const rocket of rockets) drawRocket(rocket);
  // Ebenen: hinten nach vorn; der Körper an der Maus kommt ganz zuletzt.
  // Eine freie Nagelgruppe kommt als Ganzes nach vorn, in ihrer Ebenenfolge.
  const held = playDrag && playDrag.body ? playDrag.body : null;
  const heldDraws = [];
  for (const draw of drawingsByLayer()) {
    if (held && draw.body && draw.kind !== "rope" && inDragGroup(draw.body)) {
      heldDraws.push(draw);
      continue;
    }
    drawDrawing(draw);
  }
  drawAnchorLinks();
  for (const pin of pins) drawPin(pin);
  for (const star of stars) drawStar(star);
  drawBall();
  if (heldDraws.length) drawHeldDrawings(heldDraws);
  if (pointer && pointer.pts && pointer.pts.length) {
    crayonPath(pointer.pts, MAT.ink, pointer.pts.some((p) => p.thick) ? "live" : THICK);
  }
  if (shotCaptions) {
    for (const cap of shotCaptions) {
      const s = worldToScreen(cap.x, cap.y);
      label(cap.text, s.x, s.y, 22, "#3a2a1c", "center");
    }
  }
}

function drawDrawing(draw) {
  if (draw.kind === "rope") drawRope(draw);
  else if (draw.kind === "blob" || draw.kind === "roller") {
    const p = bodyDrawPose(draw.body);
    drawSteelCircle(p.x, p.y, draw.r, p.a, false);
  } else if (draw.kind === "ellipse") {
    drawSteelEllipse(draw);
  } else if (draw.meta) {
    const pts = outlineWorld(draw.meta);
    if (!pts) return;
    if (draw.meta.outline && draw.meta.outline.closed) {
      crayonFill(pts, draw.color);
      crayonPath(pts.concat([pts[0]]), draw.color, 0.13);
    } else crayonPath(pts, draw.color, (draw.meta && draw.meta.thick) || THICK);
  }
}

// Gezogener Körper (bzw. freie Nagelgruppe): ganz vorn. Als Geist halb
// durchsichtig, dazu je ein blasser Schatten an der letzten freien Pose. Über einem Nagel wird der Nagel markiert.
function drawHeldDrawings(draws) {
  const drag = playDrag;
  if (drag && drag.ghost && drag.free) {
    for (const draw of draws) {
      const pose = drag.groupFree ? drag.groupFree.get(draw.body) : (draw.body === drag.body ? drag.free : null);
      if (!pose) continue;
      drawPose = { body: draw.body, x: pose.x, y: pose.y, a: pose.a };
      inkAlpha = GHOST_SHADOW_ALPHA;
      drawDrawing(draw);
      drawPose = null;
    }
  }
  inkAlpha = drag && drag.ghost ? GHOST_ALPHA : 1;
  for (const draw of draws) drawDrawing(draw);
  inkAlpha = 1;
  // Die Nägel, die die Gruppe zusammenhalten, bleiben sichtbar.
  if (drag && drag.group) for (const pin of pins) if (inDragGroup(pin.body)) drawPin(pin);
  if (drag && !drag.ghost && drag.targets && drag.targets.length) {
    for (const pin of drag.targets) {
      drawPin(pin);
      const p = pinWorld(pin);
      const s = worldToScreen(p.x, p.y);
      ctx.save();
      ctx.strokeStyle = "#3c7fd6";
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 0.3 * camScale(), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function ellipseWorldPts(draw, n) {
  if (!draw || !draw.body) return [];
  const pos = bodyDrawPose(draw.body);
  const rot = pos.a;
  const phi = draw.angle || 0;
  const ca = Math.cos(phi);
  const sa = Math.sin(phi);
  const cr = Math.cos(rot);
  const sr = Math.sin(rot);
  const pts = [];
  const count = Math.max(8, n | 0);
  for (let i = 0; i <= count; i++) {
    const t = (i / count) * Math.PI * 2;
    const u = draw.a * Math.cos(t);
    const v = draw.b * Math.sin(t);
    const lx = u * ca - v * sa;
    const ly = u * sa + v * ca;
    pts.push({ x: pos.x + lx * cr - ly * sr, y: pos.y + lx * sr + ly * cr });
  }
  return pts;
}

function circlePts(x, y, r, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r });
  }
  return pts;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function button(x, y, w, h, label, onClick, opt) {
  opt = opt || {};
  ui.push({ x, y, w, h, onClick });
  ctx.save();
  roundRect(x, y, w, h, 12);
  ctx.fillStyle = opt.on ? "rgba(60,127,214,0.28)" : "rgba(255,252,240,0.72)";
  ctx.fill();
  ctx.strokeStyle = opt.locked ? "#b7a88a" : "#5c4632";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = opt.locked ? "#8a7b64" : "#3a2a1c";
  ctx.font = (opt.size || 18) + "px 'Segoe Print', 'Comic Sans MS', cursive";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.restore();
}

function label(text, x, y, size, color, align) {
  ctx.save();
  ctx.fillStyle = color || "#3a2a1c";
  ctx.font = size + "px 'Segoe Print', 'Comic Sans MS', cursive";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawHUD() {
  if (!levelDef) return;
  label(levelDef.name, 24, 16, 28);
  label(levelDef.hint || "", 24, 50, 16, "#5c4632");
  const got = stars.filter((s) => s.got).length;
  label("Sterne " + got + "/" + stars.length, 24, 76, 16, "#8a5a20");
  if (stats.shapes === 1 && stats.nudges === 0) label("bisher elegant", 150, 76, 16, "#3e9a48");
  const geoW = 36;
  const geoH = 22;
  const geoX = viewW - 24 - geoW;
  const geoY = 18;

  ctx.moveTo(ax + 3.2, ay);
  ctx.lineTo(ax + 3.2, ay - 3.2);
