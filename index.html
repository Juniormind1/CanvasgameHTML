  // Die Sehne im Löser hält das Seil normalerweise; hier wird nur noch
  // nachgefasst, wenn sie bei harten Stößen merklich nachgibt.
  const slack = draw.chordJoint ? ROPE_CHORD_SLIP * draw.restLength : 0;
  if (chord <= maxL + slack + 1e-6) return;
  const nx = (b.x - a.x) / chord;
  const ny = (b.y - a.y) / chord;
  const infoA = pinPointInfo(draw.pinA, nx, ny);
  const infoB = pinPointInfo(draw.pinB, nx, ny);
  const kSum = (infoA ? infoA.k : 0) + (infoB ? infoB.k : 0);
  if (!(kSum > 0)) return;
  // Trenngeschwindigkeit der beiden Nagelpunkte entlang des Seils aufheben.
  const vA = infoA ? pinPointVelocity(infoA) : { x: 0, y: 0 };
  const vB = infoB ? pinPointVelocity(infoB) : { x: 0, y: 0 };
  const vSep = (vB.x - vA.x) * nx + (vB.y - vA.y) * ny;
  if (vSep > 0) {
    const jv = vSep / kSum;
    if (infoA) infoA.body.applyLinearImpulse(V(nx * jv, ny * jv), V(infoA.p.x, infoA.p.y), true);
    if (infoB) infoB.body.applyLinearImpulse(V(-nx * jv, -ny * jv), V(infoB.p.x, infoB.p.y), true);
  }
  // Lage korrigieren: Nagelpunkte zurück auf Seillänge, mit Drehung.
  const lambda = (chord - maxL) / kSum;
  const ends = [
    [infoA, 1, draw.bodies[0], draw.pinA],
    [infoB, -1, draw.bodies[draw.bodies.length - 1], draw.pinB],
  ];
  for (const [info, sign, bead, pin] of ends) {
    if (!info) continue;
    const before = pinWorld(pin);
    shiftPinBody(info, nx * lambda * sign, ny * lambda * sign);
    const after = pinWorld(pin);
    if (bead) {
      const p = bead.getPosition();
      bead.setPosition(V(p.x + after.x - before.x, p.y + after.y - before.y));
    }
  }
}

function scaleRopeToRest(draw) {
  if (!draw || !draw.bodies || draw.restLength == null) return;
  // Freies oder geschnittenes Ende nicht auf eine Sehne zwischen den
  // Endperlen zusammenziehen, sonst hängt ein einseitiges Seil falsch.
  if (!draw.pinA || !draw.pinB) return;
  if (!draw.fixedPins && (pinBodyMass(draw.pinA) > 0 || pinBodyMass(draw.pinB) > 0)) return;
  const bodies = draw.bodies.filter((b) => b && (typeof b.isValid !== "function" || b.isValid()));
  if (bodies.length < 3) return;
  const pts = bodies.map((b) => {
    const p = b.getPosition();
    return { x: p.x, y: p.y };
  });
  const live = pathLength(pts);
  const maxL = draw.restLength * ROPE_MAX_STRETCH;
  if (live <= maxL) return;
  const a = pts[0];
  const b = pts[pts.length - 1];
  const chord = dist(a, b) || 1e-9;
  const frac = [];
  let acc = 0;
  frac[0] = 0;
  for (let i = 1; i < pts.length; i++) {
    acc += dist(pts[i - 1], pts[i]);
    frac[i] = acc;
  }
  const total = acc || 1;
  const chordPts = pts.map((_, i) => ({
    x: a.x + (b.x - a.x) * (frac[i] / total),
    y: a.y + (b.y - a.y) * (frac[i] / total),
  }));
  let lo = 0;
  let hi = 1;
  let best = 1;
  for (let k = 0; k < 12; k++) {
    const t = (lo + hi) / 2;
    let len = 0;
    let px = pts[0].x;
    let py = pts[0].y;
    for (let i = 1; i < pts.length; i++) {
      const x = pts[i].x + (chordPts[i].x - pts[i].x) * t;
      const y = pts[i].y + (chordPts[i].y - pts[i].y) * t;
      len += Math.hypot(x - px, y - py);
      px = x;
      py = y;
    }
    if (len > maxL) lo = t;
    else {
      hi = t;
      best = t;
    }
  }
  for (let i = 1; i < bodies.length - 1; i++) {
    const x = pts[i].x + (chordPts[i].x - pts[i].x) * best;
    const y = pts[i].y + (chordPts[i].y - pts[i].y) * best;
    bodies[i].setPosition(V(x, y));
  }
}

function tightenRopes(list) {
  const src = list || drawings;
  for (const draw of src) {
    if (draw && draw.kind === "rope") {
      tightenRopeDraw(draw);
      if (!draw.pulley) limitRopeChord(draw);
      scaleRopeToRest(draw);
    }
  }
}

function velocityAt(body, wx, wy) {
  const v = body.getLinearVelocity();
  const w = body.getAngularVelocity();
  const p = body.getPosition();
  return { x: v.x - w * (wy - p.y), y: v.y + w * (wx - p.x) };
}

function ropeTips(worldPts, maxAng) {
  if (!worldPts || worldPts.length < 3) return [];
  const ccw = ensureCCW(worldPts.map((p) => ({ x: p.x, y: p.y })));
  const angs = interiorAngles(ccw);
  const tips = [];
  for (let i = 0; i < ccw.length; i++) {
    if (angs[i] >= maxAng) continue;
    const prev = ccw[(i + ccw.length - 1) % ccw.length];
    const cur = ccw[i];
    const next = ccw[(i + 1) % ccw.length];
    const e1x = prev.x - cur.x;
    const e1y = prev.y - cur.y;
    const e2x = next.x - cur.x;
    const e2y = next.y - cur.y;
    const l1 = Math.hypot(e1x, e1y) || 1;
    const l2 = Math.hypot(e2x, e2y) || 1;
    let ox = -(e1x / l1 + e2x / l2);
    let oy = -(e1y / l1 + e2y / l2);
    const lo = Math.hypot(ox, oy) || 1;
    tips.push({ x: cur.x, y: cur.y, nx: ox / lo, ny: oy / lo, ang: angs[i] });
  }
  return tips;
}

function ropeTangentAtBead(draw, index, contact) {
  const bodies = draw.bodies;
  const i = index;
  let ax, ay, bx, by;
  if (i > 0 && i < bodies.length - 1) {
    const pa = bodies[i - 1].getPosition();
    const pb = bodies[i + 1].getPosition();
    ax = pa.x;
    ay = pa.y;
    bx = pb.x;
    by = pb.y;
  } else if (i < bodies.length - 1) {
    const pa = bodies[i].getPosition();
    const pb = bodies[i + 1].getPosition();
    ax = pa.x;
    ay = pa.y;
    bx = pb.x;
    by = pb.y;
  } else if (i > 0) {
    const pa = bodies[i - 1].getPosition();
    const pb = bodies[i].getPosition();
    ax = pa.x;
    ay = pa.y;
    bx = pb.x;
    by = pb.y;
  } else return null;
  const d = Math.hypot(bx - ax, by - ay) || 1;
  return { x: (bx - ax) / d, y: (by - ay) / d };
}

// Perlen liegen vor den Gegenständen, in denen die eigenen Endnägel stecken,
// und stoßen nicht mit ihnen zusammen. Sonst hängt das Seil nicht von Nagel
// zu Nagel durch, sondern bleibt an A und B hängen. Der Boden als Liegefläche
// (breite, flache Platte) bleibt ein Hindernis. Levelpfosten sind eigene
// Flächen desselben Bodenkörpers und zählen als Nagelwirt.
function ropePinHosts(draw, body) {
  if (!draw || !body) return false;
  if (draw.pinA && draw.pinA.body === body) return true;
  if (draw.pinB && draw.pinB.body === body) return true;
  return false;
}

function ropeOwnEndContact(contact) {
  const fa = contact.getFixtureA();
  const fb = contact.getFixtureB();
  const ba = fa.getBody();
  const bb = fb.getBody();
  const ma = bodyMeta.get(ba);
  const mb = bodyMeta.get(bb);
  let beadMeta = null;
  let other = null;
  let otherFix = null;
  if (ma && ma.kind === "rope" && !(mb && mb.kind === "rope")) {
    beadMeta = ma;
    other = bb;
    otherFix = fb;
  } else if (mb && mb.kind === "rope" && !(ma && ma.kind === "rope")) {
    beadMeta = mb;
    other = ba;
    otherFix = fa;
  }
  if (!beadMeta || !other) return false;
  for (const d of drawings) {
    if (d.kind !== "rope" || d.ropeId !== beadMeta.ropeId) continue;
    if (other !== ground) return ropePinHosts(d, other);
    const sid = otherFix && otherFix._solidId;
    if (!sid) return false;
    const skipA = d.pinA && d.pinA.body === ground && d.pinA.solidId === sid && !d.pinA.solidFloor;
    const skipB = d.pinB && d.pinB.body === ground && d.pinB.solidId === sid && !d.pinB.solidFloor;
    return !!(skipA || skipB);
  }
  return false;
}

// Körper, der über diesem Seil gezeichnet wurde, fällt dahinter durch.
function ropeBirthBehindContact(contact) {
  const ma = bodyMeta.get(contact.getFixtureA().getBody());
  const mb = bodyMeta.get(contact.getFixtureB().getBody());
  let ropeId = null;
  let other = null;
  if (ma && ma.kind === "rope" && !(mb && mb.kind === "rope")) {
    ropeId = ma.ropeId;
    other = mb;
  } else if (mb && mb.kind === "rope" && !(ma && ma.kind === "rope")) {
    ropeId = mb.ropeId;
    other = ma;
  }
  if (ropeId == null || !other || !other.behindRopeIds) return false;
  return other.behindRopeIds.indexOf(ropeId) >= 0;
}

function noteRopeCutContact(contact) {
  const ba = contact.getFixtureA().getBody();
  const bb = contact.getFixtureB().getBody();
  const ma = bodyMeta.get(ba);
  const mb = bodyMeta.get(bb);
  if (!ma || !mb) return;
  let bead = null;
  let cutter = null;
  let cutMeta = null;
  if (ma.kind === "rope" && mb.kind !== "rope") {
    bead = ba;
    cutter = bb;
    cutMeta = mb;
  } else if (mb.kind === "rope" && ma.kind !== "rope") {
    bead = bb;
    cutter = ba;
    cutMeta = ma;
  } else return;
  if (!cutMeta || cutMeta.kind === "ball" || cutMeta.kind === "star" || cutMeta.kind === "wire" || cutMeta.round) return;
  const wm = contact.getWorldManifold && contact.getWorldManifold();
  if (!wm || !wm.pointCount) return;
  const pt = wm.points[0];
  const x = pt.x;
  const y = pt.y;
  const vc = velocityAt(cutter, x, y);
  const vb = velocityAt(bead, x, y);
  ropeCutQ.push({
    bead,
    cutter,
    cutMeta,
    x,
    y,
    vx: vc.x - vb.x,
    vy: vc.y - vb.y,
  });
}

function ropeShouldCut(ev) {
  if (!ev || !ev.cutter || !ev.bead || !ev.cutMeta) return false;
  const draw = drawings.find((d) => d.kind === "rope" && d.bodies && d.bodies.indexOf(ev.bead) >= 0);
  if (!draw) return false;
  const maxAng = tuneCode("ropeCutAngle", ROPE_CUT_ANGLE);
  const align = tuneCode("ropeCutAlign", ROPE_CUT_ALIGN);
  const minSpeed = tuneCode("ropeCutSpeed", ROPE_CUT_SPEED);
  const speed = Math.hypot(ev.vx, ev.vy);
  if (speed < minSpeed) return false;
  const outline = outlineWorld(ev.cutMeta);
  if (!outline || outline.length < 3) return false;
  const tips = ropeTips(outline, maxAng);
  if (!tips.length) return false;
  let best = null;
  let bestD = 0.28;
  for (const tip of tips) {
    const d = Math.hypot(tip.x - ev.x, tip.y - ev.y);
    if (d < bestD) {
      bestD = d;
      best = tip;
    }
  }
  if (!best) return false;
  const sm = speed || 1;
  const rx = ev.vx / sm;
  const ry = ev.vy / sm;
  if (best.nx * rx + best.ny * ry < 0.35) return false;
  const idx = draw.bodies.indexOf(ev.bead);
  const tan = ropeTangentAtBead(draw, idx, ev);
  if (!tan) return false;
  const along = Math.abs(rx * tan.x + ry * tan.y);
  if (along > Math.sin(align)) return false;
  const tipAlong = Math.abs(best.nx * tan.x + best.ny * tan.y);
  if (tipAlong > Math.sin(align)) return false;
  ev.draw = draw;
  ev.index = idx;
  return true;
}

function cutRopeAtBead(ev) {
  const draw = ev.draw;
  if (!draw || !world) return false;
  if (draw.pulley) dissolvePulley(draw.pulley);
  const bodies = draw.bodies;
  const i = ev.index;
  if (i < 0 || bodies.length < 3) return false;
  let cut = i;
  if (i <= 0) cut = 0;
  else if (i >= bodies.length - 1) cut = i - 1;
  else {
    const pa = bodies[i - 1].getPosition();
    const pb = bodies[i].getPosition();
    const pc = bodies[i + 1].getPosition();
    const d1 = distPointSeg(ev.x, ev.y, pa.x, pa.y, pb.x, pb.y);
    const d2 = distPointSeg(ev.x, ev.y, pb.x, pb.y, pc.x, pc.y);
    cut = d1 <= d2 ? i - 1 : i;
  }
  const seg = draw.segJoints[cut];
  if (!seg) return false;
  if (seg.dist) world.destroyJoint(seg.dist);
  if (seg.rope) world.destroyJoint(seg.rope);
  if (draw.spanJoint) {
    world.destroyJoint(draw.spanJoint);
    draw.spanJoint = null;
  }
  dropRopeChord(draw);
  const leftBodies = bodies.slice(0, cut + 1);
  const rightBodies = bodies.slice(cut + 1);
  const leftJoints = draw.segJoints.slice(0, cut);
  const rightJoints = draw.segJoints.slice(cut + 1);
  if (!leftBodies.length || !rightBodies.length) return false;
  draw.bodies = leftBodies;
  draw.segJoints = leftJoints;
  draw.restLength = leftJoints.reduce((s, j) => s + (j && j.length ? j.length : 0), 0);
  draw.drawnLength = draw.restLength;
  const ends = draw.endJoints || [null, null];
  draw.endJoints = [ends[0], null];
  const rightPin = draw.pinB;
  draw.pinB = null;
  const rightId = ropeSeq++;
  carryRopeBehind(draw.ropeId, rightId);
  for (const body of rightBodies) {
    const meta = bodyMeta.get(body);
    if (meta) meta.ropeId = rightId;
  }
  drawings.push({
    kind: "rope",
    ropeId: rightId,
    bodies: rightBodies,
    color: draw.color || MAT.hemp,
    restLength: rightJoints.reduce((s, j) => s + (j && j.length ? j.length : 0), 0),
    drawnLength: rightJoints.reduce((s, j) => s + (j && j.length ? j.length : 0), 0),
    segJoints: rightJoints,
    endJoints: [null, ends[1]],
    spanJoint: null,
    chordJoint: null,
    pinA: null,
    pinB: rightPin,
  });
  return true;
}

function applyRopeCuts() {
  if (!ropeCutQ.length || !world || (world.isLocked && world.isLocked())) {
    ropeCutQ = [];
    return;
  }
  const batch = ropeCutQ.splice(0);
  const seen = new Set();
  for (const ev of batch) {
    if (!ropeShouldCut(ev)) continue;
    if (seen.has(ev.draw)) continue;
    if (cutRopeAtBead(ev)) seen.add(ev.draw);
  }
}

function spawnRope(pinA, pinB, stroke) {
  if (!world) return null;
  const draw = buildRope(world, pinA, pinB, stroke, track);
  if (!draw) return null;
  drawings.push(draw);
  stats.shapes += 1;
  stats.ropes += 1;
  return draw;
}


// ---------------------------------------------------------------------------
// Seilwinde: Ein Motornagel spult jedes Seil, das an ihm hängt.
// Rechtsrum (im Uhrzeigersinn, Motor -1) verkürzt, linksrum (Motor +1)
// verlängert, mit Tempo = Drehzahl × Spulenradius. Gespult wird nur das
// Glied am Nagel: Es wird kürzer oder länger, und wenn es zu kurz wird, fällt
// die Nachbarperle weg (ihr Glied geht im Nagelglied auf); wird es zu lang,
// kommt dazwischen eine neue Perle. Keine Perle wird dabei versetzt; den Rest
// erledigen Löser, Sehne und tightenRopes wie bisher. Die Last bleibt stehen,
// sobald der Seilzug am Nagel größer ist als Windenmoment / Spulenradius.
const WINCH_MERGE = 0.06;   // m, kürzeres Nagelglied geht im Nachbarglied auf

function ropeSegSetLength(seg, len) {
  seg.length = len;
  if (seg.dist && typeof seg.dist.setLength === "function") seg.dist.setLength(len);
  if (seg.rope && typeof seg.rope.setMaxLength === "function") seg.rope.setMaxLength(len * ROPE_MAX_STRETCH);
}

function ropeSegSum(draw) {
  return draw.segJoints.reduce((s, j) => s + (j && j.length ? j.length : 0), 0);
}

// restLength um die tatsächliche Änderung der Glieder verschieben (nicht neu
// summieren: gezeichnete Seile haben durch das Abtasten oft eine etwas
// kleinere Gliedersumme, ein Sprung würde den Klotz ruckartig anheben).
function ropeSyncRest(draw, delta) {
  draw.restLength += delta;
  const maxL = draw.restLength * ROPE_MAX_STRETCH;
  if (draw.spanJoint && typeof draw.spanJoint.setMaxLength === "function") draw.spanJoint.setMaxLength(maxL);
  if (draw.chordJoint && typeof draw.chordJoint.setMaxLength === "function") draw.chordJoint.setMaxLength(maxL);
}

function dropRopeBead(body) {
  if (!body) return;
  bodyMeta.delete(body);
  world.destroyBody(body);
}

// Reaktionskraft eines Joints; frisch angelegte Joints haben vor dem ersten
// Löserschritt noch keine Richtung (Planck wirft dann), sie zählen als 0.
function jointPull(joint, invDt) {
  try {
    const f = joint.getReactionForce(invDt);
    return f ? Math.hypot(f.x, f.y) || 0 : 0;
  } catch (err) {
    return 0;
  }
}

// Seilzug am Nagel aus dem letzten Löserschritt (Sehne + Endgelenk), in N.
function ropeEndTension(draw, end, invDt) {
  let t = 0;
  if (draw.chordJoint && jointAlive(world, draw.chordJoint)) t += jointPull(draw.chordJoint, invDt);
  const ej = draw.endJoints && draw.endJoints[end === "A" ? 0 : 1];
  if (ej) t += jointPull(ej, invDt);
  return t;
}

// Ändert die Seillänge am Ende `end` ("A" oder "B") um dL (negativ = kürzer).
function reelRopeEnd(draw, end, dL) {
  const n = draw.bodies.length;
  if (n < 2 || !draw.segJoints.length) return 0;
  const atA = end === "A";
  // Indizes: e = Nagelperle, f = Nachbar, g = übernächste; Glied k0 = e–f, k1 = f–g.
  const e = atA ? 0 : n - 1;
  const f = atA ? 1 : n - 2;
  const g = atA ? 2 : n - 3;
  const k0 = atA ? 0 : n - 2;
  const k1 = atA ? 1 : n - 3;
  const seg0 = draw.segJoints[k0];
  const sumBefore = ropeSegSum(draw);
  let len = seg0.length + dL;
  if (dL < 0 && len < WINCH_MERGE && n >= 3 && draw.segJoints[k1]) {
    // Nachbarperle fällt weg, ihr Glied geht im Nagelglied auf.
    const seg1 = draw.segJoints[k1];
    const merged = Math.max(0.02, len) + seg1.length;
    const bead = draw.bodies[f];
    const a = draw.bodies[e];
    const c = draw.bodies[g];
    dropRopeBead(bead);
    const link = atA ? linkRopeSegment(world, a, c, merged) : linkRopeSegment(world, c, a, merged);
    if (atA) {
      draw.bodies.splice(1, 1);
      draw.segJoints.splice(0, 2, link);
    } else {
      draw.bodies.splice(n - 2, 1);
      draw.segJoints.splice(n - 3, 2, link);
    }
  } else if (dL > 0 && len > 2 * ROPE_SPACING) {
    // Neue Perle zwischen Nagelperle und Nachbar, auf der Verbindungslinie.
    const a = draw.bodies[e];
    const b = draw.bodies[f];
    const pa = a.getPosition();
    const pb = b.getPosition();
    const t = (len - ROPE_SPACING) / len;
    const va = a.getLinearVelocity();
    const vb = b.getLinearVelocity();
    const meta = bodyMeta.get(b);
    const bead = makeRopeBead(world, pa.x + (pb.x - pa.x) * t, pa.y + (pb.y - pa.y) * t, draw.ropeId || (meta && meta.ropeId), track);
    bead.setLinearVelocity(V(va.x + (vb.x - va.x) * t, va.y + (vb.y - va.y) * t));
    if (seg0.dist) world.destroyJoint(seg0.dist);
    if (seg0.rope) world.destroyJoint(seg0.rope);
    if (atA) {
      const l0 = linkRopeSegment(world, a, bead, len - ROPE_SPACING);
      const l1 = linkRopeSegment(world, bead, b, ROPE_SPACING);
      draw.bodies.splice(1, 0, bead);
      draw.segJoints.splice(0, 1, l0, l1);
    } else {
      const l1 = linkRopeSegment(world, b, bead, ROPE_SPACING);
      const l0 = linkRopeSegment(world, bead, a, len - ROPE_SPACING);
      draw.bodies.splice(n - 1, 0, bead);
      draw.segJoints.splice(n - 2, 1, l1, l0);
    }
  } else {
    ropeSegSetLength(seg0, Math.max(0.02, len));
  }
  const delta = ropeSegSum(draw) - sumBefore;
  ropeSyncRest(draw, delta);
  return delta;
}

function winchParams() {
  const spool = tuneCode("winchSpool", WINCH_SPOOL_R);
  return {
    spool,
    speed: NAIL_MOTOR_SPEED * spool,
    minLen: tuneCode("winchMin", WINCH_MIN_LEN),
    maxFactor: tuneCode("winchMaxFactor", WINCH_MAX_FACTOR),
    maxPull: tuneCode("winchTorque", WINCH_TORQUE) / Math.max(0.01, spool),
  };
}

function pinReelsRope(pin) {
  if (!pin || !pin.motor) return false;
  return drawings.some((d) => d.kind === "rope" && (d.pinA === pin || d.pinB === pin));
}

// Vor jedem world.step: alle Seile an laufenden Motornägeln spulen.
function reelRopes(dt) {
  if (!world || !(dt > 0)) return;
  const prm = winchParams();
  pulleyPreStep(dt);
  for (const draw of drawings.slice()) {
    if (draw.kind !== "rope" || !draw.bodies || !draw.segJoints) continue;
    if (draw.pulley) continue; // Umlenkung: Treibscheibe in pulleyPreStep
    if (draw.drawnLength == null) draw.drawnLength = draw.restLength;
    draw.winch = null;
    for (const end of ["A", "B"]) {
      const pin = end === "A" ? draw.pinA : draw.pinB;
      if (!pin || !pin.motor) continue;
      if (draw.bodies.length < 2) continue;
      // Motor -1 = rechtsrum (im Uhrzeigersinn) = aufspulen.
      const dir = pin.motor < 0 ? -1 : 1;
      const maxLen = draw.drawnLength * prm.maxFactor;
      const minLen = Math.min(prm.minLen, draw.drawnLength);
      let want = dir * prm.speed * dt;
      if (dir < 0) want = Math.max(want, minLen - draw.restLength);
      else want = Math.min(want, maxLen - draw.restLength);
      const tension = ropeEndTension(draw, end, 1 / dt);
      let state = dir < 0 ? "in" : "out";
      if (Math.abs(want) < 1e-6) state = "limit";
      else if (dir < 0 && tension > prm.maxPull) state = "stall";
      draw.winch = { state, tension, pin };
      if (state === "in" || state === "out") reelRopeEnd(draw, end, want);
    }
  }
}
// ---------------------------------------------------------------------------
// Umlenkrolle: Ein Seil, das von Nagel A über einen Nagel P zu Nagel B
// gezeichnet wird, läuft über P. P muss fest sitzen (Boden, statischer oder
// verankerter Körper). Das Seil besteht aus zwei Perlenketten (A–P und P–B).
// Hängt an einem Ende eine bewegliche Last, trägt ein Joint zwischen den
// Lastkörpern: lA + lB <= L. Hängen beide Enden fest, bleibt die Summe der
// Ruhelängen L. Eine einzelne Last zieht die leere Seite stramm. Zwei Lasten
// gleichen den Durchhang an und kommen zur Ruhe.
//
// Reibung nach der Seilreibungsformel (Euler-Eytelwein): Rutschen beginnt erst,
// wenn T_hoch / T_tief > e^(mu·Umschlingungswinkel).
// - Schlichter Nagel: mu = Tune "Nagelreibung" (Standard 0,3; bei 180° also
//   Faktor 2,57: 2 kg gegen 1 kg hält).
// - Motornagel im Stillstand: mu = 0, verlustfreie Umlenkrolle.
// - Laufender Motornagel: Treibscheibe. Das Seil läuft mit Windentempo von der
//   einen auf die andere Seite (beide Seiten sind dann eigene Seile mit
//   Länge s bzw. L - s); zu viel Zugunterschied bringt sie zum Stehen.
const PULLEY_MARGIN = 0.04;    // m, Perlenketten etwas länger als die Seilstrecke
const PULLEY_LOAD_N = 8;       // N, darunter ist eine Seite unbelastet
const PULLEY_SLIDE_V = 2.2;    // m/s, leere Seite wird stramm gezogen
const PULLEY_BALANCE_V = 0.45; // m/s, zwei Lasten gleichen sich langsam an

function pulleyMu(pin) {
  if (pin && pin.isMotor) return 0;
  return Math.max(0, tuneCode("nailFriction", NAIL_ROPE_FRICTION));
}

function pulleyList() {
  const out = [];
  for (const d of drawings) {
    if (d.kind === "rope" && d.pulley && out.indexOf(d.pulley) < 0) out.push(d.pulley);
  }
  return out;
}

// Nagel, über den ein Zug von a nach b läuft: fester Nagel nah am Zug,
// nicht an dessen Enden. Liefert { pin, k } (k = nächster Zugpunkt) oder null.
function ropePulleyPin(ink, a, b) {
  if (!ink || ink.length < 5 || !a || !b) return null;
  if (a.body === b.body) return null;
  // Auch zwei feste Enden (Türme): das Seil läuft über P und fällt durch
  // dessen Körper, statt auf dem Turm liegen zu bleiben.
  const cum = [0];
  for (let i = 1; i < ink.length; i++) cum.push(cum[i - 1] + dist(ink[i - 1], ink[i]));
  const total = cum[cum.length - 1];
  let best = null;
  for (const pin of pins) {
    if (pin === a || pin === b || !pin.body || pin.body.isDynamic()) continue;
    const p = pinWorld(pin);
    for (let i = 1; i < ink.length - 1; i++) {
      if (cum[i] < 0.25 || total - cum[i] < 0.25) continue;
      const d = Math.hypot(ink[i].x - p.x, ink[i].y - p.y);
      if (d < NAIL_HIT && (!best || d < best.d)) best = { pin, k: i, d };
    }
  }
  return best;
}

function pulleyAnchor(body, local, c, a) {
  const lc = body.m_sweep.localCenter;
  const lx = local.x - lc.x;
  const ly = local.y - lc.y;
  const cs = Math.cos(a);
  const sn = Math.sin(a);
  const rx = cs * lx - sn * ly;
  const ry = sn * lx + cs * ly;
  return { rx, ry, px: c.x + rx, py: c.y + ry };
}

// Lage beider Seiten aus den Löserpositionen.
function pulleyFrame(j, useSolver) {
  const d = j.cg;
  const A = j.m_bodyA;
  const B = j.m_bodyB;
  const P = pinWorld(d.pin);
  const ca = useSolver ? A.c_position.c : A.getWorldCenter();
  const aa = useSolver ? A.c_position.a : A.getAngle();
  const cb = useSolver ? B.c_position.c : B.getWorldCenter();
  const ab = useSolver ? B.c_position.a : B.getAngle();
  const gA = pulleyAnchor(A, j.m_localAnchorA, ca, aa);
  const gB = pulleyAnchor(B, j.m_localAnchorB, cb, ab);
  let uAx = gA.px - P.x;
  let uAy = gA.py - P.y;
  let uBx = gB.px - P.x;
  let uBy = gB.py - P.y;
  const lA = Math.hypot(uAx, uAy);
  const lB = Math.hypot(uBx, uBy);
  if (lA > 1e-4) { uAx /= lA; uAy /= lA; } else { uAx = 0; uAy = 0; }
  if (lB > 1e-4) { uBx /= lB; uBy /= lB; } else { uBx = 0; uBy = 0; }
  const cA = gA.rx * uAy - gA.ry * uAx;
  const cB = gB.rx * uBy - gB.ry * uBx;
  return {
    gA, gB, lA, lB, uAx, uAy, uBx, uBy,
    mA: A.m_invMass + A.m_invI * cA * cA,
    mB: B.m_invMass + B.m_invI * cB * cB,
  };
}

// Impulse (Seilzug × dt) auf beide Seiten: zieht den Körper zum Nagel hin.
function pulleyPush(j, f, impA, impB) {
  const A = j.m_bodyA;
  const B = j.m_bodyB;
  if (impA) {
    const px = -impA * f.uAx;
    const py = -impA * f.uAy;
    const v = A.c_velocity.v;
    v.x += A.m_invMass * px;
    v.y += A.m_invMass * py;
    A.c_velocity.w += A.m_invI * (f.gA.rx * py - f.gA.ry * px);
  }
  if (impB) {
    const px = -impB * f.uBx;
    const py = -impB * f.uBy;
    const v = B.c_velocity.v;
    v.x += B.m_invMass * px;
    v.y += B.m_invMass * py;
    B.c_velocity.w += B.m_invI * (f.gB.rx * py - f.gB.ry * px);
  }
}

// Geschwindigkeit, mit der sich die Seiten verlängern (>0 = weg vom Nagel).
function pulleyRates(j, f) {
  const A = j.m_bodyA;
  const B = j.m_bodyB;
  const va = A.c_velocity.v;
  const wa = A.c_velocity.w;
  const vb = B.c_velocity.v;
  const wb = B.c_velocity.w;
  const ra = f.uAx * (va.x - wa * f.gA.ry) + f.uAy * (va.y + wa * f.gA.rx);
  const rb = f.uBx * (vb.x - wb * f.gB.ry) + f.uBy * (vb.y + wb * f.gB.rx);
  return { ra, rb };
}

function pulleyInitVelocity(step) {
  const d = this.cg;
  const f = pulleyFrame(this, true);
  d.f = f;
  d.invDt = step.inv_dt;
  const mode = d.drive ? "drive" : "slide";
  if (mode !== d.solveMode) {
    d.iA = 0;
    d.iB = 0;
    d.iN = 0;
    d.iF = 0;
    d.solveMode = mode;
  }
  // Umschlingungswinkel: 180° minus Winkel zwischen den beiden Seiten.
  const cosAB = Math.max(-1, Math.min(1, f.uAx * f.uBx + f.uAy * f.uBy));
  d.wrap = Math.PI - Math.acos(cosAB);
  const E = Math.exp(d.mu * d.wrap);
  d.k = (E - 1) / (E + 1);
  if (step.warmStarting) {
    const r = step.dtRatio;
    d.iA *= r; d.iB *= r; d.iN *= r; d.iF *= r;
    if (mode === "drive") pulleyPush(this, f, d.iA, d.iB);
    else pulleyPush(this, f, d.iN + d.iF, d.iN - d.iF);
  } else {
    d.iA = 0; d.iB = 0; d.iN = 0; d.iF = 0;
  }
}

function pulleySolveVelocity(step) {
  const d = this.cg;
  const f = d.f;
  if (!f) return;
  if (d.solveMode === "drive") {
    // Zwei eigene Seile: lA <= s, lB <= L - s; s läuft mit d.sdot.
    let r = pulleyRates(this, f);
    if (f.mA > 0) {
      let cd = r.ra - d.sdot;
      const C = f.lA - d.s;
      if (C < 0) cd += C * d.invDt;
      const old = d.iA;
      d.iA = Math.max(0, old + cd / f.mA);
      pulleyPush(this, f, d.iA - old, 0);
    }
    r = pulleyRates(this, f);
    if (f.mB > 0) {
      let cd = r.rb + d.sdot;
      const C = f.lB - (d.L - d.s);
      if (C < 0) cd += C * d.invDt;
      const old = d.iB;
      d.iB = Math.max(0, old + cd / f.mB);
      pulleyPush(this, f, 0, d.iB - old);
    }
    return;
  }
  const K = f.mA + f.mB;
  if (!(K > 0)) return;
  // Reibung zuerst (wie bei Kontakten), begrenzt durch den Seilzug.
  if (d.k > 0) {
    const r = pulleyRates(this, f);
    const cf = r.ra - r.rb;
    const old = d.iF;
    const max = d.k * d.iN;
    d.iF = Math.max(-max, Math.min(max, old + cf / K));
    const dl = d.iF - old;
    if (dl) pulleyPush(this, f, dl, -dl);
  }
  const r = pulleyRates(this, f);
  let cn = r.ra + r.rb;
  const C = f.lA + f.lB - d.L;
  if (C < 0) cn += C * d.invDt;
  const old = d.iN;
  d.iN = Math.max(0, old + cn / K);
  const dl = d.iN - old;
  if (dl) pulleyPush(this, f, dl, dl);
}

function pulleyShift(body, g, ux, uy, imp) {
  const px = -imp * ux;
  const py = -imp * uy;
  const c = body.c_position.c;
  c.x += body.m_invMass * px;
  c.y += body.m_invMass * py;
  body.c_position.a += body.m_invI * (g.rx * py - g.ry * px);
}

function pulleySolvePosition(step) {
  const d = this.cg;
  const f = pulleyFrame(this, true);
  const slop = 0.005;
  const maxFix = 0.2;
  if (d.solveMode === "drive") {
    const eA = f.lA - d.s;
    const eB = f.lB - (d.L - d.s);
    if (eA > slop && f.mA > 0) pulleyShift(this.m_bodyA, f.gA, f.uAx, f.uAy, Math.min(eA - slop, maxFix) / f.mA);
    if (eB > slop && f.mB > 0) pulleyShift(this.m_bodyB, f.gB, f.uBx, f.uBy, Math.min(eB - slop, maxFix) / f.mB);
    return Math.max(eA, eB) < 3 * slop;
  }
  const C = f.lA + f.lB - d.L;
  const K = f.mA + f.mB;
  if (C <= slop || !(K > 0)) return true;
  const imp = Math.min(C - slop, maxFix) / K;
  pulleyShift(this.m_bodyA, f.gA, f.uAx, f.uAy, imp);
  pulleyShift(this.m_bodyB, f.gB, f.uBx, f.uBy, imp);
  return C < 3 * slop;
}

// Seilzug in N: die stärker gezogene Seite.
function pulleyTensions(pul) {
  const inv = pul.invDt || 60;
  if (pul.solveMode === "drive") return { a: pul.iA * inv, b: pul.iB * inv };
  return { a: (pul.iN + pul.iF) * inv, b: (pul.iN - pul.iF) * inv };
}

// Knick des Seils am Nagel: rechts herum (Uhrzeigersinn) = +1.
function pulleyWrapSign(pinA, pin, pinB) {
  const a = pinWorld(pinA);
  const p = pinWorld(pin);
  const b = pinWorld(pinB);
  const turn = (p.x - a.x) * (b.y - p.y) - (p.y - a.y) * (b.x - p.x);
  return turn > 0 ? -1 : 1;
}

function createPulleyJoint(targetWorld, pul) {
  const P = pinWorld(pul.pin);
  const a = pinWorld(pul.pinA);
  const b = pinWorld(pul.pinB);
  const j = new planck.PulleyJoint({ collideConnected: true }, pul.pinA.body, pul.pinB.body,
    V(P.x, P.y), V(P.x, P.y), V(a.x, a.y), V(b.x, b.y), 1);
  j.m_localAnchorA = V(pul.pinA.local.x, pul.pinA.local.y);
  j.m_localAnchorB = V(pul.pinB.local.x, pul.pinB.local.y);
  j.cg = pul;
  j.initVelocityConstraints = pulleyInitVelocity;
  j.solveVelocityConstraints = pulleySolveVelocity;
  j.solvePositionConstraints = pulleySolvePosition;
  j.getReactionForce = function (invDt) {
    const t = pulleyTensions(pul);
    return V(Math.max(t.a, t.b), 0);
  };
  j.getReactionTorque = function () { return 0; };
  return targetWorld.createJoint(j);
}

// Baut das Seil A–P–B. sideA/sideB sind gewöhnliche Seilzeichnungen ohne
// Sehne und ohne Spannjoint; die Last trägt der Umlenk-Joint.
function makePulley(targetWorld, sideA, sideB, pin, length, opt) {
  for (const side of [sideA, sideB]) {
    if (side.chordJoint && jointAlive(targetWorld, side.chordJoint)) targetWorld.destroyJoint(side.chordJoint);
    side.chordJoint = null;
    if (side.spanJoint && jointAlive(targetWorld, side.spanJoint)) targetWorld.destroyJoint(side.spanJoint);
    side.spanJoint = null;
    // Die Perlen hängen nicht an den Nägeln, sie werden nur an sie gesetzt
    // (tightenRopeDraw): sonst zöge die träge Kette mit an der Last.
    for (const ej of side.endJoints || []) {
      if (ej && jointAlive(targetWorld, ej)) targetWorld.destroyJoint(ej);
    }
    side.endJoints = [null, null];
  }
  const pul = {
    pin,
    pinA: sideA.pinA,
    pinB: sideB.pinB,
    sideA,
    sideB,
    L: length,
    s: (opt && opt.s != null) ? opt.s : sideA.restLength,
    wrapSign: (opt && opt.wrapSign) ? opt.wrapSign : pulleyWrapSign(sideA.pinA, pin, sideB.pinB),
    drive: false,
    sdot: 0,
    mu: pulleyMu(pin),
    iA: 0, iB: 0, iN: 0, iF: 0,
    solveMode: null,
    state: "slide",
    joint: null,
  };
  sideA.pulley = pul;
  sideB.pulley = pul;
  pul.joint = createPulleyJoint(targetWorld, pul);
  return pul;
}

function spawnPulleyRope(a, via, b, ink) {
  if (!world || !via) return null;
  const P = pinWorld(via.pin);
  const k = via.k;
  const ink1 = ink.slice(0, k).concat([{ x: P.x, y: P.y }]);
  const ink2 = [{ x: P.x, y: P.y }].concat(ink.slice(k + 1));
  if (ink1.length < 2 || ink2.length < 2) return null;
  const sideA = buildRope(world, a, via.pin, ink1, track);
  if (!sideA) return null;
  const sideB = buildRope(world, via.pin, b, ink2, track);
  if (!sideB) {
    drawings.push(sideA);
    destroyDrawing(sideA);
    return null;
  }
  drawings.push(sideA, sideB);
  const pul = makePulley(world, sideA, sideB, via.pin, sideA.restLength + sideB.restLength);
  stats.shapes += 1;
  stats.ropes += 1;
  return pul ? sideA : null;
}

// Seil von a nach b: läuft es über einen festen Nagel, wird es eine Umlenkung.
function spawnRopeVia(a, b, ink) {
  const via = ropePulleyPin(ink, a, b);
  if (via) {
    const r = spawnPulleyRope(a, via, b, ink);
    if (r) return r;
  }
  return spawnRope(a, b, ink);
}

// Beide Endnägel fest (Türme, Boden): der Joint zwischen ihnen bewegt nichts.
function pulleyEndsFixed(pul) {
  const a = pul && pul.pinA && pul.pinA.body;
  const b = pul && pul.pinB && pul.pinB.body;
  if (!a || !b || typeof a.isDynamic !== "function") return false;
  return !a.isDynamic() && !b.isDynamic();
}

// Richtung, in der die Kette den Umlenknagel verlässt ("A" oder "B" an der Rolle).
function pulleyDeparture(side, atPulley) {
  const bodies = side && side.bodies;
  if (!bodies || bodies.length < 2) return null;
  const atB = atPulley === "B";
  const pinBead = bodies[atB ? bodies.length - 1 : 0];
  const next = bodies[atB ? bodies.length - 2 : 1];
  if (!pinBead || !next || typeof pinBead.getPosition !== "function") return null;
  const a = pinBead.getPosition();
  const b = next.getPosition();
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  if (d < 0.02) return null;
  return { x: dx / d, y: dy / d };
}

// Umschlingung aus den Ketten, nicht aus der geraden Nagelverbindung: ein
// durchhängendes Seil liegt am Nagel um, auch wenn die Endnägel auf einer Höhe sind.
function pulleyHangWrap(pul, f) {
  const da = pulleyDeparture(pul.sideA, "B");
  const db = pulleyDeparture(pul.sideB, "A");
  if (da && db) {
    const cos = Math.max(-1, Math.min(1, da.x * db.x + da.y * db.y));
    return Math.PI - Math.acos(cos);
  }
  const cosAB = Math.max(-1, Math.min(1, f.uAx * f.uBx + f.uAy * f.uBy));
  return Math.PI - Math.acos(cosAB);
}

// Gewicht der Körper, die auf dieser Seite liegen, in N. Boden, Pfosten und
// die Perlen selbst zählen nicht: ein leeres Seil soll sich nicht selbst ziehen.
function pulleySideWeight(side) {
  if (!side || !side.bodies || !world) return 0;
  const g = world.getGravity ? world.getGravity() : null;
  const grav = g ? Math.abs(g.y) : 0;
  if (!(grav > 0)) return 0;
  const beads = side.bodies;
  let weight = 0;
  const seen = [];
  for (let c = world.getContactList(); c; c = c.getNext()) {
    if (!c.isTouching()) continue;
    const ba = c.getFixtureA().getBody();
    const bb = c.getFixtureB().getBody();
    let other = null;
    if (beads.indexOf(ba) >= 0) other = bb;
    else if (beads.indexOf(bb) >= 0) other = ba;
    if (!other || typeof other.isDynamic !== "function" || !other.isDynamic()) continue;
    if (seen.indexOf(other) >= 0) continue;
    const meta = bodyMeta.get(other);
    if (meta && (meta.kind === "rope" || meta.kind === "level" || meta.kind === "rocket")) continue;
    seen.push(other);
    weight += other.getMass() * grav;
  }
  return weight;
}

// Zug aus Gewicht und Durchhang. Ein tiefer Bauch trägt die Last mit wenig Zug,
// ein fast gerades Seil mit viel Zug. Die Gelenkkraft am Rollenende taugt nicht:
// sie bleibt bei den leichten Perlen hängen und sieht die Kugel nicht.
function pulleyHangTension(side, weight) {
  const bodies = side && side.bodies;
  if (!bodies || bodies.length < 2 || !(weight > 0)) return 0;
  let low = null;
  for (let i = 0; i < bodies.length; i++) {
    const p = bodies[i].getPosition();
    if (!low || p.y < low.y) low = p;
  }
  const ends = [bodies[0].getPosition(), bodies[bodies.length - 1].getPosition()];
  let sines = 0;
  for (let i = 0; i < ends.length; i++) {
    const e = ends[i];
    const dx = e.x - low.x;
    const dy = e.y - low.y;
    const d = Math.hypot(dx, dy) || 1;
    sines += Math.max(0, dy / d);
  }
  return weight / Math.max(0.18, sines);
}

// Länge von der Geberseite auf die Nehmerseite schieben. Geberende ist der
// Nagel an der Rolle, damit das Seil dort über die Rolle läuft.
function pulleyShiftLength(from, fromEnd, to, toEnd, amount) {
  if (!(amount > 1e-5) || !from || !to) return 0;
  if (!from.bodies || from.bodies.length < 2 || !to.bodies || to.bodies.length < 2) return 0;
  const delta = reelRopeEnd(from, fromEnd, -amount);
  const moved = -delta;
  if (moved > 1e-5) reelRopeEnd(to, toEnd, moved);
  return moved > 0 ? moved : 0;
}

// Feste Enden. Eine einzelne Last zieht die leere Seite stramm. Zwei Lasten
// schieben Länge nur, solange der Durchhang den Zug nicht ausgleicht, und
// lassen auf beiden Seiten Seil übrig. Ohne Last bleibt die gezeichnete Verteilung.
function pulleySlideFixed(pul, dt, f) {
  const sideA = pul.sideA;
  const sideB = pul.sideB;
  if (!sideA || !sideB) return;
  const rawA = pulleySideWeight(sideA);
  const rawB = pulleySideWeight(sideB);
  const blend = Math.min(1, Math.max(0, dt) * 4);
  pul.wA = pul.wA == null ? rawA : pul.wA + (rawA - pul.wA) * blend;
  pul.wB = pul.wB == null ? rawB : pul.wB + (rawB - pul.wB) * blend;
  const wA = pul.wA;
  const wB = pul.wB;
  pul.loadA = wA;
  pul.loadB = wB;
  const wrap = pulleyHangWrap(pul, f);
  pul.wrap = wrap;
  if (wA < PULLEY_LOAD_N && wB < PULLEY_LOAD_N) return;
  const minA = Math.max(0.2, f.lA);
  const minB = Math.max(0.2, f.lB);
  const slackA = sideA.restLength - minA;
  const slackB = sideB.restLength - minB;
  const one = (wA >= PULLEY_LOAD_N) !== (wB >= PULLEY_LOAD_N);
  let moved = 0;
  if (one) {
    if (wA >= PULLEY_LOAD_N && slackB > 0.08) {
      const give = Math.min(slackB - 0.04, PULLEY_SLIDE_V * dt);
      moved = pulleyShiftLength(sideB, "A", sideA, "B", give);
    } else if (wB >= PULLEY_LOAD_N && slackA > 0.08) {
      const give = Math.min(slackA - 0.04, PULLEY_SLIDE_V * dt);
      moved = pulleyShiftLength(sideA, "B", sideB, "A", give);
    }
  } else {
    const tA = pulleyHangTension(sideA, wA);
    const tB = pulleyHangTension(sideB, wB);
    pul.tenA = tA;
    pul.tenB = tB;
    const E = Math.exp(Math.max(0, pul.mu || 0) * wrap);
    const band = Math.max(40, 0.2 * Math.max(tA, tB));
    if (tA > tB * E + band && slackB > 0.25) {
      const v = Math.min(PULLEY_BALANCE_V, (tA - tB * E) * 0.0015);
      const give = Math.min(slackB - 0.2, Math.max(0, v) * dt);
      moved = pulleyShiftLength(sideB, "A", sideA, "B", give);
    } else if (tB > tA * E + band && slackA > 0.25) {
      const v = Math.min(PULLEY_BALANCE_V, (tB - tA * E) * 0.0015);
      const give = Math.min(slackA - 0.2, Math.max(0, v) * dt);
      moved = pulleyShiftLength(sideA, "B", sideB, "A", give);
    }
  }
  if (moved) pul.s = sideA.restLength;
}

// Eine Last auf einem Seil zwischen festen Nägeln soll liegen bleiben.
// Die Perlen sind viel leichter als die Kugel; der Löser und die Längenkorrektur
// stoßen sie sonst jeden Schritt neu an. Hier wird sie aus den Perlen geschoben
// und ihre Geschwindigkeit in das Seil hinein weggenommen.
function settlePulleyRiders() {
  if (!world) return;
  const beadSet = new Set();
  for (const pul of pulleyList()) {
    if (!pulleyEndsFixed(pul) || pul.drive) continue;
    for (const side of [pul.sideA, pul.sideB]) {
      const bodies = side && side.bodies;
      if (!bodies) continue;
      for (let i = 0; i < bodies.length; i++) beadSet.add(bodies[i]);
    }
  }
  if (!beadSet.size) return;
  const riders = new Map();
  for (let c = world.getContactList(); c; c = c.getNext()) {
    if (!c.isTouching()) continue;
    const ba = c.getFixtureA().getBody();
    const bb = c.getFixtureB().getBody();
    let bead = null;
    let rider = null;
    let beadIsA = false;
    if (beadSet.has(ba)) { bead = ba; rider = bb; beadIsA = true; }
    else if (beadSet.has(bb)) { bead = bb; rider = ba; }
    else continue;
    if (!rider.isDynamic() || dragBodyHot(rider)) continue;
    const meta = bodyMeta.get(rider);
    if (meta && (meta.kind === "rope" || meta.kind === "level" || meta.kind === "rocket")) continue;
    const wm = c.getWorldManifold && c.getWorldManifold();
    let nx = 0;
    let ny = 1;
    let push = 0;
    if (wm && wm.normal) {
      nx = wm.normal.x;
      ny = wm.normal.y;
      if (!beadIsA) { nx = -nx; ny = -ny; }
      const seps = wm.separations || [];
      const n = wm.pointCount || 0;
      for (let i = 0; i < n; i++) {
        const s = seps[i] || 0;
        if (s < push) push = s;
      }
    }
    const prev = riders.get(rider);
    if (!prev) riders.set(rider, { nx, ny, push });
    else {
      prev.nx += nx;
      prev.ny += ny;
      if (push < prev.push) prev.push = push;
    }
    bead.setLinearVelocity(V(0, 0));
    bead.setAngularVelocity(0);
  }
  riders.forEach((info, rider) => {
    const len = Math.hypot(info.nx, info.ny) || 1;
    const nx = info.nx / len;
    const ny = info.ny / len;
    if (info.push < -1e-4) {
      const p = rider.getPosition();
      const out = Math.min(0.04, -info.push);
      rider.setTransform(V(p.x + nx * out, p.y + ny * out), rider.getAngle());
    }
    const v = rider.getLinearVelocity();
    const vn = v.x * nx + v.y * ny;
    let vx = v.x;
    let vy = v.y;
    if (vn < 0) { vx -= vn * nx; vy -= vn * ny; }
    vx *= 0.5;
    vy *= 0.5;
    if (Math.hypot(vx, vy) < 0.85) { vx = 0; vy = 0; }
    rider.setLinearVelocity(V(vx, vy));
    const spin = rider.getAngularVelocity();
    rider.setAngularVelocity(Math.abs(spin) < 0.8 ? 0 : spin * 0.5);
  });
}

// Radieren einer Hälfte löscht das ganze Seil. Schneiden und Nagelziehen
// laufen weiter über dissolvePulley und lassen die andere Seite als Seil stehen.
function destroyPulleyRope(pul) {
  if (!pul || pul.dead) return;
  pul.dead = true;
  if (pul.joint && world && jointAlive(world, pul.joint)) world.destroyJoint(pul.joint);
  pul.joint = null;
  const sides = [pul.sideA, pul.sideB];
  for (const side of sides) {
    if (side && side.pulley === pul) side.pulley = null;
  }
  for (const side of sides) {
    if (!side || drawings.indexOf(side) < 0) continue;
    destroyDrawing(side);
  }
}

// Umlenkung auflösen (Seil geschnitten, Nagel gezogen, Körper gelöscht): die
// Seiten werden gewöhnliche Seile mit eigener Sehne.
function dissolvePulley(pul) {
  if (!pul || pul.dead) return;
  pul.dead = true;
  if (pul.joint && world && jointAlive(world, pul.joint)) world.destroyJoint(pul.joint);
  pul.joint = null;
  for (const side of [pul.sideA, pul.sideB]) {
    if (!side || side.pulley !== pul) continue;
    side.pulley = null;
    if (!world || drawings.indexOf(side) < 0 || !side.bodies || side.bodies.length < 2) continue;
    const ends = side.endJoints || [null, null];
    if (!ends[0] && !ends[1]) side.endJoints = attachRopePins(world, side.pinA, side.pinB, side.bodies);
    if (!side.chordJoint && side.pinA && side.pinB) {
      side.chordJoint = createRopeChord(world, side.pinA, side.pinB, side.restLength);
    }
  }
}

function dissolvePulleysAt(pin) {
  for (const pul of pulleyList()) {
    if (pul.pin === pin || pul.pinA === pin || pul.pinB === pin) dissolvePulley(pul);
  }
}

// Vor jedem world.step: Modus (Rolle/Treibscheibe), Seillage s, Perlenketten.
function pulleyPreStep(dt) {
  for (const pul of pulleyList()) {
    if (!pul.joint || !jointAlive(world, pul.joint) || pins.indexOf(pul.pin) < 0) {
      dissolvePulley(pul);
      continue;
    }
    const f = pulleyFrame(pul.joint, false);
    pul.mu = pulleyMu(pul.pin);
    const slack = Math.max(0, pul.L - f.lA - f.lB);
    // Umschlingungssinn (beim Zeichnen festgelegt): +1 = von A im
    // Uhrzeigersinn über den Nagel nach B. Dreht die Rolle rechtsrum (Motor
    // -1), läuft das Seil dann von A nach B: Seite A wird kürzer.
    const side = pul.wrapSign || 1;
    const sPrev = pul.s;
    const motor = pul.pin.motor || 0;
    if (motor) {
      const prm = winchParams();
      if (!pul.drive) {
        pul.s = Math.max(0, Math.min(pul.L, f.lA + slack / 2));
        pul.drive = true;
      }
      // sdot > 0: Seite A wird länger.
      let sdot = side * motor * prm.speed;
      const minLen = prm.minLen;
      if (sdot < 0 && pul.s + sdot * dt < minLen) sdot = Math.min(0, (minLen - pul.s) / dt);
      if (sdot > 0 && pul.s + sdot * dt > pul.L - minLen) sdot = Math.max(0, (pul.L - minLen - pul.s) / dt);
      const t = pulleyTensions(pul);
      const against = sdot < 0 ? t.a - t.b : t.b - t.a;
      pul.state = Math.abs(sdot) < 1e-6 ? "limit" : (against > prm.maxPull ? "stall" : "drive");
      if (pul.state !== "drive") sdot = 0;
      pul.sdot = sdot;
      pul.s += sdot * dt;
    } else if (pulleyEndsFixed(pul)) {
      // Die Ketten sind das Seil. Länge wandert nur, wenn eine Seite Last trägt.
      pul.drive = false;
      pul.sdot = 0;
      pul.state = "slide";
      pulleySlideFixed(pul, dt, f);
    } else {
      pul.drive = false;
      pul.sdot = 0;
      pul.state = "slide";
      pul.s = Math.max(f.lA, Math.min(pul.L - f.lB, pul.s));
      if (f.lA + f.lB >= pul.L) pul.s = f.lA;
    }
    // Rad der Umlenkrolle dreht mit dem Seil (Bildradius 0,16 m).
    pul.pin.rollAngle = (pul.pin.rollAngle || 0) + (pul.s - sPrev) * side / 0.16;
    // Bewegliche Lasten: Perlenketten nur so lang, dass sie den Lastkörper nie halten.
    // Feste Enden: die Kettenlänge ist die Seillänge und bleibt, außer sie rutscht.
    if (pulleyEndsFixed(pul) && !pul.drive) continue;
    const va = pul.pinA.body.isDynamic() ? velocityAt(pul.pinA.body, f.gA.px, f.gA.py) : { x: 0, y: 0 };
    const vb = pul.pinB.body.isDynamic() ? velocityAt(pul.pinB.body, f.gB.px, f.gB.py) : { x: 0, y: 0 };
    const m = PULLEY_MARGIN + 3 * dt * Math.max(Math.hypot(va.x, va.y), Math.hypot(vb.x, vb.y));
    let wantA;
    let wantB;
    if (pul.drive) {
      wantA = Math.max(pul.s, f.lA) + m;
      wantB = Math.max(pul.L - pul.s, f.lB) + m;
    } else {
      const tot = pul.L + 2 * m;
      const lo = f.lA + m;
      const hi = tot - (f.lB + m);
      if (lo > hi) {
        wantA = lo;
        wantB = f.lB + m;
      } else {
        wantA = Math.max(lo, Math.min(hi, pul.sideA.restLength));
        wantB = tot - wantA;
      }
    }
    if (Math.abs(wantA - pul.sideA.restLength) > 1e-4 && pul.sideA.bodies.length >= 2) reelRopeEnd(pul.sideA, "B", wantA - pul.sideA.restLength);
    if (Math.abs(wantB - pul.sideB.restLength) > 1e-4 && pul.sideB.bodies.length >= 2) reelRopeEnd(pul.sideB, "A", wantB - pul.sideB.restLength);
  }
}
function resample(pts, spacing) {
  if (pts.length < 2) return pts.slice();
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let ax = pts[i - 1].x;
    let ay = pts[i - 1].y;
    let bx = pts[i].x;
    let by = pts[i].y;
    let seg = Math.hypot(bx - ax, by - ay);
    if (seg < 1e-4) continue;
    while (acc + seg >= spacing) {
      const t = (spacing - acc) / seg;
      ax = ax + (bx - ax) * t;
      ay = ay + (by - ay) * t;
      out.push({ x: ax, y: ay });
      seg = Math.hypot(bx - ax, by - ay);
      acc = 0;
    }
    acc += seg;
  }
  const last = pts[pts.length - 1];
  if (dist(out[out.length - 1], last) > spacing * 0.35) out.push({ x: last.x, y: last.y });
  return out;
}

function dedupe(pts) {
  const out = [];
  for (const p of pts) {
    if (!out.length || dist(out[out.length - 1], p) > 0.03) out.push({ x: p.x, y: p.y });
  }
  return out;
}

function pinWorld(pin) {
  const p = pin.body.getWorldPoint(V(pin.local.x, pin.local.y));
  return { x: p.x, y: p.y, pin };
}

function nearestPin(x, y, maxD) {
  let best = null;
  let bestD = maxD;
  for (const pin of pins) {
    const p = pinWorld(pin);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bestD) { bestD = d; best = pin; }
  }
  return best;
}

function noteShape(pts) {
  stats.shapes += 1;
  if (!ball) return;
  const by = ball.getPosition().y;
  let minY = Infinity;
  for (const p of pts) minY = Math.min(minY, p.y);
  if (minY < by - 0.5) stats.drewUnder = true;
}

function commitStroke(drawnPts, color, rawInk) {
  const result = commitStrokeApply(drawnPts, rawInk);
  if (tuneOn) noteTuneResult((rawInk && rawInk.length >= 2) ? rawInk : drawnPts, result);
  return result;
}

function prepareStroke(src) {
  let pts = dedupe(simplify(src, tuneCode("simplify", 0.045)));
  if (pts.length < 2) return { pts, closed: false };
  const closed = isClosedStroke(pts);
  if (closed) pts = dedupe(pts.slice(0, -1));
  return { pts, closed };
}

function maybeSmallBody(pts, closed) {
  if (pts.length < 4) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of pts) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const bw = maxX - minX;
  const bh = maxY - minY;
  const small = Math.max(bw, bh) < 0.62 && Math.min(bw, bh) > 0.05;
  if (!small || !(closed || dist(pts[0], pts[pts.length - 1]) < 0.4)) return null;
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const host = hostAt(cx, cy);
  if (host && bodyMeta.get(host) && bodyMeta.get(host).kind === "ball") {
    /* pins are not allowed on the quest ball */
  } else if (host) {
    stats.userPins += 1;
    return rememberPin(cx, cy, host, true);
  }
  const r = clamp(Math.max(bw, bh) * 0.5, 0.12, 0.34);
  return spawnBlob(cx, cy, r);
}

function commitStrokeApply(drawnPts, rawInk) {
  if (won || !world) return null;
  let ink = (rawInk && rawInk.length >= 2) ? rawInk : drawnPts;
  if (!ink || ink.length < 2) return null;
  const motor = doodleMotor(ink);
  if (motor) return motor;
  // Überschuss am Ende eines geschlossenen Zugs abschneiden (nicht bei Seilen vom Nagel).
  if (!nearestPin(ink[0].x, ink[0].y, NAIL_HIT)) {
    const loop = closeLoop(ink);
    if (loop !== ink) ink = loop;
  }
  let { pts, closed } = prepareStroke(ink);
  if (pts.length < 2) return null;
  const small = maybeSmallBody(pts, closed);
  if (small) return small;
  const closeTol = tuneCode("close", CIRCLE_CLOSE);
  const inkOpen = dist(ink[0], ink[ink.length - 1]);
  const ptsOpen = dist(pts[0], pts[pts.length - 1]);
  if (closed || inkOpen < closeTol || ptsOpen < closeTol) {
    // 3-/4-Ecke immer auf dem Rohzug: keine Ellipse/kein Kreis, und mit
    // Geodreieck kein Raster, das schräge Kanten zu Treppen macht.
    const poly = recognizePolygon(ink);
    if (poly) {
      const neat = snapPolygonPose(poly.corners);
      const solid = spawnSolid(neat, { quadKind: poly.quadKind });
      if (solid) return solid;
    }
    // Kastenform vor der Kreisannahme: Ein Quadrat mit gerundeten oder
    // abgeschnittenen Ecken füllt sein Rechteck weit mehr als ein Kreis.
    const box = boxyLoop(ink);
    if (box) {
      const neat = snapPolygonPose(box.corners);
      const solid = spawnSolid(neat, { quadKind: "rect" });
      if (solid) return solid;
    }
    if (!(strokeSnaps() && geoKeepsPolygon(ink))) {
      const fit = tryMakeCircle(dedupe(ink));
      if (fit) {
        if (fit.kind === "ellipse") return spawnEllipse(fit.x, fit.y, fit.a, fit.b, fit.angle);
        return spawnRoller(fit.x, fit.y, fit.r);
      }
    }
  }
  if (strokeSnaps()) {
    const snapped = snapStrokePoints(ink);
    if (snapped.length >= 2) {
      const prep = prepareStroke(snapped);
      pts = prep.pts;
      closed = prep.closed;
      if (pts.length < 2) return null;
      const snappedSmall = maybeSmallBody(pts, closed);
      if (snappedSmall) return snappedSmall;
    }
  }
  if (!closed) {
    const a = nearestPin(pts[0].x, pts[0].y, 0.55) || nearestPin(ink[0].x, ink[0].y, 0.55);
    const b = nearestPin(pts[pts.length - 1].x, pts[pts.length - 1].y, 0.55) || nearestPin(ink[ink.length - 1].x, ink[ink.length - 1].y, 0.55);
    if (a && b && a !== b) return spawnRopeVia(a, b, ink);
    // Zug, der auf einem Nagel beginnt: Seil, auch wenn das andere Ende frei bleibt.
    const fromNail = nearestPin(ink[0].x, ink[0].y, NAIL_HIT) || nearestPin(pts[0].x, pts[0].y, NAIL_HIT);
    if (fromNail) {
      if (pathLength(ink) < ROPE_FROM_NAIL_MIN && pathLength(pts) < ROPE_FROM_NAIL_MIN) return null;
      return spawnRope(fromNail, (b && b !== fromNail) ? b : null, ink);
    }
  }
  if (closed && !selfIntersects(pts, true) && Math.abs(signedArea(pts)) >= 0.05) {
    const solid = spawnSolid(regularizeClosed(pts), {});
    if (solid) return solid;
    return spawnWire(pts.concat([{ x: pts[0].x, y: pts[0].y }]), {});
  }
  if (!closed) return spawnWire(straightenOpen(pts), { thick: strokeThickness((drawnPts && drawnPts.some((p) => p.thick)) ? drawnPts : ink) });
  return spawnWire(pts, {});
}

function destroyDrawing(draw) {
  if (!draw || !world) return;
  if (draw.kind === "rope") {
    // Eine Hälfte einer Umlenkung ist kein eigenes Seil: Radieren löscht beide.
    if (draw.pulley && !draw.pulley.dead) {
      destroyPulleyRope(draw.pulley);
      return;
    }
    dropRopeChord(draw);
    for (const body of draw.bodies) {
      bodyMeta.delete(body);
      world.destroyBody(body);
    }
  } else if (draw.body) {
    const doomed = draw.body;
    releaseBodyAnchors(doomed);
    for (const d of drawings) {
      if (d.kind === "rope" && ((d.pinA && d.pinA.body === doomed) || (d.pinB && d.pinB.body === doomed))) {
        if (d.pulley) dissolvePulley(d.pulley);
        dropRopeChord(d);
      }
    }
    pins = pins.filter((pin) => {
      if (pin.body !== doomed) return true;
      return false;
    });
    bodyMeta.delete(doomed);
    world.destroyBody(doomed);
  }
  drawings = drawings.filter((d) => d !== draw);
}

// Einen selbst gesetzten Nagel herausziehen (Doppeltipp auf genau diesen Nagel).
function pullPin(pin) {
  if (!world || world.isLocked() || !pin || !pin.userMade) return false;
  const i = pins.indexOf(pin);
  if (i < 0) return false;
  dissolvePulleysAt(pin);
  for (const j of pin.joints) {
    if (j) world.destroyJoint(j);
  }
  pins.splice(i, 1);
  return true;
}

// Klick-Nagel: Ein kurzer Klick ohne Bewegung in die Innenfläche eines
// Gegenstands oder auf den Boden setzt dort einen Nagel (Ort wie beim
// Kringel-Nagel, nie in die Spielkugel). Auf leerem Papier passiert nichts.
function clickNailAt(x, y) {
  if (!world || world.isLocked()) return null;
  const host = hostAt(x, y);
  if (!host) return null;
  const meta = bodyMeta.get(host);
  if (meta && meta.kind === "ball") return null;
  stats.userPins += 1;
  return rememberPin(x, y, host, true);
}

// Kringel um (oder auf) einen Nagel stellt den Motor: Drehsinn des Kringels
// auf dem Bildschirm = Drehsinn des Motors. Gleicher Sinn wie der laufende
// Motor ändert nichts, Gegensinn hält ihn an. Weltkoordinaten haben y nach
// oben wie das Bild (die Bildschirm-y-Spiegelung betrifft nur Pixelwerte),
// also gilt: Fläche > 0 = gegen den Uhrzeigersinn = linksrum (+1).
const MOTOR_DOODLE_MAX = 0.9;   // m, größte Kringelausdehnung
const MOTOR_DOODLE_FILL = 0.15; // |Fläche| / Rechteck mindestens (echte Schleife)

function doodleMotor(ink) {
  if (!ink || ink.length < 6 || !pins.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of ink) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const bw = maxX - minX;
  const bh = maxY - minY;
  const size = Math.max(bw, bh);
  if (size > MOTOR_DOODLE_MAX || Math.min(bw, bh) < 0.05) return null;
  if (dist(ink[0], ink[ink.length - 1]) > Math.max(0.12, size * 0.6)) return null;
  let area = 0;
  for (let i = 0; i < ink.length; i++) {
    const a = ink[i];
    const b = ink[(i + 1) % ink.length];
    area += a.x * b.y - b.x * a.y;
  }
  area *= 0.5;
  if (Math.abs(area) < MOTOR_DOODLE_FILL * bw * bh) return null;
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const pin = nearestPin(cx, cy, Math.max(NAIL_HIT, size * 0.5 + 0.1));
  if (!pin) return null;
  const dir = area > 0 ? 1 : -1;
  pin.isMotor = true;
  const cur = pin.motor || 0;
  if (cur === -dir) pin.motor = 0;
  else if (cur === 0) pin.motor = dir;
  applyNailMotor(pin);
  return { kind: "motor", pin, motor: pin.motor, dir };
}

function eraseAt(x, y) {
  if (!world || world.isLocked()) return false;
  for (let i = pins.length - 1; i >= 0; i--) {
    const pin = pins[i];
    if (!pin.userMade) continue;
    const p = pinWorld(pin);
    if (Math.hypot(p.x - x, p.y - y) < 0.4) {
      dissolvePulleysAt(pin);
      for (const j of pin.joints) {
        if (j) world.destroyJoint(j);
      }
      pins.splice(i, 1);
      return true;
    }
  }
  for (let i = drawings.length - 1; i >= 0; i--) {
    const d = drawings[i];
    if (d.kind === "rope") {
      for (const body of d.bodies) {
        const p = body.getPosition();
        if (Math.hypot(p.x - x, p.y - y) < 0.35) {
          destroyDrawing(d);
          return true;
        }
      }
    } else if (d.meta && containsMeta(d.meta, x, y)) {
      if (d.body && inAnchorLink(d.body)) return false;
      destroyDrawing(d);
      return true;
    }
  }
  return false;
}

function drawingAt(x, y) {
  // Vorderste Ebene zuerst (Ebenen per Nagel, 52-ebenen.js).
  const order = drawingsByLayer();
  for (let i = order.length - 1; i >= 0; i--) {
    const d = order[i];
    if (d.kind === "rope" || !d.body || !d.meta) continue;
    if (!d.body.isDynamic()) continue;
    if (containsMeta(d.meta, x, y)) return d;
  }
  return null;
}

const NAIL_MOTOR_SPEED = Math.PI / 2;
const NAIL_MOTOR_TORQUE = 8000;
const NAIL_HIT = 0.32;

function applyNailMotor(pin) {
  if (!pin) return;
  const mode = pin.motor || 0;
  const on = mode !== 0;
  const speed = mode * NAIL_MOTOR_SPEED;
  for (const j of pin.joints) {
    if (!j) continue;
    j.enableMotor(on);
    if (on) {
      j.setMotorSpeed(speed);
      j.setMaxMotorTorque(NAIL_MOTOR_TORQUE);
    }
  }
}

// Klick auf einen Motornagel: links (+1) -> rechts (-1) -> Stillstand (0) -> links.
// Ein Motornagel bleibt Motornagel, auch im Stillstand (dann Umlenkrolle).
function cycleNailMotor(pin) {
  if (!pin) return 0;
  pin.isMotor = true;
  const cur = pin.motor || 0;
  pin.motor = cur === 0 ? 1 : cur === 1 ? -1 : 0;
  applyNailMotor(pin);
  return pin.motor;
}

// Nagel-Nachbarn eines Körpers: [{ other, pin, joint }] über alle Nagel-Joints.
function nailNeighbors(body) {
  const out = [];
  for (const pin of pins) {
    for (const j of pin.joints) {
      if (!j) continue;
      const a = j.getBodyA();
      const b = j.getBodyB();
      if (a === body && b !== body) out.push({ other: b, pin, joint: j });
      else if (b === body && a !== body) out.push({ other: a, pin, joint: j });
    }
  }
  return out;
}

// Führt die Nagelkette von `start` (ohne über `skip` zu gehen) zum Boden,
// zu einem statischen oder verankerten Körper?
function nailChainFixed(start, skip) {
  if (!start) return false;
  if (!start.isDynamic()) return true;
  const seen = new Set([start, skip]);
  const queue = [start];
  while (queue.length) {
    const cur = queue.shift();
    for (const n of nailNeighbors(cur)) {
      if (seen.has(n.other)) continue;
      if (!n.other.isDynamic()) return true;
      seen.add(n.other);
      queue.push(n.other);
    }
  }
  return false;
}

// Ein Nagel am gezogenen Körper ist nur dann ein fester Drehpunkt, wenn seine
// Kette zum Boden, zu einem statischen oder verankerten Körper führt.
function nailJointPivot(body, j) {
  const other = j.getBodyA() === body ? j.getBodyB() : j.getBodyA();
  return nailChainFixed(other, body);
}

// Freie Nagelgruppe: alle über Nägel verbundenen dynamischen Körper. Hat sie
// keinen festen Halt, wird sie als Ganzes gezogen. Liefert null, wenn der
// Körper keine Partner hat oder die Kette irgendwo festhängt.
function freeNailGroup(body) {
  if (!body || !body.isDynamic()) return null;
  const group = [body];
  const seen = new Set(group);
  for (let i = 0; i < group.length; i++) {
    for (const n of nailNeighbors(group[i])) {
      if (!n.other.isDynamic()) return null;
      if (seen.has(n.other)) continue;
      seen.add(n.other);
      group.push(n.other);
    }
    // Starr verbundene Gegenstände gehören zur selben Gruppe (55-verankern.js).
    for (const other of weldNeighbors(group[i])) {
      if (!other || other === ground) continue;
      if (!other.isDynamic()) return null;
      if (seen.has(other)) continue;
      seen.add(other);
      group.push(other);
    }
  }
  return group.length > 1 ? group : null;
}

function dragGroupBodies() {
  if (!playDrag || !playDrag.body) return [];
  if (!playDrag.group) return [playDrag.body];
  return playDrag.group.filter((b) => b === playDrag.body || bodyMeta.has(b));
}

function inDragGroup(body) {
  if (!playDrag || !body) return false;
  if (playDrag.body === body) return true;
  return !!(playDrag.groupSet && playDrag.groupSet.has(body));
}

// Partner tragen: dieselbe Verschiebung wie der gezogene Körper. Drehung um
// die Nägel bleibt der Physik überlassen (sie pendeln an den Gelenken).
function carryDragGroup(dx, dy) {
  if (!playDrag || !playDrag.group) return;
  if (Math.abs(dx) < 1e-12 && Math.abs(dy) < 1e-12) return;
  for (const b of dragGroupBodies()) {
    if (b === playDrag.body) continue;
    const p = b.getPosition();
    b.setTransform(V(p.x + dx, p.y + dy), b.getAngle());
    b.setAwake(true);
  }
}

function hingeWorldPoints(body) {
  const pts = [];
  for (const pin of pins) {
    for (const j of pin.joints) {
      if (!j) continue;
      if (j.getBodyA() !== body && j.getBodyB() !== body) continue;
      if (!nailJointPivot(body, j)) continue;
      const wp = pinWorld(pin);
      if (pts.some((p) => Math.hypot(p.x - wp.x, p.y - wp.y) < 0.05)) continue;
      pts.push({ x: wp.x, y: wp.y, pin });
      break;
    }
  }
  return pts;
}

function constrainNailedGoal(body, goal) {
  if (!playDrag) return null;
  const hinges = hingeWorldPoints(body);
  if (hinges.length >= 2) {
    const g = body.getWorldPoint(V(playDrag.local.x, playDrag.local.y));
    return { x: g.x, y: g.y, hinges };
  }
  if (hinges.length === 1) {
    const p = hinges[0];
    const grab = body.getWorldPoint(V(playDrag.local.x, playDrag.local.y));
    const r = Math.hypot(grab.x - p.x, grab.y - p.y);
    if (r < 0.02) return { x: p.x, y: p.y, hinges };
    const dx = goal.x - p.x;
    const dy = goal.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    return { x: p.x + dx / d * r, y: p.y + dy / d * r, hinges };
  }
  return null;
}

function dragGoalVelocity(dt) {
  if (!playDrag || !playDrag.prevGoal) return { x: 0, y: 0 };
  const stepDt = dt > 1e-8 ? dt : 1 / 60;
  let vx = (playDrag.goal.x - playDrag.prevGoal.x) / stepDt;
  let vy = (playDrag.goal.y - playDrag.prevGoal.y) / stepDt;
  const speed = Math.hypot(vx, vy);
  const maxV = tuneCode("dragMaxV", DRAG_MAX_V);
  if (speed > maxV && speed > 1e-12) {
    vx *= maxV / speed;
    vy *= maxV / speed;
  }
  return { x: vx, y: vy };
}

// Masse, Schwerpunkt und Trägheit der starren Gruppe um den Greifpunkt.
// Nur der Körper in der Hand wäre an einer leichten Spitze viel zu leicht:
// das schwere Gegenstück kreiselt dann um den Griff.
function dragPivotAbout(body) {
  const grab = body.getWorldPoint(V(playDrag.local.x, playDrag.local.y));
  const group = weldComponent(body);
  let mass = 0;
  let cx = 0;
  let cy = 0;
  const parts = [];
  for (const b of group) {
    if (!b || !b.isDynamic()) continue;
    const m = b.getMass();
    if (!(m > 0)) continue;
    const p = b.getPosition();
    parts.push({ b, m, x: p.x, y: p.y });
    mass += m;
    cx += m * p.x;
    cy += m * p.y;
  }
  if (!(mass > 0)) {
    mass = Math.max(1e-6, body.getMass());
    const com = body.getPosition();
    const ox = com.x - grab.x;
    const oy = com.y - grab.y;
    return {
      mass,
      offx: ox,
      offy: oy,
      inertia: Math.max(1e-6, body.getInertia()) + mass * (ox * ox + oy * oy),
    };
  }
  cx /= mass;
  cy /= mass;
  let inertia = 0;
  for (const part of parts) {
    const rx = part.x - grab.x;
    const ry = part.y - grab.y;
    inertia += part.b.getInertia() + part.m * (rx * rx + ry * ry);
  }
  return {
    mass,
    offx: cx - grab.x,
    offy: cy - grab.y,
    inertia: Math.max(1e-6, inertia),
  };
}

function applyDragPivotImpulse(body, offx, offy, dt) {
  const goalV = dragGoalVelocity(dt);
  const lastV = playDrag.lastGoalV || { x: 0, y: 0 };
  const dvx = goalV.x - lastV.x;
  const dvy = goalV.y - lastV.y;
  const pivot = dragPivotAbout(body);
  const w = body.getAngularVelocity() + pivot.mass * (pivot.offy * dvx - pivot.offx * dvy) / pivot.inertia;
  body.setAngularVelocity(w);
  // Geschwindigkeit des gegriffenen Körpers weiter um seinen eigenen Schwerpunkt,
  // damit der Greifpunkt selbst stehen bleibt.
  body.setLinearVelocity(V(-w * offy, w * offx));
  playDrag.lastGoalV = { x: goalV.x, y: goalV.y };
}

function restDragAboutGrab(body, offx, offy) {
  const w = body.getAngularVelocity();
  body.setLinearVelocity(V(-w * offy, w * offx));
}

function clampDragFollow(body) {
  const anchor = body.getWorldPoint(V(playDrag.local.x, playDrag.local.y));
  const com = body.getPosition();
  const offx = com.x - anchor.x;
  const offy = com.y - anchor.y;
  // Am Griff stößt der Körper mit nichts zusammen (Geist-Regel, 52-ebenen.js),
  // deshalb folgt er dem Ziel ohne Anschlag.
  const clamped = { x: playDrag.goal.x + offx, y: playDrag.goal.y + offy };
  return { offx, offy, clamped };
}

function chaseDrag(dt) {
  if (!playDrag || !world || !playDrag.joint) return;
  const body = playDrag.body;
  // Starr verbunden und irgendwo fest (Nagel, Boden): nicht teleportieren.
  if (rigidDragHeld(body)) {
    playDrag.joint.setTarget(V(playDrag.goal.x, playDrag.goal.y));
    return;
  }
  const nailed = constrainNailedGoal(body, playDrag.goal);
  if (nailed) {
    playDrag.joint.setTarget(V(nailed.x, nailed.y));
    return;
  }
  const follow = clampDragFollow(body);
  const pos0 = body.getPosition();
  carryDragGroup(follow.clamped.x - pos0.x, follow.clamped.y - pos0.y);
  body.setTransform(V(follow.clamped.x, follow.clamped.y), body.getAngle());
  applyDragPivotImpulse(body, follow.offx, follow.offy, dt);
  syncWeldGroup(body);
  body.setAwake(true);
  playDrag.joint.setTarget(V(follow.clamped.x - follow.offx, follow.clamped.y - follow.offy));
}

function snapDrag(dt) {
  if (!playDrag || !playDrag.body) return;
  const body = playDrag.body;
  if (rigidDragHeld(body)) {
    if (playDrag.joint) playDrag.joint.setTarget(V(playDrag.goal.x, playDrag.goal.y));
    return;
  }
  const nailed = constrainNailedGoal(body, playDrag.goal);
  if (nailed) {
    const hinges = nailed.hinges;
    if (hinges.length >= 2) {
      body.setLinearVelocity(V(0, 0));
      body.setAngularVelocity(0);
      playDrag.joint.setTarget(V(nailed.x, nailed.y));
      return;
    }
    const p = hinges[0];
    const grab = body.getWorldPoint(V(playDrag.local.x, playDrag.local.y));
    const a0 = Math.atan2(grab.y - p.y, grab.x - p.x);
    const a1 = Math.atan2(nailed.y - p.y, nailed.x - p.x);
    let dang = a1 - a0;
    while (dang > Math.PI) dang -= Math.PI * 2;
    while (dang < -Math.PI) dang += Math.PI * 2;
    const pos = body.getPosition();
    const c = Math.cos(dang);
    const s = Math.sin(dang);
    const ox = pos.x - p.x;
    const oy = pos.y - p.y;
    body.setTransform(V(p.x + ox * c - oy * s, p.y + ox * s + oy * c), body.getAngle() + dang);
    body.setLinearVelocity(V(0, 0));
    body.setAngularVelocity(0);
    body.setAwake(true);
    playDrag.joint.setTarget(V(nailed.x, nailed.y));
    return;
  }
  const follow = clampDragFollow(body);
  const pos0 = body.getPosition();
  carryDragGroup(follow.clamped.x - pos0.x, follow.clamped.y - pos0.y);
  body.setTransform(V(follow.clamped.x, follow.clamped.y), body.getAngle());
  restDragAboutGrab(body, follow.offx, follow.offy);
  syncWeldGroup(body);
  body.setAwake(true);
  playDrag.joint.setTarget(V(follow.clamped.x - follow.offx, follow.clamped.y - follow.offy));
  playDrag.prevGoal = { x: playDrag.goal.x, y: playDrag.goal.y };
}

// Gegriffenen Körper beim Loslassen an alle Nägel heften, die in seiner
// Form liegen (Innennägel dieses Körpers ausgenommen). Mehrere Nägel
// halten ihn fest. Ein Nagel in einem anderen Körper verbindet beide.
function tryPinDragEnd(body, except) {
  if (!world || !body || body === ball) return 0;
  if (world.isLocked && world.isLocked()) return 0;
  const meta = bodyMeta.get(body);
  if (!meta) return 0;
  // Nägel in Körpern derselben gezogenen Gruppe zählen nicht (sonst würde die
  // Gruppe beim Loslassen starr verriegelt).
  return attachExistingPins(body, meta, except);
}

function beginDrag(x, y) {
  if (!world || world.isLocked()) return false;
  const draw = drawingAt(x, y);
  if (!draw) return false;
  endDrag();
  const body = draw.body;
  const wasBullet = body.isBullet();
  const angularDamping = body.getAngularDamping();
  body.setBullet(true);
  body.setAngularDamping(tuneCode("dragAngDamp", DRAG_ANG_DAMP));
  body.setAwake(true);
  // Freie Nagelgruppe (kein Halt am Boden): als Ganzes ziehen, Kraft nach Gesamtmasse.
  const group = freeNailGroup(body);
  let groupMass = body.getMass();
  if (group) for (const b of group) if (b !== body) groupMass += b.getMass();
  const mass = Math.max(0.2, groupMass);
  const local = body.getLocalPoint(V(x, y));
  const joint = world.createJoint(new planck.MouseJoint({
    bodyA: ground,
    bodyB: body,
    target: V(x, y),
    maxForce: mass * 24 * tuneCode("dragForceG", DRAG_FORCE_G),
    frequencyHz: tuneCode("dragFreq", DRAG_FREQ),
    dampingRatio: tuneCode("dragDamp", DRAG_DAMPING),
    collideConnected: true,
  }));
  playDrag = {
    body,
    joint,
    wasBullet,
    angularDamping,
    local: { x: local.x, y: local.y },
    goal: { x, y },
    prevGoal: { x, y },
    lastGoalV: { x: 0, y: 0 },
    noCollide: true,
    ghost: false,
    targets: [],
    free: poseOfBody(body),
    wasFree: true,
    group: group || null,
    groupSet: group ? new Set(group) : null,
    groupFree: group ? new Map(group.map((b) => [b, poseOfBody(b)])) : null,
  };
  return true;
}

function moveDrag(x, y) {
  if (!playDrag) return;
  playDrag.goal.x = x;
  playDrag.goal.y = y;
}

function endDrag() {
  if (!playDrag) return;
  const drag = playDrag;
  playDrag = null;
  if (!world || !drag.joint) return;
  world.destroyJoint(drag.joint);
  if (!drag.body) return;
  if (drag.ghost) restoreDragFree(drag);
  drag.body.setLinearVelocity(V(0, 0));
  drag.body.setAngularVelocity(0);
  drag.body.setBullet(drag.wasBullet);
  drag.body.setAngularDamping(drag.angularDamping);
  drag.body.setAwake(true);
  dragFresh.set(drag.body, 0);
  if (drag.group) {
    const welded = weldComponent(drag.body);
    for (const b of drag.group) {
      if (b === drag.body || !bodyMeta.has(b)) continue;
      if (welded.indexOf(b) >= 0) {
        b.setLinearVelocity(V(0, 0));
        b.setAngularVelocity(0);
      }
      b.setAwake(true);
      dragFresh.set(b, 0);
    }
  }
}

function dragBodyHot(body) {
  if (!body) return false;
  if (inDragGroup(body)) return true;
  return dragFresh.has(body);
}

function stepDragFresh(dt) {
  for (const [body, still] of dragFresh) {
    if (!bodyMeta.has(body)) {
      dragFresh.delete(body);
      continue;
    }
    const v = body.getLinearVelocity();
    const slow = Math.hypot(v.x, v.y) < 0.4 && Math.abs(body.getAngularVelocity()) < 0.45;
    if (slow && still + dt > 0.45) dragFresh.delete(body);
    else dragFresh.set(body, slow ? still + dt : 0);
  }
}

// Ebenen per Nagel und Geist beim Ziehen.
// Ebene 0: Boden, verankerte (statische) und freie Körper. Hängt ein Körper an
// einem Nagel, dessen Wirt in Ebene n liegt, ist er Ebene n+1 und wird davor
// gezeichnet. Direkt über einen Nagel verbundene Körper stoßen nie zusammen
// (Nagel-Joints haben collideConnected: false, der pre-solve-Filter
// `layerContactOff` sichert das zusätzlich ab). Ein Seil an einem Nagel oder
// Motor liegt eine Ebene davor und stößt nicht mit dem Nagelwirt zusammen
// (`ropeOwnEndContact`). Die beiden Wirte stoßen weiter gegeneinander.
// Überdeckt die fertige Form beim Zeichnen ein vorhandenes Seil, entsteht der
// Körper hinter genau diesem Seil (`behindRopeIds`): er wird dahinter
// gezeichnet und stößt nicht mit ihm zusammen. Neben dem Seil gezeichnet,
// bleibt er auf derselben Stoßebene und wird vom Seil gefangen.
// Ein Körper an der Maus stößt mit nichts zusammen. Überlappt er etwas, mit dem
// er nach dem Loslassen zusammenstoßen würde, ist er ein Geist: halb
// durchsichtig, und an der letzten freien Pose steht ein blasser Schatten.
// Loslassen als Geist springt dorthin zurück (Tempo 0).
const GHOST_ALPHA = 0.42;
const GHOST_SHADOW_ALPHA = 0.2;
const GHOST_BISECT = 10;
const GHOST_CIRCLE_TOL = 0.01; // m, Kreise dürfen so weit eintauchen (Ruhekontakt)
const LAYER_MAX = 24;

function nailJointOther(pin, j) {
  if (!pin || !j) return null;
  const a = j.getBodyA();
  const b = j.getBodyB();
  if (a === pin.body) return b;
  if (b === pin.body) return a;
  return null;
}

// Zwei Körper direkt über einen Nagel verbunden (Wirt und angehefteter Körper).
function nailLinked(a, b) {
  if (!a || !b || a === b) return false;
  for (const pin of pins) {
    if (pin.body !== a && pin.body !== b) continue;
    const other = pin.body === a ? b : a;
    for (const j of pin.joints) {
      if (nailJointOther(pin, j) === other) return true;
    }
  }
  return false;
}

// Am Griff stößt der gezogene Körper (bzw. seine ganze freie Nagelgruppe) mit
// nichts zusammen; innerhalb der Gruppe gilt weiter die Nagel-Regel.
function dragGhostBody(body) {
  return !!(playDrag && playDrag.noCollide && inDragGroup(body));
}

// Kontaktfilter für pre-solve (und begin-contact).
function layerContactOff(contact) {
  const a = contact.getFixtureA().getBody();
  const b = contact.getFixtureB().getBody();
  if (dragGhostBody(a) || dragGhostBody(b)) return true;
  return nailLinked(a, b);
}

// Ebene je Körper aus den Nagel-Joints (Seilperlen erben die Ebene ihres Nagelwirts + 1).
function bodyLayers() {
  const layer = new Map();
  const edges = [];
  for (const pin of pins) {
    for (const j of pin.joints) {
      const other = nailJointOther(pin, j);
      if (other && other !== pin.body) edges.push([pin.body, other]);
    }
  }
  for (let pass = 0; pass < LAYER_MAX; pass++) {
    let changed = false;
    for (const [host, child] of edges) {
      if (!child.isDynamic()) continue;
      const l = Math.min(LAYER_MAX, (layer.get(host) || 0) + 1);
      if (l > (layer.get(child) || 0)) {
        layer.set(child, l);
        changed = true;
      }
    }
    if (!changed) break;
  }
  return layer;
}

// Seil: eine Ebene vor dem Gegenstand, in dem der Nagel oder Motor steckt.
function ropeHostLayer(draw, layers) {
  let host = 0;
  let hung = false;
  for (const pin of [draw.pinA, draw.pinB]) {
    if (!pin) continue;
    hung = true;
    if (pin.body && pin.body !== ground) host = Math.max(host, layers.get(pin.body) || 0);
  }
  return hung ? host + 1 : 0;
}

function drawLayer(draw, layers) {
  if (!draw) return 0;
  if (draw.kind === "rope") return ropeHostLayer(draw, layers);
  return draw.body ? layers.get(draw.body) || 0 : 0;
}

function behindRopeIdsOf(draw) {
  const ids = draw && draw.meta && draw.meta.behindRopeIds;
  return ids && ids.length ? ids : null;
}

function drawingBehindRope(draw, rope) {
  if (!draw || !rope || rope.kind !== "rope" || draw.kind === "rope") return false;
  const ids = behindRopeIdsOf(draw);
  return !!(ids && ids.indexOf(rope.ropeId) >= 0);
}

// Negativ, wenn a vor b gezeichnet werden muss, weil a hinter diesem Seil entstand.
function ropeBehindOrder(a, b) {
  if (drawingBehindRope(a, b)) return -1;
  if (drawingBehindRope(b, a)) return 1;
  return 0;
}

// Zeichenreihenfolge: nach Ebene, innerhalb einer Ebene wie bisher.
// Ein hinter einem Seil geborener Körper kommt vor genau diesem Seil.
function drawingsByLayer() {
  const layers = bodyLayers();
  return drawings
    .map((d, i) => ({ d, i, l: drawLayer(d, layers) }))
    .sort((p, q) => ropeBehindOrder(p.d, q.d) || p.l - q.l || p.i - q.i)
    .map((p) => p.d);
}

function ropeSamplePoints(rope) {
  const pts = [];
  for (const body of (rope && rope.bodies) || []) {
    if (!body || (typeof body.isValid === "function" && !body.isValid())) continue;
    const p = body.getPosition();
    pts.push({ x: p.x, y: p.y });
  }
  return pts;
}

function segCrosses(a, b, c, d) {
  const side = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  const d1 = side(c, d, a);
  const d2 = side(c, d, b);
  const d3 = side(a, b, c);
  const d4 = side(a, b, d);
  return ((d1 > 1e-8 && d2 < -1e-8) || (d1 < -1e-8 && d2 > 1e-8))
    && ((d3 > 1e-8 && d4 < -1e-8) || (d3 < -1e-8 && d4 > 1e-8));
}

function segGap(a, b, c, d) {
  if (segCrosses(a, b, c, d)) return 0;
  return Math.min(
    distPointSeg(a.x, a.y, c.x, c.y, d.x, d.y),
    distPointSeg(b.x, b.y, c.x, c.y, d.x, d.y),
    distPointSeg(c.x, c.y, a.x, a.y, b.x, b.y),
    distPointSeg(d.x, d.y, a.x, a.y, b.x, b.y),
  );
}

function ropeCrossesPoly(samples, poly) {
  if (!poly || poly.length < 3) return false;
  for (const p of samples) {
    if (pointInPoly(p.x, p.y, poly)) return true;
  }
  for (let i = 0; i < samples.length - 1; i++) {
    const a = samples[i];
    const b = samples[i + 1];
    for (let k = 0; k < poly.length; k++) {
      if (segCrosses(a, b, poly[k], poly[(k + 1) % poly.length])) return true;
    }
  }
  return false;
}

function ropeEntersCircle(samples, cx, cy, r) {
  for (const p of samples) {
    if (Math.hypot(p.x - cx, p.y - cy) < r) return true;
  }
  for (let i = 0; i < samples.length - 1; i++) {
    const a = samples[i];
    const b = samples[i + 1];
    if (distPointSeg(cx, cy, a.x, a.y, b.x, b.y) < r) return true;
  }
  return false;
}

function ropeMeetsStroke(samples, stroke, reach) {
  if (!stroke || stroke.length < 2) return false;
  for (let i = 0; i < samples.length - 1; i++) {
    for (let k = 0; k < stroke.length - 1; k++) {
      if (segGap(samples[i], samples[i + 1], stroke[k], stroke[k + 1]) < reach) return true;
    }
  }
  return false;
}

function bornOutlineWorld(body, local) {
  const pts = [];
  for (const p of local) {
    const w = body.getWorldPoint(V(p.x, p.y));
    pts.push({ x: w.x, y: w.y });
  }
  return pts;
}

// true, wenn die Seilmittellinie die fertige Form schneidet oder in ihr liegt.
function bornOverRope(draw, rope) {
  const samples = ropeSamplePoints(rope);
  if (samples.length < 2 || !draw || !draw.body || !draw.meta) return false;
  const meta = draw.meta;
  const pos = draw.body.getPosition();
  const ang = draw.body.getAngle();
  const ca = Math.cos(ang);
  const sa = Math.sin(ang);
  if (meta.circles && meta.circles.length) {
    for (const c of meta.circles) {
      const cx = pos.x + c.x * ca - c.y * sa;
      const cy = pos.y + c.x * sa + c.y * ca;
      if (ropeEntersCircle(samples, cx, cy, c.r)) return true;
    }
    return false;
  }
  if (!meta.outline || !meta.outline.local || meta.outline.local.length < 2) return false;
  const world = bornOutlineWorld(draw.body, meta.outline.local);
  if (meta.outline.closed) return ropeCrossesPoly(samples, world);
  return ropeMeetsStroke(samples, world, (meta.thick || THICK) * 0.5);
}

// Geburtsregel: überdeckt die fertige Form ein vorhandenes Seil, bleibt der
// Körper hinter genau diesem Seil. Die Liste klebt am Paar.
function markBornBehindRopes(draw) {
  if (!draw || !draw.body || !draw.meta || draw.kind === "rope") return;
  const ids = [];
  for (const rope of drawings) {
    if (!rope || rope.kind !== "rope" || rope.ropeId == null) continue;
    if (bornOverRope(draw, rope) && ids.indexOf(rope.ropeId) < 0) ids.push(rope.ropeId);
  }
  if (!ids.length) return;
  draw.meta.behindRopeIds = ids;
}

// Eine Seilhälfte nach dem Schnitt bleibt dasselbe Seil für die Geburtsregel.
function carryRopeBehind(oldId, newId) {
  if (oldId == null || newId == null || oldId === newId) return;
  for (const d of drawings) {
    const ids = d.meta && d.meta.behindRopeIds;
    if (!ids || ids.indexOf(oldId) < 0 || ids.indexOf(newId) >= 0) continue;
    ids.push(newId);
  }
}

function poseOfBody(body) {
  const p = body.getPosition();
  return { x: p.x, y: p.y, a: body.getAngle() };
}

function proxyFor(shape, index) {
  const proxy = new planck.DistanceProxy();
  proxy.set(shape, index);
  // Kerngeometrie: Polygone und Kanten ohne Hautradius, Kreise leicht kleiner.
  if (shape.m_type === "circle") proxy.m_radius = Math.max(0, shape.m_radius - GHOST_CIRCLE_TOL);
  else proxy.m_radius = 0;
  return proxy;
}

function childCount(shape) {
  return shape.getChildCount ? shape.getChildCount() : 1;
}
