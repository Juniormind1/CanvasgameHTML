function editorClick(worldPt) {
  const doc = editorDoc;
  if (editorTool === "ball") doc.ball = [worldPt.x, worldPt.y];
  else if (editorTool === "star") doc.stars.push([worldPt.x, worldPt.y]);
  else if (editorTool === "pin") doc.pins.push([worldPt.x, worldPt.y]);
  else if (editorTool === "erase") {
    const near = (arr, map) => {
      let bi = -1;
      let bd = 0.7;
      arr.forEach((item, i) => {
        const p = map(item);
        const d = Math.hypot(p[0] - worldPt.x, p[1] - worldPt.y);
        if (d < bd) { bd = d; bi = i; }
      });
      if (bi >= 0) arr.splice(bi, 1);
      return bi >= 0;
    };
    if (near(doc.stars, (s) => s)) return;
    if (near(doc.pins, (s) => s)) return;
    if (near(doc.rockets, (s) => [s.x, s.y])) return;
    for (let i = doc.strokes.length - 1; i >= 0; i--) {
      const pts = doc.strokes[i].points;
      for (const p of pts) {
        if (Math.hypot(p[0] - worldPt.x, p[1] - worldPt.y) < 0.45) {
          doc.strokes.splice(i, 1);
          return;
        }
      }
    }
  }
}

function onPointerDown(e) {
  if (e.button === 1) {
    pointer = { pan: true, x: e.clientX, y: e.clientY, cx: cam.cx, cy: cam.cy };
    return;
  }
  const hit = ui.find((b) => e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h);
  if (hit) {
    pointer = { ui: true };
    hit.onClick();
    return;
  }
  if (e.button === 2) {
    const w = screenToWorld(e.clientX, e.clientY);
    if (mode === "play" && !releaseAnchorAt(w.x, w.y)) eraseAt(w.x, w.y);
    if (mode === "editor") editorClick(w);
    return;
  }
  if (mode === "help") return;
  if (mode === "map") {
    const tog = mapDemoToggleAt(e.clientX, e.clientY);
    if (tog) {
      setMapDemo(tog);
      pointer = { id: e.pointerId, ui: true };
      return;
    }
    if (mapDemo === "trebuchet" && mapDemoBandHit(e.clientX, e.clientY)) {
      onTrebuchetClick();
      pointer = { id: e.pointerId, ui: true };
      return;
    }
    const rec = cradleBallAt(e.clientX, e.clientY);
    if (rec && beginCradleDrag(rec)) {
      cradleDrag.goal = screenToCradle(e.clientX, e.clientY);
      pointer = { id: e.pointerId, cradle: true };
      canvas.setPointerCapture(e.pointerId);
    }
    return;
  }
  const w = screenToWorld(e.clientX, e.clientY);
  if (mode === "editor" && editorTool !== "terrain" && editorTool !== "decor" && editorTool !== "rocket") {
    editorClick(w);
    pointer = { tap: true };
    return;
  }
  let kind = mode === "play" ? pressKind(w.x, w.y) : "draw";
  const nailHit = mode === "play" && kind !== "nudge" ? nearestPin(w.x, w.y, NAIL_HIT) : null;
  if (nailHit && kind === "drag") kind = "draw";
  const ink = w;
  pointer = {
    id: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    wx: w.x,
    wy: w.y,
    pts: kind === "drag" ? null : [inkPoint(ink.x, ink.y, e)],
    moved: false,
    rocket: mode === "editor" && editorTool === "rocket",
    downT: performance.now(),
    grab: null,
    trail: [{ x: w.x, y: w.y }],
    nailClick: nailHit || null,
  };
  if (kind === "nudge") {
    const bp = ball.getPosition();
    pointer.onBall = true;
    pointer.nudgeDir = nudgeDirFromClick(bp.x, w.x);
  } else if (kind === "drag") {
    pointer.grab = { x: w.x, y: w.y };
    engageGrab(pointer.grab);
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
}

function distToPolyEdges(x, y, polyPts) {
  let best = Infinity;
  for (let i = 0; i < polyPts.length; i++) {
    const a = polyPts[i];
    const b = polyPts[(i + 1) % polyPts.length];
    best = Math.min(best, distPointSeg(x, y, a.x, a.y, b.x, b.y));
  }
  return best;
}

// Gezeichnete Kugeln (nicht die Spielkugel) haben eine Innenfläche wie andere
// Formen, sobald der Radius mindestens GRAB_BALL_MIN_R ist: Kringel macht dort
// einen Nagel, ein langer Zug aus der Mitte greift, der Rand greift sofort.
function circleInradius(meta) {
  let r = 0;
  for (const c of meta.circles) r = Math.max(r, c.r - Math.hypot(c.x, c.y));
  return r;
}

function bodyInradius(meta) {
  if (!meta) return 0;
  if (meta.circles && meta.circles.length) return circleInradius(meta);
  if (!meta.outline || !meta.outline.closed) return 0;
  const local = meta.outline.local;
  if (!pointInPoly(0, 0, local) && distToPoly(0, 0, local) > 0) return 0;
  return distToPolyEdges(0, 0, local);
}

function contourClearance(meta, x, y) {
  if (!meta || !meta.body) return 0;
  if (meta.circles && meta.circles.length) {
    const cp = meta.body.getLocalPoint(V(x, y));
    let best = 0;
    for (const c of meta.circles) best = Math.max(best, c.r - Math.hypot(cp.x - c.x, cp.y - c.y));
    return best;
  }
  if (!meta.outline || !meta.outline.closed) return 0;
  const lp = meta.body.getLocalPoint(V(x, y));
  if (!pointInPoly(lp.x, lp.y, meta.outline.local)) return 0;
  return distToPolyEdges(lp.x, lp.y, meta.outline.local);
}

function bodyAlwaysGrab(draw) {
  if (!draw) return false;
  if (draw.kind === "wire" || draw.kind === "rope") return true;
  if (draw.meta && draw.meta.kind === "ball") return true;
  if (draw.meta && draw.meta.circles && draw.meta.circles.length && bodyInradius(draw.meta) < GRAB_BALL_MIN_R) return true;
  const need = tuneCode("grabEdge", GRAB_EDGE) + GRAB_MIN_INTERIOR;
  return bodyInradius(draw.meta) <= need;
}

function pressZone(x, y) {
  const draw = drawingAt(x, y);
  if (!draw) return "empty";
  if (bodyAlwaysGrab(draw)) return "edge";
  if (contourClearance(draw.meta, x, y) <= tuneCode("grabEdge", GRAB_EDGE)) return "edge";
  return "interior";
}

function pressKind(x, y) {
  if (ball) {
    const bp = ball.getPosition();
    if (Math.hypot(bp.x - x, bp.y - y) < BALL_R * 1.3) return "nudge";
  }
  // Solange etwas auf einem Körper ruht, bleibt er liegen. Der Strich kann
  // nach oben in die Auflage verbinden; Wegziehen beginnt hier nicht.
  const under = drawingAt(x, y);
  if (under && under.body && loadRestingOn(under.body)) return "draw";
  if (pressZone(x, y) === "edge") return "drag";
  return "draw";
}

// Langer Zug aus der Innenfläche, der sich nicht zum Kringel schließt: nachträglich greifen.
function tryAdoptCenterGrab(trail) {
  if (!pointer || pointer.dragging || playDrag || !world) return false;
  if (!trail || trail.length < 2) return false;
  if (pointer.nailClick) return false;
  const from = trail[0];
  if (nearestPin(from.x, from.y, NAIL_HIT)) return false;
  if (pressZone(from.x, from.y) !== "interior") return false;
  const adoptHost = drawingAt(from.x, from.y);
  if (adoptHost && loadRestingOn(adoptHost.body)) return false;
  let maxD = 0;
  for (const p of trail) {
    const d = Math.hypot(p.x - from.x, p.y - from.y);
    if (d > maxD) maxD = d;
  }
  if (maxD <= tuneCode("grabAdopt", GRAB_ADOPT)) return false;
  const to = trail[trail.length - 1];
  if (Math.hypot(to.x - from.x, to.y - from.y) < 0.4) return false;
  pointer.grab = { x: from.x, y: from.y };
  engageGrab(to);
  if (!playDrag) {
    pointer.grab = null;
    return false;
  }
  pointer.moved = true;
  return true;
}

function engageGrab(worldPt) {
  if (!pointer || !pointer.grab || playDrag) return;
  if (!beginDrag(pointer.grab.x, pointer.grab.y)) return;
  moveDrag(worldPt.x, worldPt.y);
  pointer.pts = null;
  pointer.grab = null;
  pointer.dragging = true;
}

function onPointerMove(e) {
  if (!pointer) return;
  if (pointer.pan) {
    const s = camScale();
    cam.cx = pointer.cx - (e.clientX - pointer.x) / s;
    cam.cy = pointer.cy + (e.clientY - pointer.y) / s;
    return;
  }
  if (pointer.cradle) {
    cradleDrag.goal = screenToCradle(e.clientX, e.clientY);
    return;
  }
  const w = screenToWorld(e.clientX, e.clientY);
  pointer.wx = w.x;
  pointer.wy = w.y;
  if (pointer.trail) {
    const tl = pointer.trail[pointer.trail.length - 1];
    if (Math.hypot(w.x - tl.x, w.y - tl.y) > 0.02) pointer.trail.push({ x: w.x, y: w.y });
  }
  if (pointer.dragging && playDrag) {
    moveDrag(w.x, w.y);
    pointer.moved = true;
    return;
  }
  if (pointer.grab) {
    engageGrab(w);
    return;
  }
  if (!pointer.pts) return;
  const ink = w;
  const last = pointer.pts[pointer.pts.length - 1];
  if (Math.hypot(ink.x - last.x, ink.y - last.y) > 0.04) {
    pointer.pts.push(inkPoint(ink.x, ink.y, e));
    pointer.moved = true;
  }
  if (mode === "play") {
    tryAdoptAnchorGrab(pointer.trail);
    if (pointer && pointer.pts) tryAdoptCenterGrab(pointer.trail);
  }
}

function onPointerUp(e) {
  if (!pointer) return;
  const current = pointer;
  pointer = null;
  if (current.trail) {
    const up = screenToWorld(e.clientX, e.clientY);
    const tl = current.trail[current.trail.length - 1];
    if (Math.hypot(up.x - tl.x, up.y - tl.y) > 0.02) current.trail.push({ x: up.x, y: up.y });
  }
  if (current.dragging || playDrag || current.grab) {
    const held = playDrag && playDrag.body
      ? { body: playDrag.body, at: playDrag.body.getWorldPoint(V(playDrag.local.x, playDrag.local.y)), ghost: !!playDrag.ghost, group: playDrag.groupSet || null }
      : null;
    // Ein Geist springt in endDrag an seinen Schatten zurück und heftet sich nicht an.
    endDrag();
    if (held && mode === "play") {
      const pinned = held.ghost ? 0 : tryPinDragEnd(held.body, held.group);
      if (!pinned) tryAnchorDragEnd(held.body, { x: held.at.x, y: held.at.y }, current.trail);
    }
    return;
  }
  if (current.cradle) {
    endCradleDrag();
    return;
  }
  if (current.pan || current.ui || current.tap) return;
  const w = screenToWorld(e.clientX, e.clientY);
  if (mode === "editor" && current.rocket) {
    const a = Math.atan2(w.y - current.pts[0].y, w.x - current.pts[0].x);
    editorDoc.rockets.push({ x: current.pts[0].x, y: current.pts[0].y, a: current.moved ? a : 0 });
    return;
  }
  if (!current.moved) {
    if (mode === "play") playClick(current, w);
    return;
  }
  if (mode === "play") finishPlayStroke(current.trail, current.pts);
  if (mode === "editor" && (editorTool === "terrain" || editorTool === "decor")) {
    let src = current.pts;
    if (strokeSnaps()) src = snapStrokePoints(src);
    const shaped = editorTool === "terrain" ? tidyTerrain(src) : src;
    editorDoc.strokes.push({
      kind: editorTool === "decor" ? "decor" : "terrain",
      color: editorTool === "decor" ? MAT.decor : MAT.terrain,
      points: shaped.map((p) => [p.x, p.y]),
    });
  }
}

// Kurzer Klick ohne Bewegung im Spiel.
// - Auf einem schlichten Nagel: nichts (zum Motor wird er per Kringel).
// - Auf einem Motornagel: links -> rechts -> Stillstand (Umlenkrolle) -> links.
// - Doppeltipp auf einen Nagel, der schon vor dem ersten Tipp da war, zieht ihn
//   heraus (beim Motornagel nimmt der zweite Tipp den Wechsel des ersten zurück).
// - In der Innenfläche eines Gegenstands oder auf dem Boden: neuer Nagel. Ein
//   schneller zweiter Klick auf diesen frischen Nagel ändert nichts.
// - Sonst (leeres Papier, Seil): Doppeltipp radiert wie bisher.
const CLICK_NAIL_MAX_MS = 600;   // längeres Drücken ohne Bewegung setzt keinen Nagel
const DOUBLE_TAP_MS = 320;

function playClick(current, w) {
  const now = performance.now();
  const quickPair = now - lastTap < DOUBLE_TAP_MS;
  if (current.nailClick) {
    const pin = current.nailClick;
    if (quickPair && lastTapPin === pin) {
      if (!lastTapMade && !pullPin(pin) && lastTapMotor != null) {
        pin.motor = lastTapMotor;
        applyNailMotor(pin);
      }
      lastTap = 0;
      lastTapPin = null;
      lastTapMade = false;
      lastTapMotor = null;
      return;
    }
    lastTap = now;
    lastTapPin = pin;
    lastTapMade = false;
    lastTapMotor = null;
    if (pin.isMotor) {
      lastTapMotor = pin.motor || 0;
      cycleNailMotor(pin);
    }
    return;
  }
  if (current.onBall) {
    lastTap = now;
    lastTapPin = null;
    lastTapMade = false;
    doNudge(current.nudgeDir);
    return;
  }
  const held = now - (current.downT || now);
  const made = held <= CLICK_NAIL_MAX_MS ? clickNailAt(w.x, w.y) : null;
  if (made) {
    lastTap = now;
    lastTapPin = made;
    lastTapMade = true;
    return;
  }
  if (quickPair && !lastTapPin) eraseAt(w.x, w.y);
  lastTap = now;
  lastTapPin = null;
  lastTapMade = false;
}

function finishPlayStroke(trail, pts) {
  const gesture = tryAnchorGesture(trail);
  if (gesture) return gesture;
  return commitStroke(pts || trail, null, trail || pts);
}

// Szenenzettel: vollständiger Spielstand als Text (Export/Import).
// Format: JSON (Feld v=1), dann deflate-raw falls verfügbar, sonst unkomprimiert,
// als base64url mit Präfix CGZ1: (komprimiert) oder CGJ1: (roh).
// Planck-interne Warmstart-Impulse und Kontaktgraphen werden nicht
// mitgeschrieben; Position und Geschwindigkeit schon. Deshalb trifft
// der unmittelbare Zustand zu, Bahnen nach Kontakt können leicht abweichen.

const SCENE_PREFIX_Z = "CGZ1:";
const SCENE_PREFIX_J = "CGJ1:";
const SCENE_SIDE_WALLS = [
  [{ x: -0.5, y: -2 }, { x: 0.4, y: -2 }, { x: 0.4, y: 18 }, { x: -0.5, y: 18 }],
  [{ x: 31.6, y: -2 }, { x: 32.5, y: -2 }, { x: 32.5, y: 18 }, { x: 31.6, y: 18 }],
];

function scenePt(p) {
  if (!p) return { x: 0, y: 0 };
  if (Array.isArray(p)) return { x: p[0], y: p[1] };
  return { x: p.x, y: p.y };
}

function clonePts(pts) {
  return (pts || []).map((p) => scenePt(p));
}

function ptsEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    const p = scenePt(a[i]);
    const q = scenePt(b[i]);
    if (Math.abs(p.x - q.x) > 1e-8 || Math.abs(p.y - q.y) > 1e-8) return false;
  }
  return true;
}

function isSideWallPts(pts) {
  return SCENE_SIDE_WALLS.some((w) => ptsEqual(w, pts));
}

function bytesToB64url(bytes) {
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function b64urlToBytes(text) {
  const pad = text.length % 4 === 0 ? "" : "=".repeat(4 - (text.length % 4));
  const bin = atob(text.replace(/-/g, "+").replace(/_/g, "/") + pad);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function utf8Bytes(str) {
  return new TextEncoder().encode(str);
}

function utf8String(bytes) {
  return new TextDecoder().decode(bytes);
}

function fixtureGroup(f) {
  if (f.getFilterData) {
    const d = f.getFilterData();
    if (d && d.groupIndex != null) return d.groupIndex;
  }
  if (typeof f.getFilterGroupIndex === "function") return f.getFilterGroupIndex();
  if (f.m_filter && f.m_filter.groupIndex != null) return f.m_filter.groupIndex;
  return 0;
}

function exportFixtures(body) {
  const list = [];
  for (let f = body.getFixtureList(); f; f = f.getNext()) {
    const sh = f.getShape();
    const rec = {
      density: f.getDensity(),
      friction: f.getFriction(),
      restitution: f.getRestitution(),
      sensor: !!f.isSensor(),
      group: fixtureGroup(f),
    };
    if (sh.m_type === "circle") {
      const p = sh.m_p || { x: 0, y: 0 };
      rec.shape = "circle";
      rec.x = p.x;
      rec.y = p.y;
      rec.r = sh.m_radius;
    } else if (sh.m_vertices && sh.m_count) {
      rec.shape = "polygon";
      rec.verts = [];
      for (let i = 0; i < sh.m_count; i++) {
        const v = sh.m_vertices[i];
        rec.verts.push({ x: v.x, y: v.y });
      }
    } else continue;
    list.push(rec);
  }
  return list;
}

function addExportedFixtures(body, fixtures) {
  let made = 0;
  for (const fx of fixtures || []) {
    const opt = {
      density: fx.density,
      friction: fx.friction,
      restitution: fx.restitution,
      isSensor: !!fx.sensor,
      filterGroupIndex: fx.group || 0,
    };
    if (fx.shape === "circle") {
      body.createFixture(new planck.Circle(V(fx.x || 0, fx.y || 0), fx.r), opt);
      made++;
    } else if (fx.shape === "polygon" && fx.verts && fx.verts.length >= 3) {
      if (makePolygonFixture(body, fx.verts, opt)) made++;
    }
  }
  return made;
}

function jointTypeName(j) {
  if (!j) return "";
  if (typeof j.getType === "function") return j.getType();
  const name = (j.constructor && j.constructor.name) || "";
  return String(name).toLowerCase();
}

function isMouseJoint(j) {
  const t = jointTypeName(j);
  return t === "mouse-joint" || t === "mousejoint";
}

function serializeLevelDef(def) {
  if (!def) return null;
  try {
    return JSON.parse(JSON.stringify({
      id: def.id || null,
      name: def.name || "",
      hint: def.hint || "",
      ball: def.ball,
      stars: def.stars,
      solids: def.solids,
      wires: def.wires,
      decor: def.decor,
      boxes: def.boxes,
      pins: def.pins,
      rockets: def.rockets,
      sandbox: !!def.sandbox,
      custom: !!def.custom,
    }));
  } catch (err) {
    return { id: def.id || null, name: def.name || "", ball: def.ball, stars: def.stars, solids: def.solids, wires: def.wires, decor: def.decor, sandbox: !!def.sandbox, custom: !!def.custom };
  }
}

function exportTerrainExtra(def) {
  const extra = { solids: [], wires: [], decor: [] };
  const knownSolids = (def && def.solids) || [];
  const knownWires = (def && def.wires) || [];
  const knownDecor = (def && def.decor) || [];
  for (const s of scenery) {
    if (s.kind === "poly" && s.pts) {
      if (isSideWallPts(s.pts)) continue;
      if (knownSolids.some((k) => ptsEqual(k.pts, s.pts))) continue;
      extra.solids.push({ pts: clonePts(s.pts), color: s.color });
    } else if (s.kind === "line" && s.pts) {
      if (knownWires.some((k) => ptsEqual(k.pts, s.pts))) continue;
      if (knownDecor.some((k) => ptsEqual(k.pts, s.pts))) continue;
      const inGeo = geometry.some((g) => !g.closed && ptsEqual(g.pts, s.pts));
      if (inGeo) extra.wires.push({ pts: clonePts(s.pts), color: s.color });
      else extra.decor.push({ pts: clonePts(s.pts), color: s.color, width: s.width || 0.12 });
    }
  }
  return extra;
}

function applyTerrainExtra(extra) {
  if (!extra) return;
  for (const s of extra.solids || []) addStaticSolid(s.pts, s.color);
  for (const w of extra.wires || []) addStaticWire(w.pts, w.color);
  for (const d of extra.decor || []) scenery.push({ kind: "line", pts: d.pts, color: d.color, width: d.width || 0.12 });
}

function exportOutline(outline) {
  if (!outline) return null;
  return {
    local: clonePts(outline.local),
    closed: !!outline.closed,
    color: outline.color || null,
    width: outline.width,
  };
}

function exportBodyState(body, id, role) {
  const meta = bodyMeta.get(body) || {};
  const p = body.getPosition();
  const lv = body.getLinearVelocity ? body.getLinearVelocity() : { x: 0, y: 0 };
  const rec = {
    id,
    role,
    kind: meta.kind || role,
    type: body.isStatic() ? "static" : "dynamic",
    x: p.x,
    y: p.y,
    angle: body.getAngle(),
    vx: lv.x || 0,
    vy: lv.y || 0,
    w: body.getAngularVelocity ? body.getAngularVelocity() : 0,
    bullet: !!body.isBullet(),
    ld: body.getLinearDamping(),
    ad: body.getAngularDamping(),
    fr: !!body.isFixedRotation(),
    awake: !!body.isAwake(),
    fixtures: exportFixtures(body),
  };
  if (meta.outline) rec.outline = exportOutline(meta.outline);
  if (meta.circles) rec.circles = meta.circles.map((c) => ({ x: c.x, y: c.y, r: c.r }));
  if (meta.ellipse) rec.ellipse = { a: meta.ellipse.a, b: meta.ellipse.b, angle: meta.ellipse.angle };
  if (meta.thick) rec.thick = meta.thick;
  if (meta.round) rec.round = true;
  if (meta.quadKind) rec.quadKind = meta.quadKind;
  if (meta.tag) rec.tag = meta.tag;
  if (meta.ropeId) rec.ropeId = meta.ropeId;
  if (meta.behindRopeIds && meta.behindRopeIds.length) rec.behindRopeIds = meta.behindRopeIds.slice();
  return rec;
}

function poseBody(body, rec) {
  if (!body || !rec) return;
  body.setTransform(V(rec.x, rec.y), rec.angle || 0);
  if (body.setLinearVelocity) body.setLinearVelocity(V(rec.vx || 0, rec.vy || 0));
  if (body.setAngularVelocity) body.setAngularVelocity(rec.w || 0);
  if (rec.bullet) body.setBullet(true);
  if (rec.fr) body.setFixedRotation(true);
  if (typeof rec.ld === "number") body.setLinearDamping(rec.ld);
  if (typeof rec.ad === "number") body.setAngularDamping(rec.ad);
  body.setAwake(rec.awake !== false);
}

function createRestoredBody(rec, asDynamic) {
  const typ = asDynamic || rec.anchor || rec.type !== "static" ? "dynamic" : "static";
  const body = world.createBody({
    type: typ,
    position: V(rec.x, rec.y),
    angle: rec.angle || 0,
    bullet: !!rec.bullet,
    fixedRotation: !!rec.fr,
    linearDamping: rec.ld == null ? 0 : rec.ld,
    angularDamping: rec.ad == null ? 0 : rec.ad,
  });
  addExportedFixtures(body, rec.fixtures);
  poseBody(body, rec);
  return body;
}

function drawingForBody(body) {
  return drawings.find((d) => d.body === body) || null;
}

function captureScene() {
  if (!world || mode !== "play") return null;
  endDrag();
  const idOf = new Map();
  let nextId = 1;
  idOf.set(ground, 0);
  function addId(body) {
    if (!body || idOf.has(body)) return idOf.get(body);
    const id = nextId++;
    idOf.set(body, id);
    return id;
  }
  addId(ball);
  for (const d of drawings) {
    if (d.kind === "rope") {
      for (const b of d.bodies || []) addId(b);
    } else addId(d.body);
  }
  for (const r of rockets) addId(r.body);
  for (const s of stars) addId(s.body);
  for (let b = world.getBodyList(); b; b = b.getNext()) addId(b);

  const bodies = [];
  function pushBody(body, role, extra) {
    if (!body || !idOf.has(body) || body === ground) return;
    const rec = exportBodyState(body, idOf.get(body), role);
    if (extra) Object.assign(rec, extra);
    bodies.push(rec);
  }

  if (ball) {
    const recExtra = { role: "ball", kind: "ball" };
    if (ball._cool) recExtra.cool = ball._cool;
    pushBody(ball, "ball", recExtra);
  }
  for (const d of drawings) {
    if (d.kind === "rope") {
      for (const b of d.bodies || []) {
        const meta = bodyMeta.get(b) || {};
        pushBody(b, "rope-bead", { drawKind: "rope", ropeId: d.ropeId || meta.ropeId, color: d.color || MAT.hemp });
      }
      continue;
    }
    const extra = {
      drawKind: d.kind,
      color: d.color || null,
    };
    if (d.preset) extra.preset = true;
    if (d.r) extra.r = d.r;
    if (d.a) extra.ea = d.a;
    if (d.b) extra.eb = d.b;
    pushBody(d.body, d.kind || "solid", extra);
  }
  for (const r of rockets) {
    const rec = r.body ? exportBodyState(r.body, idOf.get(r.body), "rocket") : { id: r.body ? idOf.get(r.body) : nextId++, role: "rocket", kind: "rocket" };
    rec.drawKind = "rocket";
    rec.color = "#d94b3a";
    rec.homeX = r.x;
    rec.homeY = r.y;
    rec.homeA = r.a || 0;
    rec.mode = r.mode;
    rec.timer = r.timer;
    rec.wait = r.wait;
    rec.armed = !!r.armed;
    if (!r.body) rec.gone = true;
    bodies.push(rec);
  }
  for (const s of stars) {
    if (!s.body) continue;
    const rec = exportBodyState(s.body, idOf.get(s.body), "star");
    rec.got = !!s.got;
    bodies.push(rec);
  }
  const seen = new Set(bodies.map((b) => b.id));
  seen.add(0);
  for (const [body, id] of idOf) {
    if (seen.has(id) || body === ground) continue;
    pushBody(body, "other", {});
  }

  const pinList = [];
  const pinIdOf = new Map();
  pins.forEach((pin, i) => {
    const id = i + 1;
    pinIdOf.set(pin, id);
    const wp = pinWorld(pin);
    const held = [];
    for (const j of pin.joints || []) {
      if (!j) continue;
      const a = j.getBodyA();
      const b = j.getBodyB();
      const other = a === pin.body ? b : b === pin.body ? a : null;
      if (!other || !idOf.has(other)) continue;
      if (bodyMeta.get(other) && bodyMeta.get(other).kind === "rope") continue;
      const loc = other.getLocalPoint(V(wp.x, wp.y));
      held.push({ body: idOf.get(other), local: { x: loc.x, y: loc.y } });
    }
    pinList.push({
      id,
      host: idOf.has(pin.body) ? idOf.get(pin.body) : 0,
      local: { x: pin.local.x, y: pin.local.y },
      x: wp.x,
      y: wp.y,
      userMade: !!pin.userMade,
      motor: pin.motor || 0,
      isMotor: !!(pin.isMotor || pin.motor),
      held,
    });
  });

  const ropes = [];
  const pulleyIds = new Map();
  for (const d of drawings) {
    if (d.kind !== "rope") continue;
    let pulleyRec = null;
    const pul = d.pulley;
    if (pul && pinIdOf.has(pul.pin)) {
      if (!pulleyIds.has(pul)) pulleyIds.set(pul, pulleyIds.size + 1);
      pulleyRec = {
        group: pulleyIds.get(pul),
        side: pul.sideA === d ? "A" : "B",
        pin: pinIdOf.get(pul.pin),
        length: pul.L,
        s: pul.s,
        wrap: pul.wrapSign || 1,
      };
    }
    const beads = (d.bodies || []).map((b) => idOf.get(b)).filter((id) => id != null);
    const segs = (d.segJoints || []).map((j) => ({
      length: j && j.length != null ? j.length : (j && j.dist && typeof j.dist.getLength === "function" ? j.dist.getLength() : ROPE_SPACING),
    }));
    ropes.push({
      ropeId: d.ropeId,
      color: d.color || MAT.hemp,
      restLength: d.restLength,
      drawnLength: d.drawnLength != null ? d.drawnLength : d.restLength,
      beads,
      segs,
      pinA: d.pinA && pinIdOf.has(d.pinA) ? pinIdOf.get(d.pinA) : null,
      pinB: d.pinB && pinIdOf.has(d.pinB) ? pinIdOf.get(d.pinB) : null,
      fixedPins: !!d.fixedPins,
      pulley: pulleyRec,
    });
  }

  const joints = [];
  for (let j = world.getJointList(); j; j = j.getNext()) {
    if (isMouseJoint(j)) continue;
    const a = idOf.get(j.getBodyA());
    const b = idOf.get(j.getBodyB());
    if (a == null || b == null) continue;
    const rec = { type: jointTypeName(j), a, b };
    if (typeof j.getLocalAnchorA === "function") {
      const la = j.getLocalAnchorA();
      const lb = j.getLocalAnchorB();
      rec.localA = { x: la.x, y: la.y };
      rec.localB = { x: lb.x, y: lb.y };
    }
    if (typeof j.getLength === "function") rec.length = j.getLength();
    if (typeof j.getMaxLength === "function") rec.maxLength = j.getMaxLength();
    joints.push(rec);
  }

  const anchorList = anchors.map((link) => {
    const ends = anchorLinkEnds(link);
    return {
      body: idOf.get(link.body),
      base: idOf.has(link.base) ? idOf.get(link.base) : 0,
      a: scenePt(ends.a),
      b: scenePt(ends.b),
      color: link.color || null,
      savedColor: link.savedColor || null,
      weld: !!link.weld,
      freeze: !!link.freeze,
      frozen: !!(link.weld && !link.joint),
    };
  }).filter((a) => a.body != null);

  return {
    v: 1,
    levelId: levelDef && levelDef.id ? levelDef.id : null,
    mode,
    geoSnap: !!geoSnap,
    tune: Object.assign({}, tuneVals || {}),
    cam: { cx: cam.cx, cy: cam.cy, zoom: cam.zoom },
    simTime,
    stats: Object.assign({}, stats),
    won: !!won,
    medals: Object.assign({}, medals),
    ropeSeq,
    level: serializeLevelDef(levelDef),
    terrainExtra: exportTerrainExtra(levelDef),
    bodies,
    pins: pinList,
    ropes,
    joints,
    anchors: anchorList,
  };
}

function validateScene(data) {
  if (!data || typeof data !== "object") return "Zettel ist leer.";
  if (data.v !== 1) return "Unbekannte Zettel-Version.";
  if (!Array.isArray(data.bodies)) return "Im Zettel fehlen die Körper.";
  return null;
}

function encodeSceneTextSync(data) {
  return SCENE_PREFIX_J + bytesToB64url(utf8Bytes(JSON.stringify(data)));
}

async function encodeSceneText(data) {
  const bytes = utf8Bytes(JSON.stringify(data));
  if (typeof CompressionStream !== "undefined") {
    try {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      const buf = await new Response(stream).arrayBuffer();
      return SCENE_PREFIX_Z + bytesToB64url(new Uint8Array(buf));
    } catch (err) { /* unkomprimiert */ }
  }
  return encodeSceneTextSync(data);
}

function decodeSceneTextSync(text) {
  const raw = String(text || "").trim();
  if (!raw) return { ok: false, error: "Kein Zettel-Text." };
  try {
    if (raw.startsWith(SCENE_PREFIX_J)) {
      const data = JSON.parse(utf8String(b64urlToBytes(raw.slice(SCENE_PREFIX_J.length))));
      const err = validateScene(data);
      return err ? { ok: false, error: err } : { ok: true, data };
    }
    if (raw.startsWith("{")) {
      const data = JSON.parse(raw);
      const err = validateScene(data);
      return err ? { ok: false, error: err } : { ok: true, data };
    }
    if (raw.startsWith(SCENE_PREFIX_Z)) return { ok: false, error: "compressed", compressed: raw };
  } catch (err) {
    return { ok: false, error: "Zettel ist beschädigt." };
  }
  return { ok: false, error: "Unbekanntes Zettel-Format." };
}

async function decodeSceneText(text) {
  const sync = decodeSceneTextSync(text);
  if (sync.ok || !sync.compressed) {
    if (sync.error === "compressed") {
      return { ok: false, error: "Dieser Zettel ist komprimiert und lässt sich hier nicht öffnen." };
    }
    return sync;
  }
  if (typeof DecompressionStream === "undefined") {
    return { ok: false, error: "Dieser Zettel ist komprimiert und lässt sich hier nicht öffnen." };
  }
  try {
    const bytes = b64urlToBytes(sync.compressed.slice(SCENE_PREFIX_Z.length));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const buf = await new Response(stream).arrayBuffer();
    const data = JSON.parse(utf8String(new Uint8Array(buf)));
    const err = validateScene(data);
    return err ? { ok: false, error: err } : { ok: true, data };
  } catch (err) {
    return { ok: false, error: "Zettel ist beschädigt." };
  }
}

function showSceneMessage(text, isError) {
  let el = document.getElementById("scene-toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "scene-toast";
    el.style.cssText = "position:fixed;z-index:8;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:rgba(255,252,240,0.96);border:2px solid #5c4632;border-radius:10px;padding:8px 14px;color:#3a2a1c;font:14px system-ui,sans-serif;box-shadow:0 8px 24px rgba(60,40,20,0.18);";
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.borderColor = isError ? "#a33" : "#5c4632";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, 4500);
  const st = document.getElementById("tune-scene-status");
  if (st) {
    st.textContent = text;
    st.className = isError ? "err" : "";
  }
}

function fallbackLevelDef(data) {
  if (data.level && (data.level.solids || data.level.ball)) return data.level;
  if (data.levelId && LEVELS[data.levelId]) return serializeLevelDef(LEVELS[data.levelId]);
  return serializeLevelDef(LEVELS.sandbox || LEVELS["ein-klotz"]);
}

function restoreMeta(body, rec) {
  const outline = rec.outline ? {
    local: clonePts(rec.outline.local),
    closed: !!rec.outline.closed,
    color: rec.outline.color || rec.color || MAT.wood,
    width: rec.outline.width == null ? 0.13 : rec.outline.width,
    fixed: false,
  } : null;
  const meta = {
    kind: rec.kind || rec.role || "draw",
    outline,
  };
  if (rec.circles) meta.circles = rec.circles.map((c) => ({ x: c.x, y: c.y, r: c.r }));
  if (rec.ellipse) meta.ellipse = { a: rec.ellipse.a, b: rec.ellipse.b, angle: rec.ellipse.angle };
  if (rec.thick) meta.thick = rec.thick;
  if (rec.round) meta.round = true;
  if (rec.quadKind) meta.quadKind = rec.quadKind;
  if (rec.tag) meta.tag = rec.tag;
  if (rec.ropeId) meta.ropeId = rec.ropeId;
  if (rec.behindRopeIds && rec.behindRopeIds.length) meta.behindRopeIds = rec.behindRopeIds.slice();
  return track(body, meta);
}

function applyScene(data, opt) {
  if (!data) throw new Error("no scene");
  const err = validateScene(data);
  if (err) throw new Error(err);
  endDrag();
  scenePaused = false;
  const def = fallbackLevelDef(data);
  beginPlayWorld(def, { resetCam: false });
  applyTerrainExtra(data.terrainExtra);
  mode = "play";

  const ids = { 0: ground };
  const bodyRec = {};
  for (const rec of data.bodies || []) bodyRec[rec.id] = rec;

  function restoreOne(rec, forceRole) {
    const role = forceRole || rec.role || rec.kind;
    if (role === "star") {
      const star = addStarAt(rec.x, rec.y, rec.got);
      ids[rec.id] = star.body;
      poseBody(star.body, rec);
      return star.body;
    }
    if (role === "rocket") {
      const rocket = makeRocket({ x: rec.homeX != null ? rec.homeX : rec.x, y: rec.homeY != null ? rec.homeY : rec.y, a: rec.homeA || rec.angle || 0 });
      rocket.mode = rec.mode || "idle";
      rocket.timer = rec.timer || 0;
      rocket.wait = rec.wait || 0;
      rocket.armed = !!rec.armed;
      if (rec.gone || rec.mode === "gone") {
        if (rocket.body) {
          bodyMeta.delete(rocket.body);
          world.destroyBody(rocket.body);
          rocket.body = null;
        }
        return null;
      }
      if (rec.mode === "fly" && rocket.body) {
        rocket.body.setDynamic();
        rocket.body.setBullet(true);
      }
      if (rec.fixtures && rec.fixtures.length && rocket.body) {
        // keep makeRocket fixtures; pose is enough
      }
      poseBody(rocket.body, rec);
      ids[rec.id] = rocket.body;
      return rocket.body;
    }
    if (role === "ball") {
      const b = spawnQuestBall(rec.x, rec.y);
      // replace default fixture with exported ones if present
      if (rec.fixtures && rec.fixtures.length) {
        for (let f = b.getFixtureList(); f; ) {
          const n = f.getNext();
          b.destroyFixture(f);
          f = n;
        }
        addExportedFixtures(b, rec.fixtures);
      }
      poseBody(b, rec);
      if (rec.cool) b._cool = rec.cool;
      ids[rec.id] = b;
      return b;
    }
    const wantStatic = rec.type === "static";
    const body = createRestoredBody(rec, true);
    const meta = restoreMeta(body, rec);
    if (role === "rope-bead" || rec.kind === "rope") {
      meta.kind = "rope";
      if (rec.ropeId) meta.ropeId = rec.ropeId;
      ids[rec.id] = body;
      return body;
    }
    const drawKind = rec.drawKind || (role === "wire" ? "wire" : role === "blob" ? "blob" : role === "ellipse" ? "ellipse" : role === "roller" ? "roller" : "solid");
    const draw = { kind: drawKind, body, meta, color: rec.color || (meta.outline && meta.outline.color) || MAT.wood };
    if (rec.preset) draw.preset = true;
    if (rec.r) draw.r = rec.r;
    if (rec.ellipse) {
      draw.a = rec.ellipse.a;
      draw.b = rec.ellipse.b;
      draw.angle = rec.ellipse.angle;
      draw.x = rec.x;
      draw.y = rec.y;
    }
    if (drawKind === "blob" || drawKind === "roller") {
      draw.x = rec.x;
      draw.y = rec.y;
      draw.r = rec.r || (rec.circles && rec.circles[0] && rec.circles[0].r);
    }
    drawings.push(draw);
    // Kringel-Kugeln aus älteren Zetteln stehen ohne Bullet. Dieselbe
    // Physik wie beim Zeichnen, sonst versinken sie im Seil.
    if (body.isDynamic() && (drawKind === "blob" || drawKind === "roller" || drawKind === "ellipse")) {
      body.setBullet(true);
    }
    if (wantStatic && !body.isStatic()) {
      // Verankerung setzt gleich setStatic; hier nur merken, nicht vorab frieren,
      // außer der Körper ist ohne Anker als statisch gespeichert.
    }
    ids[rec.id] = body;
    return body;
  }

  for (const rec of data.bodies || []) {
    const role = rec.role || rec.kind;
    if (role === "rope-bead" || rec.kind === "rope") continue;
    restoreOne(rec);
  }
  for (const rec of data.bodies || []) {
    const role = rec.role || rec.kind;
    if (role === "rope-bead" || rec.kind === "rope") restoreOne(rec);
  }

  const pinById = {};
  for (const pn of data.pins || []) {
    const host = ids[pn.host];
    if (!host) continue;
    const wp = pn.local
      ? host.getWorldPoint(V(pn.local.x, pn.local.y))
      : V(pn.x, pn.y);
    const pin = rememberPin(wp.x, wp.y, host, !!pn.userMade);
    pin.motor = pn.motor || 0;
    pin.isMotor = !!(pn.isMotor || pn.motor);
    pinById[pn.id] = pin;
  }

  for (const pn of data.pins || []) {
    const pin = pinById[pn.id];
    if (!pin) continue;
    for (const hold of pn.held || []) {
      const other = ids[hold.body];
      if (!other || other === pin.body) continue;
      const wp = pin.body.getWorldPoint(V(pin.local.x, pin.local.y));
      const localB = hold.local ? V(hold.local.x, hold.local.y) : other.getLocalPoint(V(wp.x, wp.y));
      const joint = world.createJoint(new planck.RevoluteJoint({
        bodyA: pin.body,
        bodyB: other,
        localAnchorA: V(pin.local.x, pin.local.y),
        localAnchorB: localB,
        collideConnected: false,
      }));
      pin.joints.push(joint);
    }
    applyNailMotor(pin);
  }

  const pulleyGroups = {};
  for (const rp of data.ropes || []) {
    const bodies = (rp.beads || []).map((id) => ids[id]).filter(Boolean);
    if (bodies.length < 2) continue;
    const segJoints = [];
    for (let i = 0; i < bodies.length - 1; i++) {
      const len = (rp.segs && rp.segs[i] && rp.segs[i].length) || ROPE_SPACING;
      segJoints.push(linkRopeSegment(world, bodies[i], bodies[i + 1], len));
    }
    const pinA = rp.pinA != null ? pinById[rp.pinA] || null : null;
    const pinB = rp.pinB != null ? pinById[rp.pinB] || null : null;
    const endJoints = attachRopePins(world, pinA, pinB, bodies);
    let restLength = rp.restLength;
    if (restLength == null) restLength = segJoints.reduce((s, j) => s + (j && j.length ? j.length : 0), 0);
    const spanJoint = (pinA && pinB) ? world.createJoint(new planck.RopeJoint({
      bodyA: bodies[0],
      bodyB: bodies[bodies.length - 1],
      localAnchorA: V(0, 0),
      localAnchorB: V(0, 0),
      maxLength: restLength * ROPE_MAX_STRETCH,
      collideConnected: false,
    })) : null;
    const ropeId = rp.ropeId || ropeSeq++;
    for (const body of bodies) {
      const meta = bodyMeta.get(body);
      if (meta) meta.ropeId = ropeId;
    }
    drawings.push({
      kind: "rope",
      ropeId,
      bodies,
      color: rp.color || MAT.hemp,
      restLength,
      drawnLength: typeof rp.drawnLength === "number" ? rp.drawnLength : restLength,
      segJoints,
      endJoints,
      spanJoint,
      chordJoint: createRopeChord(world, pinA, pinB, restLength),
      pinA: pinA || null,
      pinB: pinB || null,
      fixedPins: !!rp.fixedPins,
    });
    if (rp.pulley && rp.pulley.group != null) {
      const g = pulleyGroups[rp.pulley.group] || (pulleyGroups[rp.pulley.group] = { rec: rp.pulley });
      g[rp.pulley.side === "A" ? "A" : "B"] = drawings[drawings.length - 1];
    }
  }
  // Umlenkungen wieder zusammensetzen (42-umlenkrolle.js).
  for (const key of Object.keys(pulleyGroups)) {
    const g = pulleyGroups[key];
    const pin = pinById[g.rec.pin];
    if (!g.A || !g.B || !pin || !g.A.pinA || !g.B.pinB || g.A.pinA.body === g.B.pinB.body) continue;
    makePulley(world, g.A, g.B, pin, g.rec.length || (g.A.restLength + g.B.restLength), { s: g.rec.s, wrapSign: g.rec.wrap });
  }

  for (const link of data.anchors || []) {
    const body = ids[link.body];
    const base = link.base == null ? ground : ids[link.base];
    if (!body || !base) continue;
    const draw = drawingForBody(body);
    if (!draw) continue;
    if (playDrag && playDrag.body === body) endDrag();
    const weld = !!link.weld;
    const freeze = !weld;
    let joint = null;
    if (freeze || link.frozen) {
      if (body.isDynamic()) body.setStatic();
      if (weld && base !== ground && base.isDynamic()) base.setStatic();
    } else if (base !== ground && base.isDynamic() && body.isDynamic()) {
      joint = makeAnchorWeld(base, body);
    }
    dragFresh.delete(body);
    const a = scenePt(link.a);
    const b = scenePt(link.b);
    const locals = anchorLinkLocals(base, body, a, b);
    anchors.push({
      body,
      base,
      draw,
      a,
      b,
      localA: locals.localA,
      localB: locals.localB,
      color: link.color || draw.color,
      savedColor: link.savedColor || draw.color,
      weld,
      freeze,
      joint,
    });
    if (link.color) paintDraw(draw, link.color);
  }

  // Übrige statische Körper ohne Anker (sollten selten sein).
  for (const rec of data.bodies || []) {
    if (rec.type !== "static") continue;
    if (rec.role === "star" || rec.role === "rocket" || rec.role === "ball") continue;
    const body = ids[rec.id];
    if (!body || body === ground) continue;
    if (anchors.some((a) => a.body === body)) continue;
    if (body.isDynamic()) body.setStatic();
  }

  if (typeof data.simTime === "number") simTime = data.simTime;
  if (data.stats) stats = Object.assign({}, stats, data.stats);
  won = !!data.won;
  if (data.medals) medals = Object.assign({}, medals, data.medals);
  if (typeof data.ropeSeq === "number" && data.ropeSeq > ropeSeq) ropeSeq = data.ropeSeq;
  else {
    let maxId = ropeSeq;
    for (const d of drawings) {
      if (d.ropeId && d.ropeId >= maxId) maxId = d.ropeId + 1;
    }
    ropeSeq = maxId;
  }
  geoSnap = !!data.geoSnap;
  if (data.cam) {
    if (typeof data.cam.cx === "number") cam.cx = data.cam.cx;
    if (typeof data.cam.cy === "number") cam.cy = data.cam.cy;
    if (typeof data.cam.zoom === "number") cam.zoom = data.cam.zoom;
  }
  if (data.tune && typeof data.tune === "object") {
    if (!tuneVals || !Object.keys(tuneVals).length) tuneVals = tuneDefaults();
    for (const key of Object.keys(data.tune)) {
      if (TUNE_BY_KEY[key]) tuneVals[key] = data.tune[key];
    }
    if (tuneOn) {
      for (const spec of TUNE_SPEC) refreshTuneSlider(spec.key);
    }
  }
  if (playClock) playClock.acc = 0;
  scenePaused = !!(opt && opt.pause);
  namebox.style.display = "none";
  return true;
}

async function loadSceneFromText(text, opt) {
  const decoded = await decodeSceneText(text);
  if (!decoded.ok) return decoded;
  try {
    applyScene(decoded.data, opt || {});
    return { ok: true };
  } catch (err) {
    try { showMap(); } catch (err2) { /* ignorieren */ }
    return { ok: false, error: "Zettel konnte nicht geladen werden." };
  }
}

function loadSceneFromTextSync(text, opt) {
  const decoded = decodeSceneTextSync(text);
  if (!decoded.ok) {
    if (decoded.compressed) return { ok: false, error: "Dieser Zettel ist komprimiert; bitte über das Tune-Panel laden." };
    return decoded;
  }
  try {
    applyScene(decoded.data, opt || {});
    return { ok: true };
  } catch (err) {
    try { showMap(); } catch (err2) { /* ignorieren */ }
    return { ok: false, error: "Zettel konnte nicht geladen werden." };
  }
}

async function copySceneToClipboard() {
  const data = captureScene();
  if (!data) {
    showSceneMessage("Kein Spielstand. Öffne zuerst ein Level.", true);
    return { ok: false };
  }
  const text = await encodeSceneText(data);
  const area = document.getElementById("tune-scene-text");
  const markFallback = () => {
    if (!area) {
      window.prompt("Zettel kopieren:", text);
      return false;
    }
    area.value = text;
    area.focus();
    area.select();
    try {
      if (document.execCommand && document.execCommand("copy")) return true;
    } catch (err) { /* markiert lassen */ }
    return false;
  };
  let copied = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (err) {
      copied = markFallback();
    }
  } else copied = markFallback();
  const msg = (copied ? "kopiert" : "Text markiert — bitte kopieren") + " (" + text.length + " Zeichen)";
  showSceneMessage(msg, false);
  const copyBtn = document.getElementById("tune-scene-copy");
  if (copyBtn) {
    const old = copyBtn.textContent;
    copyBtn.textContent = msg;
    setTimeout(() => { copyBtn.textContent = old; }, 1600);
  }
  return { ok: true, text, copied };
}

async function loadSceneFromPanel() {
  const area = document.getElementById("tune-scene-text");
  const text = area ? area.value : "";
  const res = await loadSceneFromText(text, {});
  if (!res.ok) showSceneMessage(res.error || "Zettel konnte nicht geladen werden.", true);
  else showSceneMessage("Zettel geladen.", false);
  return res;
}

// Planck skaliert den gespeicherten Kontakt- und Gelenkimpuls beim Warmstart mit
// dtRatio = dt / dt_vorher. Früher wurde der Rest eines Frames als eigener
// Mini-Schritt gerechnet (bei 17 ms zum Beispiel 16.67 ms + 0.3 ms). Der volle
// Schritt danach hat dann dtRatio um 50 bis über 1000 und multipliziert den
// Aufprallimpuls aus dem Mini-Schritt entsprechend. Deshalb rechnet die Physik
// nur in festen Schritten, der Rest wartet auf den nächsten Frame.
const FIXED_DT = 1 / 60;
const playClock = { acc: 0 };
const mapClock = { acc: 0 };

function advanceFixed(clock, dt, stepFn) {
  clock.acc = Math.min(clock.acc + Math.max(0, dt), FIXED_DT * 3);
  let n = 0;
  while (clock.acc >= FIXED_DT - 1e-7) {
    stepFn(FIXED_DT);
    clock.acc -= FIXED_DT;
    n++;
  }
  if (clock.acc < 0) clock.acc = 0;
  return n;
}

function boot() {
  makePaper();
  resize();
  window.addEventListener("resize", resize);
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", () => {
    pointer = null;
    endDrag();
    endCradleDrag();
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.shiftKey) cam.zoom = clamp(cam.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.55, 2.4);
  }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (e.target === namebox) return;
    if (e.key === "r" || e.key === "R") {
      if (mode === "play" && levelDef) buildLevel(levelDef);
    } else if (e.key === "m" || e.key === "M" || e.key === "Escape") {
      if (returnMode === "editor" && editorDoc && mode === "play") {
        endDrag();
        mode = "editor";
        world = null;
        namebox.style.display = "block";
        returnMode = "map";
      } else showMap();
    } else if (e.key === "h" || e.key === "H") mode = "help";
    else if (e.key === "0") resetCam();
  });
  const params = new URLSearchParams(location.search);
  if (params.get("tune") === "1" && params.get("test") !== "1") {
    tuneOn = true;
    loadTuneVals();
    mountTunePanel();
  }
  const sceneText = params.get("scene") || window.__CRAYON_SCENE || null;
  const wantPause = params.get("pause") === "1" || !!window.__CRAYON_SCENE_PAUSE;
  const startLoop = () => {
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (pointer && pointer.grab && !pointer.dragging) {
        const at = pointer.wx == null ? pointer.grab : { x: pointer.wx, y: pointer.wy };
        engageGrab(at);
      }
      if (mode === "play" && !scenePaused) advanceFixed(playClock, dt, step);
      else if (mode === "map") advanceFixed(mapClock, dt, mapDemo === "trebuchet" ? stepTrebuchet : stepCradle);
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };
  if (params.get("test") === "1") {
    runTests();
    startLoop();
  } else if (sceneText) {
    Promise.resolve(loadSceneFromText(sceneText, { pause: wantPause })).then((res) => {
      if (!res || !res.ok) {
        showMap();
        showSceneMessage((res && res.error) || "Zettel konnte nicht geladen werden.", true);
      }
      startLoop();
    });
  } else if (params.get("shot")) {
    const id = params.get("shot");
    if (id === "feier") {
      buildLevel(LEVELS["ein-klotz"]);
      for (const star of stars) star.got = true;
    } else if (id === "material") {
      buildLevel(LEVELS["ein-klotz"]);
      const ring = (cx, cy, r, n) => {
        let pts = [];
        for (let i = 0; i <= n; i++) {
          const a = (i / n) * Math.PI * 2;
          pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
        return pts;
      };
      commitStroke([
        { x: 12.0, y: 1.3 }, { x: 16.2, y: 1.3 }, { x: 16.2, y: 3.5 }, { x: 12.0, y: 3.5 }, { x: 12.0, y: 1.3 },
      ]);
      commitStroke([
        { x: 19.6, y: 1.3 }, { x: 20.3, y: 1.3 }, { x: 20.3, y: 7.0 }, { x: 19.6, y: 7.0 }, { x: 19.6, y: 1.3 },
      ]);
      commitStroke([
        { x: 27.1, y: 1.3 }, { x: 27.8, y: 1.3 }, { x: 27.8, y: 7.0 }, { x: 27.1, y: 7.0 }, { x: 27.1, y: 1.3 },
      ]);
      for (let i = 0; i < 45; i++) step(1 / 60);
      commitStroke(ring(19.95, 7.08, 0.16, 10));
      commitStroke(ring(27.45, 7.08, 0.16, 10));
      const matPins = pins.filter((p) => p.userMade);
      if (matPins.length >= 2) {
        spawnRope(matPins[0], matPins[1], [
          { x: 19.95, y: 7.08 }, { x: 23.7, y: 4.8 }, { x: 27.45, y: 7.08 },
        ]);
      }
      commitStroke(ring(6.2, 3.6, 1.05, 28));
      commitStroke([{ x: 8.8, y: 1.38 }, { x: 11.0, y: 3.3 }]);
      for (let i = 0; i < 100; i++) step(1 / 60);
    } else if (id === "vierecke") {
      buildLevel(LEVELS["ein-klotz"]);
      const rotPts = (cx, cy, rot, local) => {
        const a = rot * Math.PI / 180;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const pts = local.map((p) => ({ x: cx + p.x * ca - p.y * sa, y: cy + p.x * sa + p.y * ca }));
        pts.push({ x: pts[0].x, y: pts[0].y });
        return pts;
      };
      const forms = [
        { x: 5.4, y: 8.2, rot: 12, name: "Rechteck", local: [{ x: -1.5, y: -0.9 }, { x: 1.5, y: -0.9 }, { x: 1.5, y: 0.9 }, { x: -1.5, y: 0.9 }] },
        { x: 11.6, y: 8.2, rot: 8, name: "Rampe", local: [{ x: -1.55, y: -0.75 }, { x: 1.55, y: -0.75 }, { x: 0.35, y: 0.75 }, { x: -1.55, y: 0.75 }] },
        { x: 18.2, y: 8.2, rot: 18, name: "Parallelogramm", local: [{ x: -1.55, y: -0.7 }, { x: 1.15, y: -0.7 }, { x: 1.65, y: 0.7 }, { x: -1.05, y: 0.7 }] },
        { x: 25.0, y: 8.2, rot: -10, name: "Trapez", local: [{ x: -1.8, y: -0.7 }, { x: 1.8, y: -0.7 }, { x: 1.05, y: 0.7 }, { x: -1.05, y: 0.7 }] },
      ];
      shotCaptions = [];
      for (const f of forms) {
        commitStroke(rotPts(f.x, f.y, f.rot, f.local));
        shotCaptions.push({ x: f.x, y: f.y - 1.7, text: f.name });
      }
      for (let i = 0; i < 2; i++) step(1 / 60);
    } else if (id === "rauten") {
      buildLevel(LEVELS["ein-klotz"]);
      const rautenSet = [
        [6.5, 8.2, 1.15, 1.15, 0],
        [11.2, 8.2, 1.15, 1.15, 30],
        [16.0, 8.2, 1.15, 1.15, 45],
        [21.0, 8.2, 1.15, 1.15, 60],
        [26.0, 8.4, 1.35, 0.95, 25],
      ];
      for (const [cx, cy, hw, hh, rot] of rautenSet) {
        const a = rot * Math.PI / 180;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const pts = [
          { x: cx + (-hw) * ca - (-hh) * sa, y: cy + (-hw) * sa + (-hh) * ca },
          { x: cx + (hw) * ca - (-hh) * sa, y: cy + (hw) * sa + (-hh) * ca },
          { x: cx + (hw) * ca - (hh) * sa, y: cy + (hw) * sa + (hh) * ca },
          { x: cx + (-hw) * ca - (hh) * sa, y: cy + (-hw) * sa + (hh) * ca },
        ];
        pts.push({ x: pts[0].x, y: pts[0].y });
        commitStroke(pts);
      }
      for (let i = 0; i < 2; i++) step(1 / 60);
    } else if (id === "nagel-seil") {
      buildLevel(LEVELS["ein-klotz"]);
      if (ball) {
        ball.setTransform(V(3.2, 2.2), 0);
        ball.setLinearVelocity(V(0, 0));
        ball.setAngularVelocity(0);
      }
      rememberPin(9.0, 4.4, ground, true);
      rememberPin(15.2, 4.4, ground, true);
      commitStroke([
        { x: 7.4, y: 3.7 }, { x: 16.8, y: 3.7 }, { x: 16.8, y: 5.1 }, { x: 7.4, y: 5.1 }, { x: 7.4, y: 3.7 },
      ]);
      rememberPin(21.2, 8.2, ground, true);
      const hangPin = pins[pins.length - 1];
      spawnRope(hangPin, null, [
        { x: 21.2, y: 8.2 }, { x: 24.0, y: 7.4 }, { x: 26.4, y: 5.2 }, { x: 27.2, y: 3.0 },
      ]);
      for (let i = 0; i < 90; i++) step(1 / 60);
    } else if (id === "geist" || id === "windrad") {
      // Ebenen per Nagel: Säule verankert, Nagel im Kopf, Brett davor.
      buildLevel(LEVELS["ein-klotz"]);
      if (ball) ball.setTransform(V(3.2, 1.66), 0);
      const col = makeBox({ x: 12, y: 4.35, hw: 0.5, hh: 3.0 });
      for (let i = 0; i < 20; i++) step(1 / 60);
      anchorBody(drawings.find((d) => d.body === col), ground, { x: 12, y: 1.3 }, { x: 12, y: 1.8 });
      rememberPin(12, 6.6, col, true);
      const board = makeBox({ x: 12, y: 6.6, hw: 2.6, hh: 0.22, color: MAT.wood });
      attachExistingPins(board, bodyMeta.get(board));
      if (id === "windrad") {
        // Zwei Würfel an Nägeln in den Brettenden: nächste Ebene davor.
        board.setTransform(board.getPosition(), 0.3);
        for (const sx of [-2.1, 2.1]) {
          const at = board.getWorldPoint(V(sx, 0));
          rememberPin(at.x, at.y, board, true);
          const cube = makeBox({ x: at.x, y: at.y - 0.3, hw: 0.5, hh: 0.5, color: MAT.wood });
          attachExistingPins(cube, bodyMeta.get(cube));
        }
        for (let i = 0; i < 60; i++) step(1 / 60);
        cam.cx = 12;
        cam.cy = 5.2;
        cam.zoom = 1.9;
      } else {
        makeBox({ x: 19, y: 2.1, hw: 0.8, hh: 0.8 });
        for (let i = 0; i < 30; i++) step(1 / 60);
        const held = makeBox({ x: 23.5, y: 2.1, hw: 0.7, hh: 0.7, color: MAT.wood });
        for (let i = 0; i < 20; i++) step(1 / 60);
        beginDrag(23.5, 2.1);
        for (let i = 1; i <= 40; i++) {
          moveDrag(23.5 + (19.6 - 23.5) * i / 40, 2.1 + (2.5 - 2.1) * i / 40);
          step(1 / 60);
        }
        void held;
        cam.cx = 17;
        cam.cy = 4.2;
        cam.zoom = 1.7;
      }
    } else if (id === "seilwinde") {
      // Seilwinde: links rechtsrum (spult auf), rechts linksrum (spult ab).
      buildLevel(LEVELS.sandbox);
      if (ball) ball.setTransform(V(4, 1.66), 0);
      const rig = (x, motor) => {
        const nail = rememberPin(x, 9, ground, true);
        const box = makeBox({ x, y: 5.0, hw: 0.5, hh: 0.5, color: MAT.wood });
        const hook = rememberPin(x, 5.5, box, true);
        spawnRope(nail, hook, [{ x, y: 9 }, { x, y: 7.25 }, { x, y: 5.5 }]);
        nail.motor = motor;
        nail.isMotor = true;
        applyNailMotor(nail);
      };
      rig(12, -1);
      rig(20, 1);
      for (let i = 0; i < 150; i++) step(1 / 60);
      shotCaptions = [
        { x: 12, y: 10.2, text: "rechtsrum: spult auf" },
        { x: 20, y: 10.2, text: "linksrum: spult ab" },
      ];
      cam.cx = 16;
      cam.cy = 6.2;
      cam.zoom = 1.6;
    } else if (id === "trebuchet" || id === "trebuchet-wurf") {
      showMap();
      setMapDemo("trebuchet");
      releaseTrebuchet();
      for (let i = 0; i < 240 && treb && treb.hooked; i++) stepTrebuchet(1 / 60);
      for (let i = 0; i < 36; i++) stepTrebuchet(1 / 60);
      if (treb) treb.frozen = true;
    } else if (id === "trebuchet-schale") {
      showMap();
      setMapDemo("trebuchet");
      if (treb) treb.frozen = true;
    } else if (LEVELS[id]) buildLevel(LEVELS[id]);
    else showMap();
  } else showMap();
  if (params.get("test") !== "1" && !sceneText) startLoop();
}

function runTests() {
  const lines = [];
  function check(name, cond) {
    lines.push((cond ? "PASS " : "FAIL ") + name);
  }
  try {
    buildLevel(LEVELS["ein-klotz"]);
    commitStroke([
      { x: 3.7, y: 2.5 }, { x: 5.2, y: 2.5 }, { x: 5.2, y: 4.8 }, { x: 3.7, y: 4.8 }, { x: 3.7, y: 2.5 },
    ], "#3c7fd6");
    for (let i = 0; i < 180; i++) step(1 / 60);
    const b1 = ball.getPosition();
    check("klotz moves ball", b1.x > 7.5 || stars.every((s) => s.got));

    {
      // Regression: Rest-Teilschritte im Frame-Loop haben den Warmstart-Impuls
      // vervielfacht. Unregelmäßige Form fällt auf Rechteck auf Klotz.
      const jumpFrames = { even: [0.0172], ragged: [0.0201, 0.0133, 0.0168], jitter: [0.0168, 0.0165, 0.0171, 0.0163, 0.0174, 0.0167] };
      for (const jumpName of Object.keys(jumpFrames)) {
        const jumpDts = jumpFrames[jumpName];
        buildLevel(LEVELS["ein-klotz"]);
        world.destroyBody(ball);
        ball = null;
        stars = [];
        const jumpBlock = makeBox({ x: 16, y: 2.4, hw: 2.2, hh: 0.4, color: "#3c7fd6" });
        for (let i = 0; i < 60; i++) step(1 / 60);
        const jumpTop = jumpBlock.getPosition().y + 0.4;
        const jumpRect = commitStroke([
          { x: 15, y: jumpTop + 1.2 }, { x: 17, y: jumpTop + 1.2 }, { x: 17, y: jumpTop + 2.2 }, { x: 15, y: jumpTop + 2.2 }, { x: 15, y: jumpTop + 1.2 },
        ], "#d94b3a");
        const zig = [{ x: 15, y: jumpTop + 4 }];
        for (let k = 0; k < 5; k++) {
          zig.push({ x: 15.35 + k * 0.5, y: jumpTop + 5.1 });
          zig.push({ x: 15.6 + k * 0.5, y: jumpTop + 4.25 });
        }
        zig.push({ x: 17.8, y: jumpTop + 5.2 }, { x: 17.8, y: jumpTop + 3.7 }, { x: 15, y: jumpTop + 3.7 }, { x: 15, y: jumpTop + 4 });
        const jumpIrr = commitStroke(zig, "#3e9a48");
        const jumpBodies = [jumpBlock, jumpRect && jumpRect.body, jumpIrr && jumpIrr.body].filter(Boolean);
        const jumpSpeed = (b) => Math.hypot(b.getLinearVelocity().x, b.getLinearVelocity().y);
        const jumpTouch = (b) => {
          for (let c = b.getContactList(); c; c = c.next) if (c.contact.isTouching()) return true;
          return false;
        };
        const jumpClock = { acc: 0 };
        let vHit = 0;
        let tHit = -1;
        let vAfter = 0;
        let frameNo = 0;
        while (jumpIrr && jumpIrr.body && simTime < 4.5) {
          advanceFixed(jumpClock, jumpDts[frameNo++ % jumpDts.length], step);
          if (tHit < 0) {
            vHit = Math.max(vHit, jumpSpeed(jumpIrr.body));
            if (jumpTouch(jumpIrr.body)) tHit = simTime;
          } else if (simTime > tHit + 0.1) {
            for (const b of jumpBodies) vAfter = Math.max(vAfter, jumpSpeed(b));
          }
        }
        const jumpEndY = jumpIrr && jumpIrr.body ? jumpIrr.body.getPosition().y : 999;
        check("no velocity jump after impact (" + jumpName + " frames)", jumpBodies.length === 3 && tHit > 0 && vAfter < vHit * 0.5 && jumpEndY < jumpTop + 3);
        lines.push("INFO impact " + jumpName + " vHit " + vHit.toFixed(2) + " vAfter " + vAfter.toFixed(2) + " endY " + jumpEndY.toFixed(2));
      }
      check("frame rest waits for the next fixed step", advanceFixed({ acc: 0 }, 0.0172, () => {}) === 1 && advanceFixed({ acc: 0 }, 0.0005, () => {}) === 0);
      buildLevel(LEVELS["ein-klotz"]);
      const spiky = [];
      for (let k = 0; k < 16; k++) {
        const ang = k * Math.PI / 8;
        const rr = k % 2 ? 0.55 : 2.1;
        const da = k % 2 ? 0 : 0.015;
        spiky.push({ x: 16 + rr * Math.cos(ang - da), y: 9 + rr * Math.sin(ang - da) });
        if (!(k % 2)) spiky.push({ x: 16 + rr * Math.cos(ang + da), y: 9 + rr * Math.sin(ang + da) });
      }
      spiky.push({ x: spiky[0].x, y: spiky[0].y });
      const spikyDraw = commitStroke(spiky, "#7a4fbf");
      let thinFix = 0;
      let boxFix = 0;
      let polyFix = 0;
      for (let f = spikyDraw && spikyDraw.body ? spikyDraw.body.getFixtureList() : null; f; f = f.getNext()) {
        const sh = f.getShape();
        if (!sh.m_vertices || sh.m_type !== "polygon") continue;
        polyFix++;
        const vs = [];
        for (let k = 0; k < sh.m_count; k++) vs.push(sh.m_vertices[k]);
        if (polyMinWidth(vs) < MIN_FIX_H - 1e-9) thinFix++;
        if (vs.some((v) => Math.hypot(v.x, v.y) > 2.4)) boxFix++;
      }
      check("thin spikes give no sliver fixtures", !!spikyDraw && spikyDraw.kind === "solid" && polyFix > 0 && thinFix === 0 && boxFix === 0);
      const flatBody = world.createDynamicBody({ position: V(5, 9) });
      check("degenerate polygon is rejected, not a 2 m box", !makePolygonFixture(flatBody, [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }], fixtureOpt()) && !flatBody.getFixtureList());
      world.destroyBody(flatBody);
    }

    buildLevel(LEVELS["die-luecke"]);
    let maxAlone = ball.getPosition().x;
    doNudge(1);
    for (let i = 0; i < 220; i++) {
      step(1 / 60);
      maxAlone = Math.max(maxAlone, ball.getPosition().x);
    }
    check("one nudge does not clear the gap", maxAlone < 18);

    buildLevel(LEVELS["die-luecke"]);
    commitStroke([
      { x: 6.2, y: 5.1 }, { x: 9, y: 5.24 }, { x: 13, y: 5.02 },
      { x: 17, y: 5.2 }, { x: 21, y: 5.05 }, { x: 24.4, y: 5.14 },
    ], "#8d5a34");
    const bridge = drawings.find((d) => d.kind === "wire");
    check("wobbly bridge straightens", !!bridge && bridge.meta.outline.local.length === 2);
    for (let i = 0; i < 30; i++) step(1 / 60);
    const by0 = bridge ? bridge.body.getPosition().y : -1;
    doNudge(1);
    let climbed = false;
    for (let i = 0; i < 240; i++) {
      step(1 / 60);
      const p = ball.getPosition();
      if (p.x > 12 && p.y > 4.6) climbed = true;
    }
    check("bridge stays up", !!bridge && bridge.body.getPosition().y > 3);
    check("one nudge climbs the bridge", climbed);
    lines.push("INFO bridge y0 " + by0.toFixed(2) + " y " + (bridge ? bridge.body.getPosition().y.toFixed(2) : "none") + " ball " + ball.getPosition().x.toFixed(2) + "," + ball.getPosition().y.toFixed(2) + " nudges " + stats.nudges);

    buildLevel(LEVELS["der-nagel"]);
    const before = ball.getPosition().x;
    commitStroke([
      { x: 0.7, y: 14.0 }, { x: 16.8, y: 14.0 }, { x: 16.8, y: 15.4 }, { x: 0.7, y: 15.4 }, { x: 0.7, y: 14.0 },
    ], "#3c7fd6");
    check("hammer pinned", drawings.some((d) => d.kind === "solid"));
    for (let i = 0; i < 220; i++) step(1 / 60);
    check("hammer shoves ball", ball.getPosition().x > before + 1.2 || stars.every((s) => s.got));

    buildLevel(LEVELS["zwei-naegel"]);
    commitStroke([
      { x: 11.3, y: 4.72 }, { x: 20.7, y: 4.72 }, { x: 20.7, y: 5.38 }, { x: 11.3, y: 5.38 }, { x: 11.3, y: 4.72 },
    ], "#c9854a");
    const board = drawings.find((d) => d.kind === "solid" && !d.preset);
    const y0 = board ? board.body.getPosition().y : 0;
    for (let i = 0; i < 150; i++) step(1 / 60);
    check("two pins hold the board", !!board && board.body.getPosition().y > y0 - 0.8);

    buildLevel(LEVELS["das-seil"]);
    const pa = pins[0];
    const pb = pins[1];
    const aw = pinWorld(pa);
    const bw = pinWorld(pb);
    const sagMx = (aw.x + bw.x) / 2;
    const sagCurve = [
      aw,
      { x: aw.x + (bw.x - aw.x) * 0.25, y: Math.min(aw.y, bw.y) - 0.9 },
      { x: sagMx, y: Math.min(aw.y, bw.y) - 1.3 },
      { x: aw.x + (bw.x - aw.x) * 0.75, y: Math.min(aw.y, bw.y) - 0.9 },
      bw,
    ];
    commitStroke(sagCurve, "#2b2b2b");
    const rope = drawings.find((d) => d.kind === "rope");
    check("rope created", !!rope);
    for (let i = 0; i < 120; i++) step(1 / 60);
    if (rope) {
      const mid = rope.bodies[Math.floor(rope.bodies.length / 2)].getPosition();
      check("rope sags", mid.y < Math.min(aw.y, bw.y) - 0.45);
    } else lines.push("FAIL rope sags");

    buildLevel(LEVELS["das-seil"]);
    const hangPa = pins[0];
    const hangPb = pins[1];
    const hangAw = pinWorld(hangPa);
    const hangBw = pinWorld(hangPb);
    const hangMx = (hangAw.x + hangBw.x) / 2;
    const hangSmooth = [
      hangAw,
      { x: hangAw.x + (hangBw.x - hangAw.x) * 0.5, y: hangAw.y - 2.2 },
      hangBw,
    ];
    const hangZig = [
      hangAw,
      { x: hangAw.x + (hangBw.x - hangAw.x) * 0.2, y: hangAw.y - 1.4 },
      { x: hangAw.x + (hangBw.x - hangAw.x) * 0.4, y: hangAw.y - 0.2 },
      { x: hangAw.x + (hangBw.x - hangAw.x) * 0.6, y: hangAw.y - 1.4 },
      { x: hangAw.x + (hangBw.x - hangAw.x) * 0.8, y: hangAw.y - 0.2 },
      hangBw,
    ];
    const smoothLen = pathLength(hangSmooth);
    const zigLen = pathLength(hangZig);
    commitStroke(hangSmooth, "#2b2b2b");
    const hangSmoothRope = drawings.find((d) => d.kind === "rope");
    check("smooth hanging rope keeps the stroke length", !!hangSmoothRope && Math.abs(hangSmoothRope.restLength - smoothLen) < 0.08);
    const hangBallY0 = hangAw.y - 1.2;
    ball.setTransform(V(hangMx, hangBallY0), 0);
    ball.setLinearVelocity(V(0, 0));
    ball.setAngularVelocity(0);
    for (let i = 0; i < 240; i++) step(1 / 60);
    const hangLive = hangSmoothRope ? ropeChainLength(hangSmoothRope) : 99;
    const hangBall = ball.getPosition();
    const hangFinite = Number.isFinite(hangLive) && Number.isFinite(hangBall.x) && Number.isFinite(hangBall.y);
    check("rope under a ball stays within 102 percent of its drawn length", !!hangSmoothRope && hangFinite && hangLive <= hangSmoothRope.restLength * 1.02);
    check("rope under a ball does not drop it to the ground", hangFinite && hangBall.y > 8.4);
    lines.push("INFO rope-load live=" + hangLive.toFixed(3) + " rest=" + (hangSmoothRope ? hangSmoothRope.restLength.toFixed(3) : "none") + " ball=" + hangBall.x.toFixed(2) + "," + hangBall.y.toFixed(2));
    buildLevel(LEVELS["das-seil"]);
    commitStroke(hangZig, "#2b2b2b");
    const hangZigRope = drawings.find((d) => d.kind === "rope");
    lines.push("INFO rope-wiggle rest=" + (hangZigRope ? hangZigRope.restLength.toFixed(3) : "none") + " zig=" + zigLen.toFixed(3) + " smooth=" + smoothLen.toFixed(3));
    check("a wiggly stroke makes a longer rope than a smooth curve", !!hangZigRope && hangZigRope.restLength > zigLen - 0.08 && hangZigRope.restLength > smoothLen + 0.25);

    function cutWedgePts(tipX, tipY, tipAng, pointA, len) {
      const half = tipAng / 2;
      const w = Math.tan(half) * len;
      const ca = Math.cos(pointA);
      const sa = Math.sin(pointA);
      const local = [{ x: 0, y: 0 }, { x: -len, y: w }, { x: -len, y: -w }];
      return local.map((p) => ({
        x: tipX + p.x * ca - p.y * sa,
        y: tipY + p.x * sa + p.y * ca,
      }));
    }
    function ropePieces() {
      return drawings.filter((d) => d.kind === "rope");
    }
    function prepCutRope() {
      buildLevel(LEVELS["ein-klotz"]);
      addStaticSolid([[6, 5.4], [8.4, 5.4], [8.4, 7.2], [6, 7.2]], "#3f8f55");
      addStaticSolid([[15.6, 5.4], [18, 5.4], [18, 7.2], [15.6, 7.2]], "#3f8f55");
      const cutPa = rememberPin(7.2, 7.2, hostAt(7.2, 7.2) || ground, false);
      const cutPb = rememberPin(16.8, 7.2, hostAt(16.8, 7.2) || ground, false);
      const cutAw = pinWorld(cutPa);
      const cutBw = pinWorld(cutPb);
      return spawnRope(cutPa, cutPb, [cutAw, cutBw]);

      function gvFarLocal(draw, other) {
        const locals = draw.meta.outline.local;

        let bestD = -1;
        for (const p of locals) {
          const w = draw.body.getWorldPoint(V(p.x, p.y));
          const d = Math.hypot(w.x - op.x, w.y - op.y);
          if (d > bestD) {

      }
      function gvRefs(body, lx, ly, speed) {
        const g = body.getWorldPoint(V(lx, ly));
        const group = weldComponent(body);
        let mass = 0;
        let cx = 0;
        let cy = 0;
        let aloneM = body.getMass();
        let aloneI = body.getInertia();
        const ap = body.getPosition();
        const aox = ap.x - g.x;
        const aoy = ap.y - g.y;
        aloneI += aloneM * (aox * aox + aoy * aoy);
        for (const b of group) {
          const m = b.getMass();
          const p = b.getPosition();
          mass += m;
          cx += m * p.x;
          cy += m * p.y;
        }
        cx /= mass;
        cy /= mass;
        let inertia = 0;
        for (const b of group) {
          const m = b.getMass();
          const p = b.getPosition();
          const rx = p.x - g.x;
          const ry = p.y - g.y;
          inertia += b.getInertia() + m * (rx * rx + ry * ry);
        }
        const offx = cx - g.x;
        const offy = cy - g.y;
        return {
          group: Math.abs(mass * offx * speed / inertia),
          alone: Math.abs(aloneM * aox * speed / aloneI),
